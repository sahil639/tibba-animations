<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extra case studies — reel</title>
<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/workbench.css">
<script src="assets/manifest.js"></script>
<script src="assets/whats-new.js"></script>
<script src="assets/workbench.js" defer></script>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Extra case studies — on the Work Reel
   ─────────────────────────────────────────────────────────────────────────
   The work that does not get a summit, run through the Work Reel from the
   miscellaneous folder (assets/work-reel.js, unchanged): the labels turned
   along the floor, one plate opening at a time as the page scrolls. On
   black. Each case's name stands as the reel's rotated label until its
   plate is the active one; then the label steps aside and the name and a
   subtitle are set INSIDE the plate, at its foot — one title on screen,
   never two. Padding and the active threshold are CAPTION in the script.

   Along the very bottom, an altitude tape. It runs horizontally and slides
   RIGHT as the page scrolls, locked to the reel's own scroll progress, under
   a fixed orange caret that reads the altitude off it. Each case is pinned
   to the tape as a camp, so the climb and the reel are one scale: when a
   case's plate is open, its camp is under the caret.

   The plates are drawn in script as honest placeholders — contour rings and
   the case's own name — until real case imagery replaces them.
   ═════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink: #FFFFFF; --ghost: rgba(233, 236, 242, .26); --tape-h: 68px; }
html { scroll-behavior: auto; }
body { background: #000; color: var(--ink-warm); font-family: 'F37 Analog', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

.reel-scope { position: relative; height: 600vh; }
.reel-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }

/* ── the reel, as on its own page, re-inked for black and lifted off the
   floor to make room for the tape ─────────────────────────────────────── */
.reel-strip { position: absolute; left: 0; bottom: var(--tape-h); display: flex; align-items: flex-end; will-change: transform; }
.reel-item { display: flex; align-items: flex-end; flex: 0 0 auto; }
.reel-label { --near: 0; flex: 0 0 var(--reel-label-w, 207px); width: var(--reel-label-w, 207px); display: flex; align-items: flex-end;
  padding-bottom: 18px; font-size: clamp(18px, 1.6vw, 30px); letter-spacing: -.01em; line-height: 1; white-space: nowrap;
  color: color-mix(in srgb, var(--ink) calc(var(--near) * 100%), var(--ghost)); }
.reel-label span { writing-mode: vertical-rl; transform: rotate(180deg); }
.reel-shot { flex: 0 0 auto; height: calc(100vh - var(--tape-h) - 250px); height: calc(100svh - var(--tape-h) - 250px); overflow: hidden; border-radius: 6px 6px 0 0; align-self: flex-end; position: relative; }
.reel-shot img { display: block; height: 100%; object-fit: cover; max-width: none; border-radius: 6px 6px 0 0; filter: saturate(.85) brightness(.9); }
.reel-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ── the case copy, above the plates ─────────────────────────────────── */
.cs-head { position: absolute; left: var(--gut); right: var(--gut); top: clamp(70px, 10vh, 100px); display: grid;
  grid-template-columns: 1fr auto; gap: clamp(20px, 3vw, 56px); align-items: start; z-index: 3; }
.cs-head .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.cs-head h1 { margin-top: 12px; color: #fff; font-weight: 400; font-size: clamp(20px, 1.9vw, 30px); line-height: 1.1; letter-spacing: -.02em; }
/* ── the caption, inside the active plate ───────────────────────────────
   Sits at the plate's foot with --cap-pad-x / --cap-pad-b of padding, over a
   short scrim so it reads on any image. Width is the plate's full width, so
   the text never re-wraps as the plate opens and closes around it. */
.reel-label span { transition: opacity var(--cap-out, .25s) linear; }
.reel-item.is-active .reel-label span { opacity: 0; transition-duration: var(--cap-out, .25s); }
.reel-cap {
  position: absolute; left: 0; bottom: 0; width: var(--cap-w, 480px); z-index: 2; pointer-events: none;
  padding: 80px var(--cap-pad-x, 32px) var(--cap-pad-b, 36px);
  background: linear-gradient(0deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,0) 100%);
  opacity: 0; transition: opacity var(--cap-out, .25s) linear;
}
.reel-cap .nm { color: #fff; font-size: clamp(22px, 2.2vw, 36px); letter-spacing: -.025em; line-height: 1.02; }
.reel-cap .ds { margin-top: 10px; color: var(--ink-warm); font-size: 13px; line-height: 1.55; max-width: 44ch; opacity: .82; }
.reel-cap .tg { margin-top: 10px; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.reel-cap > * { transform: translateY(var(--cap-rise, 14px)); transition: transform var(--cap-out, .25s) var(--ease); }
.reel-item.is-active .reel-cap { opacity: 1; transition: opacity var(--cap-in, .5s) linear var(--cap-delay, .05s); }
.reel-item.is-active .reel-cap > * { transform: none; transition: transform var(--cap-in, .5s) cubic-bezier(.16,.62,.36,1) var(--cap-delay, .05s); }
.reel-item.is-active .reel-cap .ds { transition-delay: calc(var(--cap-delay, .05s) + .06s); }
.reel-item.is-active .reel-cap .tg { transition-delay: calc(var(--cap-delay, .05s) + .12s); }
.cs-count { font-size: 11px; letter-spacing: .14em; color: var(--ink-faint); font-variant-numeric: tabular-nums; text-align: right; }
.cs-count b { color: #fff; font-weight: 400; font-size: 22px; letter-spacing: -.02em; display: block; margin-bottom: 4px; }

/* ── the altitude tape ───────────────────────────────────────────────── */
.tape { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tape-h); z-index: 4; overflow: hidden;
  background: #000; border-top: 1px solid rgba(255,255,255,.14); }
.tape svg { position: absolute; left: 0; top: 0; height: 100%; max-width: none; will-change: transform; }
.tape .tk { stroke: rgba(233,236,242,.35); stroke-width: 1; }
.tape .tk.m { stroke: rgba(233,236,242,.7); }
.tape .lb { fill: rgba(233,236,242,.6); font: 400 10px 'F37 Analog', system-ui, sans-serif; letter-spacing: .12em; }
.tape .camp rect { fill: #000; stroke: var(--accent); }
.tape .camp.on rect { fill: var(--accent); }
.tape .camp text { fill: rgba(233,236,242,.5); font: 400 9px 'F37 Analog', system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
.tape .camp.on text { fill: #fff; }
.caret { position: absolute; left: 50%; bottom: 0; height: var(--tape-h); width: 1px; background: var(--accent); z-index: 5; pointer-events: none; }
.caret::before { content: ''; position: absolute; left: -5px; top: -1px; border: 5px solid transparent; border-top-color: var(--accent); }
.alt { position: absolute; left: var(--gut); bottom: 22px; z-index: 6; background: #000; padding: 4px 10px 4px 0; box-shadow: 14px 0 18px #000; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.alt b { color: #fff; font-weight: 400; }

.after { min-height: 60vh; display: flex; align-items: center; padding: 0 var(--gut); border-top: 1px solid rgba(255,255,255,.08); }
.after p { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); }

@media (max-width: 860px) {
  .reel-cap .ds { display: none; }
  .reel-shot { height: calc(100svh - var(--tape-h) - 300px); }
}
@media (prefers-reduced-motion: reduce) { .reel-cap, .reel-cap > * { transition: none !important; } }
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>
<body>

<section class="reel-scope" aria-label="Extra case studies">
  <div class="reel-stage" id="reel">
    <header class="cs-head">
      <div>
        <p class="eyebrow">[ &nbsp;More work&nbsp; ]</p>
        <h1>The climbs between the summits</h1>
      </div>
      <p class="cs-count"><b id="cs-n">01</b>of <span id="cs-t">06</span></p>
    </header>
    <div class="reel-strip"></div>
    <p class="reel-live" role="status" aria-live="polite"></p>
    <div class="tape" aria-hidden="true"><svg></svg></div>
    <i class="caret" aria-hidden="true"></i>
    <p class="alt" aria-hidden="true">Alt <b id="alt">0000</b> m</p>
  </div>
</section>
<section class="after"><p>End of the reel</p></section>

<script type="module">
  import { mountWorkReel, P, ITEMS } from './assets/work-reel.js';

  /* The extra case studies — the live site's list, with its own copy. */
  const CASES = [
    { label: 'Apnaklub',
      ds: 'Helped Apnaklub understand their users and market via research, and designed their app to achieve product–market fit.',
      tg: 'App design · Wholesale procurement · Ecommerce · B2B' },
    { label: 'The Indian Express',
      ds: "Redesigned Indian Express's flagship product to create a brand new mobile app experience and monetisation strategy for the company.",
      tg: 'Website design · App design · News & media' },
    { label: "Zeta's Cipher Docs",
      ds: "A comprehensive overhaul of Cipher's documentation portal, starting from scratch, with extensive user testing and research to ensure its success.",
      tg: 'Documentation portal · Fintech · Authentication' },
    { label: 'Urban Company',
      ds: "Designed the first market versions of Urban Company's (formerly UrbanClap) apps and brought research into their design workflow.",
      tg: 'App design · Urban services' },
    { label: 'Zomato',
      ds: "Designed the first version of Zomato's food delivery app, along with work on multiple other products and services.",
      tg: 'Website design · App design · Foodtech' },
    { label: "HDFC's Smart Buy",
      ds: 'Helped HDFC design and experiment with layouts for their rewards platform.',
      tg: 'App design · Fintech · Ecommerce' },
  ];
  /* A plate per case, drawn here rather than borrowed: the reel folder's
     artwork carries other names printed on it. Contour rings round an
     off-centre summit in a muted tone per case and the orange marker —
     placeholders still, but honest ones. No name on the plate: the name is
     the caption's, and only the caption's. */
  const TONES = ['#2b3a33', '#35302a', '#28313d', '#3a2d2d', '#3b3526', '#2c2f3a'];
  function plate(c, i) {
    const W = 900, H = 1180, tone = TONES[i % TONES.length];
    const cx = 300 + ((i * 173) % 360), cy = 380 + ((i * 97) % 340);
    let rings = '';
    for (let r = 0; r < 22; r++) {
      const R = 40 + r * 46, pts = [];
      for (let a = 0; a <= 72; a++) {
        const t = a / 72 * Math.PI * 2;
        const w = 1 + 0.09 * Math.sin(t * 3 + r * 0.5 + i) + 0.05 * Math.sin(t * 7 - r * 0.8);
        pts.push((cx + Math.cos(t) * R * 1.1 * w).toFixed(0) + ' ' + (cy + Math.sin(t) * R * 0.78 * w).toFixed(0));
      }
      rings += `<path d="M${pts.join('L')}Z" fill="none" stroke="rgba(233,236,242,${(0.08 + (r < 3 ? 0.25 : 0)).toFixed(2)})" stroke-width="2"/>`;
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="g" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="${tone}"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#g)"/>${rings}
      <rect x="${cx - 9}" y="${cy - 9}" width="18" height="18" fill="#FF4B1F"/>
    </svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  ITEMS.splice(0, ITEMS.length, ...CASES.map((c, i) => ({ label: c.label, src: plate(c, i) })));

  /* ══════════════════════════════════════════════════════════════════════
     CAPTION — the in-plate title and subtitle
     ════════════════════════════════════════════════════════════════════ */
  const CAPTION = {
    padX: 32,            // px, left/right padding inside the plate
    padBottom: 36,       // px, from the plate's bottom edge to the last line
    /* A plate is ACTIVE once it is this far open (0 … 1, where 1 is fully
       open and the reel parks there). It stays active until it drops below
       activeAt − hysteresis, so a scroll resting near the edge can't flicker. */
    activeAt: 0.72,
    hysteresis: 0.08,
    fadeIn: 0.5,         // s
    fadeOut: 0.25,       // s
    delay: 0.05,         // s after the plate turns active
    rise: 14,            // px the lines travel up as they come in
  };
  const root = document.querySelector('#reel');
  function applyCaption() {
    const s = root.style;
    s.setProperty('--cap-pad-x', CAPTION.padX + 'px');
    s.setProperty('--cap-pad-b', CAPTION.padBottom + 'px');
    s.setProperty('--cap-in', CAPTION.fadeIn + 's');
    s.setProperty('--cap-out', CAPTION.fadeOut + 's');
    s.setProperty('--cap-delay', CAPTION.delay + 's');
    s.setProperty('--cap-rise', CAPTION.rise + 'px');
  }
  applyCaption();

  const N = CASES.length;
  const pad = n => String(n + 1).padStart(2, '0');
  const isOn = new Array(N).fill(false);
  let items = [], shown = -1, lastA = 0;
  /* active per plate, from how far open it is — with hysteresis */
  function onFrame(a) {
    lastA = a;
    if (!items.length) return;
    let lead = -1;
    for (let i = 0; i < N; i++) {
      const open = Math.max(0, 1 - Math.abs(a - i));
      const on = isOn[i] ? open >= CAPTION.activeAt - CAPTION.hysteresis : open >= CAPTION.activeAt;
      if (on !== isOn[i]) { isOn[i] = on; items[i].classList.toggle('is-active', on); }
      if (on) lead = i;
    }
    if (lead >= 0) showCase(lead);
  }
  const reel = mountWorkReel(root, { onFrame });
  const scope = root.closest('.reel-scope');
  document.getElementById('cs-t').textContent = String(N).padStart(2, '0');

  /* the captions go inside each plate once the reel has built them */
  items = [...root.querySelectorAll('.reel-item')];
  items.forEach((it, i) => {
    const c = CASES[i], cap = document.createElement('div');
    cap.className = 'reel-cap';
    cap.innerHTML = `<p class="nm">${c.label}</p><p class="ds">${c.ds}</p><p class="tg">${c.tg}</p>`;
    it.querySelector('.reel-shot').appendChild(cap);
  });
  const sizeCaps = () => root.style.setProperty('--cap-w', reel.P.imageW + 'px');
  sizeCaps(); addEventListener('resize', sizeCaps);

  /* ── the counter and the camp follow the active plate ────────────────── */
  function showCase(i) {
    if (i === shown) return; shown = i;
    document.getElementById('cs-n').textContent = pad(i);
    camps.forEach((g, k) => g.classList.toggle('on', k === i));
  }

  /* ── the altitude tape ──────────────────────────────────────────────────
     Metres run RIGHT to LEFT along the tape, so as it slides right the value
     under the fixed caret climbs — an altimeter tape, read at the caret.
     The camps sit at the altitude each case is reached at, and the slide is
     the reel's own progress, so the open plate's camp is under the caret. */
  const T = { top: 6000, pxPerM: 0.34, start: 400 };
  const svg = document.querySelector('.tape svg');
  const altEl = document.getElementById('alt');
  const campAlt = i => T.start + (i / (N - 1)) * (T.top - T.start * 2);
  let camps = [];
  function buildTape() {
    const W = T.top * T.pxPerM + innerWidth, H = 68;
    svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const x = m => (T.top - m) * T.pxPerM + innerWidth / 2;
    let s = '';
    for (let m = 0; m <= T.top; m += 50) {
      const major = m % 500 === 0, mid = m % 100 === 0;
      s += `<line class="tk${major ? ' m' : ''}" x1="${x(m)}" x2="${x(m)}" y1="${H}" y2="${H - (major ? 26 : mid ? 14 : 7)}"/>`;
      if (major) s += `<text class="lb" x="${x(m) + 5}" y="${H - 16}">${m.toLocaleString('en-US')}</text>`;
    }
    CASES.forEach((c, i) => {
      const cx = x(campAlt(i));
      s += `<g class="camp" transform="translate(${cx} 10)"><rect x="-4" y="-4" width="8" height="8"/><text x="8" y="3">${pad(i)}</text></g>`;
    });
    svg.innerHTML = s;
    camps = [...svg.querySelectorAll('.camp')];
    camps.forEach((g, k) => g.classList.toggle('on', k === shown));
  }
  function onScroll() {
    const travel = scope.offsetHeight - innerHeight;
    const p = travel > 0 ? Math.min(1, Math.max(0, -scope.getBoundingClientRect().top / travel)) : 0;
    /* the reel's own reading of progress: item index, fractional */
    const a = p * (N - 1);
    const i0 = Math.min(N - 2, Math.floor(a));
    const alt = campAlt(i0) + (campAlt(i0 + 1) - campAlt(i0)) * (a - i0);
    /* the tape's origin sits so that `alt` is under the caret: moving to
       higher altitude slides the tape right */
    const shift = -(T.top - alt) * T.pxPerM;
    svg.style.transform = `translate3d(${shift.toFixed(1)}px, 0, 0)`;
    altEl.textContent = String(Math.round(alt)).padStart(4, '0');
  }
  buildTape();
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', () => { buildTape(); onScroll(); });
  onScroll();
  onFrame(lastA);

  /* the panel: the reel's own easing presets, and the tape's scale */
  const el = document.createElement('div');
  el.id = 'tune';
  el.innerHTML = `<div id="tune-head"><b>Case reel</b><button id="tune-hide" title="Hide (H)">–</button></div>
    <p class="tune-sub">Reel easing</p>
    <div class="seg" id="s-preset"><button data-b="0.65,0,0.35,1" class="on">Ease</button><button data-b="0.83,0,0.17,1">Strong</button><button data-b="0.45,0,0.55,1">Soft</button><button data-b="0,0,1,1">Linear</button></div>
    <div class="row"><label>Dwell<i id="v-dw">0.00</i></label><input type="range" id="s-dw" min="0" max="45" value="0"></div>
    <p class="tune-sub">In-plate caption</p>
    <div class="row"><label>Padding X<i id="v-cx">${CAPTION.padX}px</i></label><input type="range" id="s-cx" min="0" max="80" value="${CAPTION.padX}"></div>
    <div class="row"><label>Padding bottom<i id="v-cb">${CAPTION.padBottom}px</i></label><input type="range" id="s-cb" min="0" max="120" value="${CAPTION.padBottom}"></div>
    <div class="row"><label>Active at<i id="v-ca">${CAPTION.activeAt}</i></label><input type="range" id="s-ca" min="10" max="100" value="${CAPTION.activeAt * 100}"></div>
    <div class="row"><label>Hysteresis<i id="v-ch">${CAPTION.hysteresis}</i></label><input type="range" id="s-ch" min="0" max="30" value="${CAPTION.hysteresis * 100}"></div>
    <p class="tune-sub">Altitude tape</p>
    <div class="row"><label>Scale<i id="v-px">0.34 px/m</i></label><input type="range" id="s-px" min="10" max="80" value="34"></div>`;
  document.body.appendChild(el);
  const q = id => el.querySelector('#' + id);
  q('s-preset').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    [...q('s-preset').children].forEach(c => c.classList.toggle('on', c === b)); reel.setBezier(b.dataset.b.split(',').map(Number)); });
  q('s-dw').addEventListener('input', e => { P.dwell = e.target.value / 100; q('v-dw').textContent = P.dwell.toFixed(2); reel.refresh(); });
  q('s-px').addEventListener('input', e => { T.pxPerM = e.target.value / 100; q('v-px').textContent = T.pxPerM.toFixed(2) + ' px/m'; buildTape(); onScroll(); });
  const capBind = (id, fn) => q('s-' + id).addEventListener('input', e => { q('v-' + id).textContent = fn(+e.target.value); applyCaption(); onFrame(lastA); });
  capBind('cx', v => (CAPTION.padX = v) + 'px');
  capBind('cb', v => (CAPTION.padBottom = v) + 'px');
  capBind('ca', v => (CAPTION.activeAt = v / 100));
  capBind('ch', v => (CAPTION.hysteresis = v / 100));
  q('tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
  if (window.wb && window.wb.adopt) window.wb.adopt();
</script>
</body>
</html>
