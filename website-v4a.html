<!-- ─────────────────────────────────────────────────────────────────────────
     Website v4 A — Final Website v2 with Our Summits as top-view peaks

       Our summits    summits-topview.html
                      the range from above; the scroll carries it sideways, summit by summit (phones: the four peaks stacked, static)
       Everything else as Final Website v2 (its registry order, the
       sections' first variants).

     Shell: assets/site-shell.js. Sections: assets/site-sections.js (V4A_SECTIONS).

</head>
<body>
<header id="ca-header"></header>
<main id="stack"></main>
<button class="site-refresh" id="site-refresh" type="button" title="Reload every section from its latest design" aria-label="Refresh sections">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
  <span>Refresh</span>
</button>

<script type="module">
  import { mountSite } from './assets/site-shell.js';
  import { V4A_SECTIONS, HOME_LINKS, resolveLayout, sectionsFor } from './assets/site-sections.js';
  const layout = resolveLayout(null, V4A_SECTIONS);
  window.tibba = mountSite({
    sections: sectionsFor(layout, V4A_SECTIONS),
    home: '#',
    links: HOME_LINKS,
  });
</script>
</body>
