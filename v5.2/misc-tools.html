let bag = null;                                     // the group parts are being added to
const hulls = [];
/* a part: its surface and its outline hull, in one group to place */
function add(geo, mat, name, outline = true, hull = hullMat) {

  g.add(new THREE.Mesh(geo, mat));

const solidDark = () => surface({ lines: 0, solid: 1, base: { value: new THREE.Color(0x111113) } });

const smooth = (a, b, x) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
/* round off a tube's end: the radius falls to nothing over the last `k` of its length */
const dome = (u, k = 0.025) => u > 1 - k ? Math.sqrt(Math.max(0.0001, 1 - Math.pow((u - (1 - k)) / k, 2))) : 1;

/* ── 1 · the hatchet (Nov 2026, after the reference drawing) ────────────
   Built lying flat: the handle runs along +x from the head, curving a
   little toward −y as it nears the knob; the blade reaches toward +y, the
   poll toward −y; the blade's faces look along ±z. */
function buildHatchet() {
  bag.rotation.x = -Math.PI / 2;                  // lying on the ground, faces up: seen in isometric, the handle runs down to the right, the blade to the left
  /* the handle: oval, slimmer through the neck under the head, swelling
     to the grip and a hooked knob at the end */
  const hx = u => 0.27 + 0.05 * smooth(0.15, 0.55, u) + 0.07 * smooth(0.8, 0.96, u);
  const handle = sweep([[-0.4, 0, 0], [1.6, -0.02, 0], [3.6, -0.17, 0], [5.4, -0.45, 0], [6.5, -0.78, 0], [7.0, -1.02, 0]],
    u => (hx(u) + 0.1 * smooth(0.9, 0.99, u)) * dome(u), u => (hx(u) * 0.8) * dome(u), [0, 1, 0], { seg: 140 });
  add(handle.g, surface({ k: [2.4, 0.62, 2.4], c: [0.55, 0.2, 0.35], seed: 2.4 }), 'handle');

  /* the head, forged in one: the blade reaching toward −y (the side the
     handle bends to), the eye round the handle's top, the poll toward +y.
     Each is made pointing +y and turned half round x, so its faces keep
     their winding. */
  const flip = g => g.rotateX(Math.PI);
  const BL = 3.1, BY = 0.62 + BL / 2;              // the blade's length and where its middle sits
  const flare = (v, x, t) => { v.x = v.x * (1 + 1.25 * Math.pow(t, 1.5)) + 0.45 * Math.pow(t, 1.7); };
  add(flip(block(1.45, BL, 0.56, 0.06, [28, 34, 6], { deform: (v, x, y, z) => {
      const t = (y + 1) / 2;                                     // 0 at the eye, 1 at the edge
      flare(v, x, t);
      v.z *= Math.max(0.14, 1 - 0.84 * Math.pow(t, 1.1));
      v.y += 0.3 * (1 - x * x) * Math.pow(Math.max(0, y), 6);     // the edge, convex
    } }).translate(0.05, BY, 0)),
    surface({ k: [0.95, 0.85, 0.6], c: [0.55, 0.0, 0.2], seed: 1.7 }), 'blade');
  /* the bevel: a band along the edge, its lines running with the edge */
  add(flip(block(1.45, 0.42, 0.12, 0.02, [28, 4, 2], { deform: (v, x, y, z) => {
      const t = 1 - 0.135 * (1 - y) / 2;
      flare(v, x, t);
      v.y += 0.3 * (1 - x * x) * (y > 0 ? 1 : 0.55);
      v.z *= 1.1 - 0.7 * (y + 1) / 2;
    } }).translate(0.05, BY + BL / 2 - 0.2, 0)),
    surface({ k: [0.06, 2.6, 0.06], c: [0, 0.3, 0], seed: 3.3 }), 'bevel');
  add(block(1.25, 1.25, 0.82, 0.26, [12, 12, 8], { deform: (v, x, y, z) => { v.z *= 1 - 0.16 * (1 - y * y); } }).translate(0.05, 0, 0),
    surface({ k: [1.3, 1.3, 0.9], c: [0.15, 0.1, 0.35], seed: 5.2 }), 'eye');
  add(block(1.05, 1.0, 0.86, 0.3, [12, 12, 8], { deform: (v, x, y, z) => { if (y > 0) { v.x *= 1 + 0.07 * y; v.z *= 1 + 0.06 * y; } else { v.x *= 1 + 0.12 * y; v.z *= 1 + 0.1 * y; } } }).translate(0.05, 1.05, 0),
    surface({ k: [1.2, 1.2, 1.2], c: [0, 0.25, 0.4], seed: 8.1 }), 'poll');

  /* the collar under the head, drawn in orange, and its keeper loop */
  const ring = [];
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ring.push([1.08, Math.cos(a) * 0.38, Math.sin(a) * 0.31]); }
  add(strap(ring, 0.34, 0.06, [1, 0, 0], { closed: true, seg: 72, r: 0.02 }).g, solidDark(), 'collar', true, accentHull());
  add(strap([[1.08, 0.3, 0.24], [1.12, 0.6, 0.52], [1.12, 0.9, 0.44], [1.1, 0.76, 0.12]], 0.22, 0.05, [1, 0, 0], { seg: 30, r: 0.02 }).g, solidDark(), 'keeper', true, accentHull());

  /* the lanyard: through the knob, a loop lying on the ground beside it */
  const cord = sweep([[6.85, -0.97, 0.12], [7.15, -1.27, 0.05], [7.05, -1.87, -0.1], [6.25, -2.42, -0.2], [5.05, -2.47, -0.2], [4.5, -2.12, -0.15],
                      [4.9, -1.85, -0.1], [6.0, -1.79, -0.05], [6.77, -1.52, 0.0], [7.0, -1.22, 0.06]],
    () => 0.045, () => 0.045, [0, 0, 1], { seg: 140, radial: 10 });
  add(cord.g, solidDark(), 'lanyard');
}
makeBag('Hatchet', buildHatchet, { dir: [1, 0.95, 1], zoom: 1.05 });

/* a flat part cut from a shape (holes and all) and given thickness, its
   edges rounded; aLocal is its own position, for the contour field */
function plate(shape, depth, bevel = 0.08, { curve = 10 } = {}) {
  /* the extrusion's own normals: flat across the faces and the sides, turning
     through the bevel — merged and averaged instead, the long flat sides'
     normals tip toward the faces and the outline hull pokes through */
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: curve, steps: 1 });
  g.deleteAttribute('uv');
  g.translate(0, 0, -depth / 2);
  g.setAttribute('aLocal', g.attributes.position.clone());
  return g;
}
/* a hole, drawn the way the drawing draws one: a rim and a shadowed bore */
function hole(x, y, z, r, mat = solidDark()) {
  const g = new THREE.CylinderGeometry(r, r, 0.04, 36, 1).rotateX(Math.PI / 2);
  g.deleteAttribute('uv'); g.setAttribute('aLocal', g.attributes.position.clone());
  add(g, mat, 'hole').position.set(x, y, z);
}

/* ── 2 · the hand ascender (Nov 2026, after the reference drawing) ──────
   Lying flat like the hatchet, so the same isometric view reads it: the
   frame runs along +x from the cam housing (top left) to its rounded foot
   (bottom right); the handle along the +y edge, finger grips facing the
   big opening; the rope channel and the spring-loaded cam, in orange, in
   the housing; the clip-in holes at both ends. */
function buildAscender() {
  bag.rotation.x = -Math.PI / 2;
  const T = 0.32;                                  // the frame's thickness
  /* the frame: a long plate, squared at the housing end, round at the foot,
     with the big opening for the hand */
  const s = new THREE.Shape();
  s.moveTo(0, -1.25); s.lineTo(5.6, -1.25);
  s.absarc(5.6, 0.05, 1.3, -Math.PI / 2, Math.PI / 2, false);
  s.lineTo(0.4, 1.35); s.quadraticCurveTo(0, 1.35, 0, 0.95); s.lineTo(0, -0.85); s.quadraticCurveTo(0, -1.25, 0.4, -1.25);
  const op = new THREE.Path();
  op.moveTo(2.75, -0.7); op.lineTo(4.95, -0.7); op.absarc(4.95, -0.04, 0.66, -Math.PI / 2, Math.PI / 2, false);
  op.lineTo(2.75, 0.62); op.absarc(2.75, -0.04, 0.66, Math.PI / 2, Math.PI * 1.5, false);
  s.holes.push(op);
  for (const [hx, hy, hr] of [[0.62, -0.62, 0.3], [6.05, -0.72, 0.3], [6.55, -0.1, 0.22]]) { const h = new THREE.Path(); h.absarc(hx, hy, hr, 0, Math.PI * 2, true); s.holes.push(h); }
  add(plate(s, T, 0.07, { curve: 16 }), surface({ k: [0.55, 0.8, 1], c: [1.6, -0.7, 0], seed: 4.4 }), 'frame');
  /* the holes' rims, drawn as the drawing draws them: a white ring at the top of each bore */
  for (const [hx, hy, hr] of [[0.62, -0.62, 0.3], [6.05, -0.72, 0.3], [6.55, -0.1, 0.22]]) {
    const r = new THREE.TorusGeometry(hr + 0.015, 0.018, 6, 48); r.deleteAttribute('uv'); r.setAttribute('aLocal', r.attributes.position.clone());
    add(r, solidDark(), 'rim').position.set(hx, hy, T / 2 + 0.07);
  }
  /* the slot down the long edge */
  add(block(2.2, 0.12, 0.05, 0.05, [8, 1, 1]).translate(3.85, -0.98, T / 2 + 0.07), solidDark(), 'slot');

  /* the handle: a thick grip along the +y edge, bumps for four fingers on
     its inner face, rolling down into the foot */
  const bump = u => 1 + 0.16 * Math.max(0, Math.sin((u - 0.12) / 0.6 * Math.PI * 4)) * smooth(0.08, 0.16, u) * (1 - smooth(0.66, 0.74, u));
  const grip = sweep([[2.45, 1.0, 0.16], [3.4, 1.04, 0.36], [4.6, 1.05, 0.4], [5.6, 0.96, 0.34], [6.3, 0.62, 0.22], [6.5, 0.3, 0.14]],
    u => 0.29 * bump(u) * (1 - 0.3 * smooth(0.8, 1, u)), u => 0.36 * (1 - 0.4 * smooth(0.78, 1, u)), [0, 0, 1], { seg: 120 });
  add(grip.g, surface({ k: [1.6, 0.9, 1.6], c: [0.3, 0.6, 0.4], seed: 6.1 }), 'handle');
  add(block(1.5, 0.09, 0.05, 0.045, [6, 1, 1]).rotateZ(-0.04).translate(4.3, 1.08, 0.77), solidDark(), 'handle-slot');

  /* the housing: two walls over the top end with the rope channel between,
     open above so the cam and its spring show; the outer wall's top dips
     between two shoulders */
  add(block(2.35, 0.55, 1.05, 0.18, [16, 6, 8], { deform: (v, x, y, z) => { if (z > 0) v.z -= 0.24 * Math.exp(-Math.pow((x - 0.1) * 2.2, 2)); } }).translate(1.2, 0.98, 0.62),
    surface({ k: [0.9, 0.9, 0.7], c: [0.3, 0.35, 0.5], seed: 2.9 }), 'housing');
  add(block(1.4, 0.42, 0.62, 0.15, [10, 4, 6]).translate(1.72, -0.9, 0.42), surface({ k: [0.7, 0.9, 0.8], c: [0.2, 0, 0.2], seed: 7.4 }), 'lip');
  hole(1.45, 0.98, 1.14, 0.15);

  /* the spring that loads the cam: a coil along x */
  const coil = []; for (let i = 0; i <= 120; i++) { const a = i / 120 * Math.PI * 2 * 5; coil.push([0.75 + i / 120 * 0.8, 0.12 + Math.cos(a) * 0.14, 0.5 + Math.sin(a) * 0.14]); }
  add(sweep(coil, () => 0.028, () => 0.028, [0, 0, 1], { seg: 300, radial: 8 }).g, solidDark(), 'spring');
  /* the cam, in orange: a toothed wedge and its thumb catch */
  const cam = new THREE.Shape();
  cam.moveTo(0, 0); cam.quadraticCurveTo(0.35, 0.55, 0.15, 0.95); cam.quadraticCurveTo(0.45, 1.05, 0.62, 0.7); cam.quadraticCurveTo(0.7, 0.2, 0.32, -0.15); cam.quadraticCurveTo(0.1, -0.2, 0, 0);
  const camG = plate(cam, 0.22, 0.03, { curve: 12 });
  const camM = add(camG, solidDark(), 'cam', true, accentHull());
  camM.rotation.set(Math.PI / 2, 0, 0.3); camM.position.set(1.62, 0.18, 0.2);
  add(block(0.34, 0.22, 0.12, 0.04, [3, 2, 1]).translate(1.95, 0.18, 1.18), solidDark(), 'cam-catch', true, accentHull());
}
makeBag('Ascender', buildAscender, { dir: [1, 0.95, 1], zoom: 1.15 });

/* a coiled rope lying on the ground (in the lying frame: z up), its loops
   bound by two orange wraps, its end trailing out */
function buildRope() {
  const pts = [], TURNS = 6.2, N = 520;
  for (let i = 0; i <= N; i++) {
    const s = i / N, a = s * TURNS * Math.PI * 2, k = s * TURNS;
    const R = 1.0 + 0.09 * Math.sin(a * 0.5 + 1.0) + 0.03 * k;
    pts.push([Math.cos(a) * R * 1.45 + 0.16 * k, Math.sin(a) * R * (1 + 0.04 * k) + 0.1 * k, 0.17 + 0.24 * (0.5 + 0.5 * Math.sin(a + k * 1.9)) + 0.04 * k]);
  }
  /* the end, leaving the coil and lying out across the ground */
  const e = pts[pts.length - 1];
  pts.push([e[0] - 0.35, e[1] - 0.6, 0.15], [e[0] - 0.9, e[1] - 1.5, 0.13], [e[0] - 1.25, e[1] - 2.3, 0.13]);
  const rope = sweep(pts, () => 0.15, () => 0.15, [0, 0, 1], { seg: 1100, radial: 12 });
  add(rope.g, surface({ k: [0.2, 1.0, 0.2], c: [0, 0, 0], seed: 9.9 }), 'rope');
  /* the binding: two orange wraps round the bundle where its loops gather */
  for (const dy of [-0.22, 0.22]) {
    const ring = [];
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; ring.push([1.95 + Math.cos(a) * 0.5, 0.35 + dy, 0.42 + Math.sin(a) * 0.4]); }
    add(strap(ring, 0.18, 0.04, [0, 1, 0], { closed: true, seg: 70, r: 0.015 }).g, solidDark(), 'wrap', true, accentHull());
  }
}
/* a coin with the Tibba mark, lying flat, an orange ring round the mark */
function buildCoin(x, y) {
  const g = new THREE.CylinderGeometry(0.62, 0.62, 0.16, 48, 1).rotateX(Math.PI / 2);
  g.deleteAttribute('uv'); g.setAttribute('aLocal', g.attributes.position.clone());
  add(g, surface({ k: [1.4, 1.4, 1], c: [0, 0, 0], seed: x }), 'coin').position.set(x, y, 0.08);
  const r = new THREE.TorusGeometry(0.44, 0.03, 6, 48); r.deleteAttribute('uv'); r.setAttribute('aLocal', r.attributes.position.clone());
  add(r, solidDark(), 'coin-ring', true, accentHull()).position.set(x, y, 0.17);
  const face = new THREE.CylinderGeometry(0.41, 0.41, 0.02, 48, 1).rotateX(Math.PI / 2); face.deleteAttribute('uv'); face.setAttribute('aLocal', face.attributes.position.clone());
  add(face, solidDark(), 'coin-face', false).position.set(x, y, 0.17);
  mark([x, y, 0.19], 0.5).rotation.set(0, 0, -Math.PI / 4);
}

/* ── the MVP kit: the hatchet, the ascender, the rope and three coins laid
   out together on the ground, as the MVP design page's header shows them
   (?embed&kit=mvp) ─────────────────────────────────────────────────────── */
makeBag('MVP kit', () => {
  const root = bag;
  root.rotation.x = -Math.PI / 2;
  const part = (fn, x, y, s = 1, rz = 0) => {
    const g = new THREE.Group(); root.add(g); bag = g; fn(); g.rotation.x = 0;   // the kit is already lying down
    g.position.set(x, y, 0); g.scale.setScalar(s); g.rotation.z = rz; bag = root; return g;
  };
  part(buildHatchet, 0, 0, 1, 0.05);
  part(buildAscender, 0.7, 2.9, 0.66, 0.05);
  part(buildRope, 6.4, 3.0, 1.15, 0.1);
  for (const [cx, cy] of [[2.7, -2.55], [3.95, -3.15], [2.45, -3.85]]) part(() => buildCoin(0, 0), cx, cy, 1, 0);
}, { dir: [1, 0.95, 1], zoom: 1.0, shift: [0.6, 0, 0.4] });

/* ── applying the config ─────────────────────────────────────────────────── */
let cur = Math.min(BAGS.length - 1, Math.max(0, C.view.bag | 0));
BAGS[cur].pivot.visible = true;
let HOME = BAGS[cur].home;
camera.position.copy(HOME.target).addScaledVector(HOME.dir, 40); camera.zoom = HOME.zoom; camera.updateProjectionMatrix();
controls.target.copy(HOME.target); controls.update();
function apply() {
  G.uDensity.value = C.lines.density; G.uWidth.value = C.lines.width; G.uWarp.value = C.lines.warp; G.uLineOp.value = C.lines.opacity;
  G.uLineCol.value.set(C.lines.colour); G.uOutlineCol.value.set(C.lines.colour);
  G.uFill.value.set(C.model.fill); G.uShade.value = C.model.shade; G.uRim.value = C.model.rim;
  accent.value.set(C.model.accent);
  marks.forEach(m => { m.visible = C.model.logo; });
  BAGS.forEach(b => { b.guides.visible = C.model.guides; });
  controls.autoRotate = C.view.autoRotate; controls.autoRotateSpeed = C.view.rotateSpeed;
}
apply();

/* ── reset to the reference angle ──────────────────────────────────────── */
let tween = null;
function resetView(dur = 900) {
  const from = { p: camera.position.clone(), t: controls.target.clone(), z: camera.zoom };
  const to = { p: HOME.target.clone().addScaledVector(HOME.dir, 40), t: HOME.target.clone(), z: HOME.zoom };
  tween = { from, to, t0: performance.now(), dur };
}

/* ── the switch: out goes the bag, shrinking and easing away; in comes the
   next, growing with a small overshoot before it settles ─────────────────── */
const easeIn = t => t * t * t;
const easeOutBack = (t, s = 1.25) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const OUT = 360, GAP = 150, IN = 820;
let swap = null, queued = -1;
function showBag(i) {
  if (swap) { queued = i; return; }            // a switch asked for mid-swap runs when this one lands
  if (i === cur) return;
  const from = BAGS[cur], to = BAGS[i];
  to.pivot.visible = true; to.pivot.scale.setScalar(0.001);
  swap = { from, to, t0: performance.now() };
  cur = i; C.view.bag = i; HOME = to.home;
  resetView(OUT + GAP + IN * 0.8);
  syncSwitch();
}

/* ── the loop: pauses with the tab ─────────────────────────────────────── */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (C.anim.play) { G.uPhase.value += dt * C.anim.speed * 2.2; G.uMorphT.value += dt * C.anim.morph; }
  if (swap) {
    const t = now - swap.t0;
    const ko = Math.min(1, t / OUT), ki = Math.min(1, Math.max(0, (t - OUT - GAP) / IN));
    swap.from.pivot.scale.setScalar(Math.max(0.001, 1 - easeIn(ko)));
    swap.from.pivot.rotation.y = 0.35 * easeIn(ko);
    swap.to.pivot.scale.setScalar(Math.max(0.001, ki > 0 ? easeOutBack(ki) : 0.001));
    swap.to.pivot.rotation.y = -0.4 * (1 - easeOut(ki));
    if (ko >= 1) swap.from.pivot.visible = false;
    if (ki >= 1) { swap.from.pivot.scale.setScalar(1); swap.from.pivot.rotation.y = 0; swap.to.pivot.scale.setScalar(1); swap.to.pivot.rotation.y = 0; swap = null; if (queued >= 0) { const q = queued; queued = -1; showBag(q); } }
  }
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(tween.from.p, tween.to.p, e); controls.target.lerpVectors(tween.from.t, tween.to.t, e);
    camera.zoom = tween.from.z + (tween.to.z - tween.from.z) * e; camera.updateProjectionMatrix();
    if (k >= 1) tween = null;
  }
  controls.update();
  /* outlines a constant width on screen, whatever the zoom */
  G.uOutline.value = C.model.outline * (VIEW_H / camera.zoom) / renderer.domElement.clientHeight;
  /* fewer rings when the pack is drawn small, so they stay lines, not haze */
  const pxPerUnit = renderer.domElement.clientHeight * camera.zoom / VIEW_H;
  G.uDensity.value = C.lines.density * Math.min(1, Math.max(0.5, pxPerUnit / 90));
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* ── the switcher, bottom left ─────────────────────────────────────────── */
const sw = document.getElementById('switch');
sw.innerHTML = BAGS.map((b, i) => `<button type="button" data-i="${i}"><b>0${i + 1}</b><span>${b.name}</span></button>`).join('');
const swBtns = [...sw.children];
function syncSwitch() { swBtns.forEach((b, i) => { b.setAttribute('aria-pressed', String(i === cur)); }); }
swBtns.forEach((b, i) => b.addEventListener('click', () => showBag(i)));
addEventListener('keydown', e => {
  if (EMBED) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (/^[1-9]$/.test(e.key) && +e.key <= BAGS.length) showBag(+e.key - 1);
  if (e.key === 'ArrowRight') showBag((cur + 1) % BAGS.length);
  if (e.key === 'ArrowLeft') showBag((cur + BAGS.length - 1) % BAGS.length);
});
if (BAGS.length < 2) sw.style.display = 'none';
syncSwitch();

const SCHEMA = [
  ['Animation'],

const get = p => p.split('.').reduce((o, k) => o[k], C);
const set = (p, v) => { const ks = p.split('.'), l = ks.pop(); ks.reduce((o, k) => o[k], C)[l] = v; };
const el = document.createElement('div'); el.id = 'tune';
el.innerHTML = `<div id="tune-head"><b>Tools</b><button id="tune-hide" title="Hide (H)">–</button></div>` + SCHEMA.map(([p, label, a, b, step, unit = '']) => {
  if (label == null) return `<p class="tune-sub">${p}</p>`;
  const id = 'b-' + p.replace('.', '-'), v = get(p);
  if (a === 'check') return `<div class="row inline"><label for="${id}">${label}<i></i></label><input type="checkbox" id="${id}"${v ? ' checked' : ''}></div>`;
  if (a === 'color') return `<div class="row"><label>${label}<i></i></label><input type="color" id="${id}" value="${v}"></div>`;
  return `<div class="row"><label>${label}<i id="v-${id}">${v}${unit}</i></label><input type="range" id="${id}" min="${a}" max="${b}" step="${step}" value="${v}" data-unit="${unit}"></div>`;
}).join('') + `<div class="tune-acts"><button class="tune-btn" id="b-reset">Reset view</button></div>` + bakeControls.html;
document.body.appendChild(el);
SCHEMA.forEach(([p, label, a]) => {
  if (label == null) return;
  const inp = el.querySelector('#b-' + p.replace('.', '-'));
  if (a === 'check') inp.addEventListener('change', () => { set(p, inp.checked); apply(); });
  else if (a === 'color') inp.addEventListener('input', () => { set(p, inp.value); apply(); });
  else inp.addEventListener('input', () => { el.querySelector('#v-b-' + p.replace('.', '-')).textContent = inp.value + inp.dataset.unit; set(p, +inp.value); apply(); });
});
el.querySelector('#b-reset').addEventListener('click', () => resetView());
el.querySelector('#tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
bakeControls.bind(el, KEY, C, 'BAGS_CONFIG');
if (window.wb && window.wb.adopt) window.wb.adopt();
window.tools = { scene, camera, controls, BAGS, showBag, resetView, CONFIG };
if (EMBED && window.parent !== window) window.parent.postMessage({ type: 'tools-ready' }, location.origin);
</script>
</body>
</html>
