<style>
/* ══════════════════════════════════════════════════════════════════════════
   Metrics — on the hero's third scroll state
   ─────────────────────────────────────────────────────────────────────────
   Active Peak's last move, lifted out and given a job: the peak arrives in
   its perspective station, and as the page scrolls it turns, shrinks and
   steps aside — and the four numbers land in the room it leaves.

   The approach is long on purpose. The section starts most of a viewport
   below the fold, so arriving at it is something the reader does rather
   than something that is already happening when the page opens; the boxes
   are only worth animating if somebody scrolled down to see them.

   The boxes are not on a grid. Each has its own position and width, a
   little off from its neighbours, so the four read as instruments set out
   across the ground to the right of the peak rather than as a table.
   ═════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #000; color: var(--ink-warm);
  font-family: 'F37 Analog', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}

/* ── the approach ──────────────────────────────────────────────────────── */
#approach {
  min-height: 118vh;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 var(--gut) 22vh;
  background: radial-gradient(120% 60% at 30% 100%, #0b0b0d 0%, #000 70%);
}
#approach .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
#approach h1 {
  margin-top: 18px; max-width: 16ch; color: #fff; font-weight: 400;
  font-size: clamp(34px, 4.6vw, 72px); line-height: 1; letter-spacing: -.035em;
}
#approach p { margin-top: 18px; max-width: 46ch; color: var(--ink-mute); font-size: 14px; line-height: 1.7; }
#approach .down {
  margin-top: 40px; display: flex; align-items: center; gap: 12px;
  font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-faint);
}
#approach .down i { display: block; width: 1px; height: 40px; background: linear-gradient(var(--accent), transparent);
  animation: m-drip 2.4s cubic-bezier(.65,0,.35,1) infinite; transform-origin: top; }
@keyframes m-drip { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

/* ── the section ───────────────────────────────────────────────────────── */
#scope { position: relative; height: 290vh; }
#stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
#peak-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#stage::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(270deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.5) 34%, rgba(0,0,0,0) 56%);
  opacity: var(--lock, 0);
}
/* the fade in from the approach, so the top of the canvas is not a hard edge */
#stage::before {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 22vh; z-index: 1; pointer-events: none;
  background: linear-gradient(#000, rgba(0,0,0,0));
}

#head {
  position: absolute; left: var(--gut); top: clamp(76px, 11vh, 120px); z-index: 3;
  display: flex; gap: 14px; align-items: baseline;
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint);
}
#head b { color: var(--accent); font-weight: 400; }

/* ── the boxes ─────────────────────────────────────────────────────────── */
#metrics { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.mbox {
  --x: 0; --y: 0;                          /* pointer drift, per box depth */
  position: absolute; left: var(--l); top: var(--t); width: var(--w);
  padding: 18px 20px 16px;
  transform: translate3d(calc(var(--x) * 1px), calc(var(--y) * 1px), 0);
  pointer-events: auto;
}
.mbox[data-i="0"] { --l: 52%;  --t: 17%; --w: clamp(220px, 19vw, 290px); }
.mbox[data-i="1"] { --l: 73%;  --t: 25%; --w: clamp(200px, 16vw, 250px); }
.mbox[data-i="2"] { --l: 57%;  --t: 53%; --w: clamp(210px, 17vw, 260px); }
.mbox[data-i="3"] { --l: 75.5%; --t: 61%; --w: clamp(230px, 19.5vw, 300px); }

/* the plate: glass and a hairline, opened from its centre line */
.mbox .plate {
  position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.1); border-radius: 3px;
  background: rgba(12,12,14,.66);
  backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1);
  clip-path: inset(0 0 100% 0);
}

/* four corner brackets, which lock on before anything else is there */
.mbox .cn { position: absolute; width: 10px; height: 10px; border-color: #fff; border-style: solid; opacity: 0; }
.mbox .cn.tl { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
.mbox .cn.tr { right: -1px; top: -1px; border-width: 1px 1px 0 0; }
.mbox .cn.bl { left: -1px; bottom: -1px; border-width: 0 0 1px 1px; }
.mbox .cn.br { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }

.mbox .in { position: relative; }
.mbox .k { display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); opacity: 0; }
.mbox .k b { color: var(--accent); font-weight: 400; }
.mbox .v {
  display: block; margin-top: 14px; color: #fff; font-weight: 300;
  font-size: clamp(44px, 4.6vw, 76px); line-height: 1; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  opacity: 0;
}
.mbox .l { display: block; margin-top: 12px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-mute); }
.mbox .pin { position: absolute; right: -1px; top: -1px; width: 8px; height: 8px; background: var(--accent); transform: scale(0); }

/* ── the load-in ─────────────────────────────────────────────────────────
   A HUD panel opening, not a card landing. Every beat is a straight line
   on a precise curve — nothing tilts, nothing overshoots:
     line    a hairline draws out from the centre of the box, both ways
     open    the plate opens up and down from that line
     frame   the four corner brackets snap onto the corners
     data    the header row, then the figure counts and the label rolls
     rule    four segments along the top edge light in sequence, and the
             orange pin comes on last
   The box's position never animates; only its contents are revealed. */
.mbox { opacity: 0; }
.mbox.in-view { opacity: 1; }
.mbox .hl {
  position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--accent);
  transform: scaleX(0); opacity: 0; pointer-events: none;
}
.mbox .seg { position: absolute; left: 20px; right: 20px; top: -1px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.mbox .seg i { height: 1px; background: rgba(255,255,255,.55); transform: scaleX(0); transform-origin: left; }
.mbox .plate { clip-path: inset(50% 0 50% 0); }

.mbox.in-view .hl { animation: m-line .42s var(--delay) cubic-bezier(.65,0,.35,1) both, m-out .3s calc(var(--delay) + .72s) linear both; }
@keyframes m-line { from { transform: scaleX(0); opacity: 1; } to { transform: scaleX(1); opacity: 1; } }
@keyframes m-out { from { opacity: 1; } to { opacity: 0; } }
.mbox.in-view .plate { animation: m-open .5s calc(var(--delay) + .38s) cubic-bezier(.65,0,.35,1) both; }
@keyframes m-open { from { clip-path: inset(50% 0 50% 0); } to { clip-path: inset(0 0 0 0); } }
.mbox.in-view .cn { animation: m-lock .34s calc(var(--delay) + .74s) cubic-bezier(.2,0,0,1) both; }
.mbox .cn.tl { --sx: -6px; --sy: -6px; }
.mbox .cn.tr { --sx: 6px;  --sy: -6px; }
.mbox .cn.bl { --sx: -6px; --sy: 6px; }
.mbox .cn.br { --sx: 6px;  --sy: 6px; }
@keyframes m-lock { from { opacity: 0; transform: translate(var(--sx), var(--sy)); } to { opacity: .9; transform: none; } }
.mbox.in-view .k { animation: m-fade .4s calc(var(--delay) + .82s) linear both; }
.mbox.in-view .v { animation: m-fade .2s calc(var(--delay) + .86s) linear both; }
.mbox.in-view .seg i { animation: m-seg .22s linear both; }
.mbox.in-view .seg i:nth-child(1) { animation-delay: calc(var(--delay) + 1.0s); }
.mbox.in-view .seg i:nth-child(2) { animation-delay: calc(var(--delay) + 1.12s); }
.mbox.in-view .seg i:nth-child(3) { animation-delay: calc(var(--delay) + 1.24s); }
.mbox.in-view .seg i:nth-child(4) { animation-delay: calc(var(--delay) + 1.36s); }
@keyframes m-seg { to { transform: scaleX(1); } }
.mbox.in-view .pin { animation: m-pin .18s calc(var(--delay) + 1.55s) linear both; }
@keyframes m-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes m-pin { to { transform: scale(1); } }

@media (max-width: 820px) {
  #stage::after { background: linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,0) 70%); }
  .mbox { --w: calc(50% - 24px) !important; padding: 14px; }
  .mbox[data-i="0"] { --l: 16px;  --t: 44%; }
  .mbox[data-i="1"] { --l: 52%;   --t: 48%; }
  .mbox[data-i="2"] { --l: 16px;  --t: 68%; }
  .mbox[data-i="3"] { --l: 52%;   --t: 72%; }
  .mbox .v { font-size: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .mbox.in-view, .mbox.in-view * { animation-duration: .01s !important; animation-delay: 0s !important; }
  .mbox .plate { clip-path: none; }
}
</style>

<header id="approach">
  <p class="eyebrow">[ &nbsp;Metrics&nbsp; ]</p>
  <h1>A decade of climbs, measured.</h1>
  <p>Twelve years of work with founders and design leaders, from a first MVP to
     platforms that serve millions. Keep scrolling — the peak makes room for the numbers.</p>
  <span class="down"><i></i>Scroll into it</span>

    <canvas id="peak-canvas"></canvas>
    <div id="head"><b>02</b><span>The numbers</span></div>
    <div id="metrics"></div>
