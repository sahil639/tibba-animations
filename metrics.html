<style>
/* ══════════════════════════════════════════════════════════════════════════
   Metrics — on the hero's third scroll state
   ─────────────────────────────────────────────────────────────────────────
   Active Peak's last move, lifted out and given a job: the peak arrives in
   its perspective station, and as the page scrolls it turns, shrinks and
   steps aside — and the four numbers land in the room it leaves.

   The approach is long on purpose. The section starts most of a viewport
   below the fold, so arriving at it is something the reader does rather
   than something that is already happening when the page opens; the boxes
   are only worth animating if somebody scrolled down to see them.

   The boxes are not on a grid. Each has its own position and width, a
   little off from its neighbours, so the four read as instruments set out
   across the ground to the right of the peak rather than as a table.
   ═════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #000; color: var(--ink-warm);
  font-family: 'F37 Analog', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}

/* ── the approach ──────────────────────────────────────────────────────── */
#approach {
  min-height: 118vh;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 var(--gut) 22vh;
  background: radial-gradient(120% 60% at 30% 100%, #0b0b0d 0%, #000 70%);
}
#approach .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
#approach h1 {
  margin-top: 18px; max-width: 16ch; color: #fff; font-weight: 400;
  font-size: clamp(34px, 4.6vw, 72px); line-height: 1; letter-spacing: -.035em;
}
#approach p { margin-top: 18px; max-width: 46ch; color: var(--ink-mute); font-size: 14px; line-height: 1.7; }
#approach .down {
  margin-top: 40px; display: flex; align-items: center; gap: 12px;
  font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-faint);
}
#approach .down i { display: block; width: 1px; height: 40px; background: linear-gradient(var(--accent), transparent);
  animation: m-drip 2.4s cubic-bezier(.65,0,.35,1) infinite; transform-origin: top; }
@keyframes m-drip { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

/* ── the section ───────────────────────────────────────────────────────── */
#scope { position: relative; height: 290vh; }
#stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
#peak-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#stage::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(270deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.5) 34%, rgba(0,0,0,0) 56%);
  opacity: var(--lock, 0);
}
/* the fade in from the approach, so the top of the canvas is not a hard edge */
#stage::before {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 22vh; z-index: 1; pointer-events: none;
  background: linear-gradient(#000, rgba(0,0,0,0));
}

#head {
  position: absolute; left: var(--gut); top: clamp(76px, 11vh, 120px); z-index: 3;
  display: flex; gap: 14px; align-items: baseline;
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint);
}
#head b { color: var(--accent); font-weight: 400; }

/* ── the boxes ─────────────────────────────────────────────────────────
   Four panels set as one cluster to the right of the peak, the way the
   reference sets them: a brick bond, each box sharing an edge with the
   next, so the four read as a single instrument rather than four cards.
   Geometry is METRICS_CONFIG.layout in assets/metrics.js — the cluster's
   frame, and each box's x/y/w/h as fractions of the cluster. */
#metrics { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.mcluster {
  --x: 0; --y: 0;                          /* pointer drift, the cluster as one */
  position: absolute; left: var(--cl); top: var(--ct); width: var(--cw); aspect-ratio: var(--ca);
  transform: translate3d(calc(var(--x) * 1px), calc(var(--y) * 1px), 0);
}
.mbox {
  position: absolute; left: calc(var(--bx) * 100%); top: calc(var(--by) * 100%);
  width: calc(var(--bw) * 100% + 1px); height: calc(var(--bh) * 100% + 1px);   /* +1px: shared hairlines overlap */
  padding: clamp(14px, 1.6vw, 26px) clamp(16px, 1.9vw, 30px);
  display: flex; flex-direction: column; pointer-events: auto;
}

/* the plate: glass and a hairline, opened from its centre line */
.mbox .plate {
  position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.16);
  background: rgba(10,10,12,.78);
  backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1);
  clip-path: inset(50% 0 50% 0);
}
.mbox .hl { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--accent); transform: scaleX(0); opacity: 0; pointer-events: none; }

/* four corner brackets, which lock on once the plate is open */
.mbox .cn { position: absolute; width: 10px; height: 10px; border-color: #fff; border-style: solid; opacity: 0; }
.mbox .cn.tl { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
.mbox .cn.tr { right: -1px; top: -1px; border-width: 1px 1px 0 0; }
.mbox .cn.bl { left: -1px; bottom: -1px; border-width: 0 0 1px 1px; }
.mbox .cn.br { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }

.mbox .in { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; }
.mbox .k { display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); opacity: 0; }
.mbox .k b { color: var(--accent); font-weight: 400; }
.mbox .v {
  display: block; color: #fff; font-weight: 300;
  font-size: clamp(40px, 4.4vw, 84px); line-height: .9; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums; opacity: 0;
}
.mbox .l { display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-mute); opacity: 0; }
.mbox .pin { position: absolute; right: -1px; top: -1px; width: 8px; height: 8px; background: var(--accent); transform: scale(0); }

/* The open/close itself is a GSAP timeline (metrics.js): line → plate →
   corners → data → pin, and the same timeline run backwards to close. */

@media (max-width: 820px) {
  #stage::after { background: linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,0) 70%); }
  .mcluster { left: 16px; right: 16px; width: auto; top: 44%; aspect-ratio: auto; height: 48%; }
  .mbox { padding: 12px 14px; }
  .mbox[data-i="0"] { --bx: 0 !important; --by: 0 !important; --bw: .5 !important; --bh: .5 !important; }
  .mbox[data-i="1"] { --bx: .5 !important; --by: 0 !important; --bw: .5 !important; --bh: .5 !important; }
  .mbox[data-i="2"] { --bx: 0 !important; --by: .5 !important; --bw: .5 !important; --bh: .5 !important; }
  .mbox[data-i="3"] { --bx: .5 !important; --by: .5 !important; --bw: .5 !important; --bh: .5 !important; }
  .mbox .v { font-size: 36px; }
}
@media (prefers-reduced-motion: reduce) { .mbox .plate { clip-path: none; } }
</style>

<body>

<header id="approach">
  <p class="eyebrow">[ &nbsp;Metrics&nbsp; ]</p>
  <h1>A decade of climbs, measured.</h1>
  <p>Twelve years of work with founders and design leaders, from a first MVP to
     platforms that serve millions. Keep scrolling — the peak makes room for the numbers.</p>
  <span class="down"><i></i>Scroll into it</span>
</header>

<section id="scope" aria-label="Metrics">
  <div id="stage">
    <canvas id="peak-canvas"></canvas>
    <div id="head"><b>02</b><span>The numbers</span></div>
    <div id="metrics"></div>
  </div>
</section>
