<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About us — hero</title>
<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/workbench.css">
<script src="assets/manifest.js"></script>
<script src="notes.js"></script>
<script src="assets/workbench.js" defer></script>

<!-- The header sets in Geist Mono, which is the face the design uses. It is
     not this site's F37 Analog, and it is not meant to be: the ask was for
     the navbar exactly as it is. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/ca-nav.css">

<!-- the shared control-panel design; last in the head so it wins over
     whatever styling this page declared for its own panel -->
<link rel="stylesheet" href="assets/tune.css">

<style>
  html, body { margin: 0; background: #000; }
  /* Somewhere for a fixed header to be fixed over. The hero itself is not
     designed yet — this is the ground it stands on, nothing more. */
  .hero {
    min-height: 100vh;
    background: #000;
    color: #f1eee7;
  }
</style>
</head>
<body>

<!-- ─────────────────────────────────────────────────────────────────────────
     About us — hero

     The site header from github.com/sahil639/contentarchitecture-clone,
     ported out of React in assets/ca-nav.js and assets/ca-nav.css. It is a
     fixed, pointer-transparent floating pill: the mark, the primary nav, and
     an announcement marquee along its bottom edge.

     The rest of the hero is still to be designed. Build it inside .hero —
     the header floats over whatever goes there and needs nothing from it.

     The dock on the right files its comments against this page's id in
     assets/manifest.js. Change the label there and notes follow; change the
     id and they do not.
     ───────────────────────────────────────────────────────────────────── -->

<header id="ca-header"></header>

<main class="hero"></main>

<script type="module">
  import { mountCaHeader } from './assets/ca-nav.js';
  mountCaHeader(document.querySelector('#ca-header'));
</script>

<!-- ─────────────────────────────────────────────────────────────────────── -->

</body>
</html>
