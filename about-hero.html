<!-- the shared control-panel design; last in the head so it wins over
     whatever styling this page declared for its own panel -->

<style>
/* ══════════════════════════════════════════════════════════════════════════
   About us — hero: the stone
   ─────────────────────────────────────────────────────────────────────────
   The question is gone; the page says what the name means, plainly, in
   type large enough to be the ground the stone stands on. In front of it,
   in depth, a slab of dark rock with the studio's mark cut into its face
   (assets/about-stone.js — WebGL, made in code, and it answers the hand).
   Behind everything, faint zigzag ridgelines; around the edges, the small
   print of a specimen label: the entry top right, the senses bottom left
   with square bullets, the aim bottom right.

   Depth, back to front: ridgelines → statement → the stone's shadow →
   the stone → the labels.
   ═════════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; background: #000; }
body { color: var(--ink-warm); font-family: 'F37 Analog', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.hero { position: relative; overflow: hidden; height: 100vh; height: 100svh; min-height: 560px; background: #030303; color: #f1eee7; isolation: isolate; }
.hero.grab { cursor: grabbing; }

/* the ridgelines */
.ridges { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.ridges path { fill: none; stroke: rgba(233,236,242,.075); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ridges path.acc { stroke: rgba(255,75,31,.22); }

/* the statement, behind the stone */
.statement { position: absolute; z-index: 1; left: var(--gut); right: var(--gut); top: 50%; transform: translateY(-46%); margin: 0;
  color: #fff; font-weight: 300; text-transform: uppercase; font-size: clamp(52px, 9.6vw, 188px); line-height: .9; letter-spacing: -.05em; pointer-events: none; }
.statement .ln { display: flex; justify-content: space-between; gap: .25em; overflow: hidden; }
.statement .ln > span { display: block; transform: translateY(105%); transition: transform 1.2s cubic-bezier(.22,1,.36,1); }
.statement .ln:nth-child(2) > span { transition-delay: .08s; }
.statement em { font-style: normal; color: var(--accent); }
.hero.in .statement .ln > span { transform: none; }

/* the stone's shadow on the type, then the stone */
.shade { position: absolute; z-index: 2; left: 50%; top: 52%; width: min(46vw, 640px); height: min(70vh, 720px); transform: translate(-46%, -46%);
  background: radial-gradient(closest-side, rgba(0,0,0,.92), rgba(0,0,0,.55) 55%, rgba(0,0,0,0)); filter: blur(10px); pointer-events: none; }
#stone { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; display: block; cursor: grab; touch-action: pan-y; opacity: 0; }

/* the small print */
.lbl { position: absolute; z-index: 4; pointer-events: none; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-mute); }
.lbl .sq { display: inline-block; width: 7px; height: 7px; background: var(--ink-mute); margin-right: 10px; vertical-align: 1px; }
.lbl .sq.acc { background: var(--accent); }
.tl { left: var(--gut); top: clamp(96px, 14vh, 140px); color: var(--accent); }
.tr { right: var(--gut); top: clamp(96px, 14vh, 140px); text-align: right; line-height: 1.9; }
.tr b { color: #fff; font-weight: 400; letter-spacing: .1em; }
.bl { left: var(--gut); bottom: clamp(28px, 6vh, 60px); display: grid; gap: 9px; }
.bl li { list-style: none; display: flex; align-items: center; }
.bl li span { color: #fff; letter-spacing: .1em; }
.br { right: var(--gut); bottom: clamp(28px, 6vh, 60px); max-width: 30ch; text-transform: none; letter-spacing: -.005em; font-size: clamp(14px, 1.15vw, 17px); line-height: 1.5; color: rgba(241,238,231,.78); }
.br .u { --q: 0; display: inline-block; opacity: calc(var(--dim) + (1 - var(--dim)) * var(--q));
  filter: blur(calc((1 - var(--q)) * var(--blur) * 1px)); transform: translateY(calc((1 - var(--q)) * var(--rise) * 1px)); }
.hint { position: absolute; z-index: 4; left: 50%; bottom: clamp(28px, 6vh, 60px); transform: translateX(-50%); pointer-events: none;
  font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap; }
.lbl, .hint { opacity: 0; transition: opacity .9s linear .6s; }
.hero.in .lbl, .hero.in .hint { opacity: 1; }

@media (max-width: 760px) {
  .statement { top: auto; bottom: 33%; transform: none; font-size: clamp(44px, 14vw, 72px); }
  .statement .ln { display: block; } .statement .ln > span { display: inline-block; } .statement .ln > span:first-child { margin-right: .24em; }
  .shade { top: 34%; width: 70vw; height: 40vh; }
  .tr { display: none; }
  .tl { top: 84px; }
  .bl { bottom: auto; top: 84px; right: var(--gut); left: auto; justify-items: end; display: none; }
  .br { left: var(--gut); right: var(--gut); max-width: none; bottom: 24px; font-size: 14px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .statement .ln > span { transition: none; transform: none; } }
</style>
</head>
<body>

<!-- ─────────────────────────────────────────────────────────────────────────
     About us — hero

     The site header (assets/ca-nav.js) over the About hero: the statement of
     what the name means, the engraved stone in front of it (WebGL,
     assets/about-stone.js), ridgelines behind, and the label's small print.

     The site menu and the index read this page from assets/manifest.js by its
     id. Change the label there freely; change the id and it shows as New
     again for everyone.
     ───────────────────────────────────────────────────────────────────── -->

<header id="ca-header"></header>

<main class="hero" id="hero" aria-labelledby="about-h">
  <svg class="ridges" aria-hidden="true" preserveAspectRatio="none"></svg>
  <h1 class="statement" id="about-h"><span class="ln"><span>Tibba</span><span>means</span></span><span class="ln"><span>a higher</span><span>place<em>.</em></span></span></h1>
  <i class="shade" aria-hidden="true"></i>
  <canvas id="stone" aria-hidden="true"></canvas>

  <p class="lbl tl">[ &nbsp;About us&nbsp; ]</p>
  <p class="lbl tr"><span class="sq acc"></span><b>tibba</b> &nbsp;/ tɪb-bɑ / &nbsp;n.<br>Hindi · Punjabi</p>
  <ul class="lbl bl">
    <li><i class="sq acc"></i><span>01</span>&nbsp;&nbsp;A higher place</li>
    <li><i class="sq"></i><span>02</span>&nbsp;&nbsp;A peak</li>
    <li><i class="sq"></i><span>03</span>&nbsp;&nbsp;A design studio, India</li>
  </ul>
  <p class="lbl br" id="aim">Higher place, and that's exactly where we aim to take you and your business, with design interventions.</p>
  <p class="hint">Drag the stone</p>
</main>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
  import { mountCaHeader } from './assets/ca-nav.js';
  import { TICKER } from './assets/site-sections.js';
  /* the site's own three links, as on every page */
  mountCaHeader(document.querySelector('#ca-header'), { announcement: TICKER, nav: [
    { label: 'Work', href: 'final-website-v2.html#summits' }, { label: 'Services', href: 'final-website-v2.html#services' }, { label: 'About', href: 'about-landing.html' }] });
</script>
<script type="module">
  import { mountStone, STONE } from './assets/about-stone.js';
  const hero = document.getElementById('hero');
  const stone = mountStone(document.getElementById('stone'), hero);

  /* the ridgelines: zigzags across the width, seeded so they are the same
     on every load; one in the accent */
  (function ridges() {
    const svg = hero.querySelector('.ridges');
    let s = 23; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const W = 1000, H = 1000; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    let out = '';
    for (let k = 0; k < 9; k++) {
      const base = 120 + k * 100 + (r() - .5) * 40, amp = 30 + r() * 70;
      let x = -20, d = `M${x} ${base}`;
      while (x < W + 20) { x += 26 + r() * 60; d += ` L${x.toFixed(0)} ${(base - r() * amp + amp * .3).toFixed(0)}`; }
      out += `<path d="${d}"${k === 6 ? ' class="acc"' : ''}/>`;
    }
    svg.innerHTML = out;
  })();

  /* the aim lights word by word, in the description page's look */
  const AIM = { delay: 1.1, duration: 0.7, stagger: 0.04, dim: 0.12, blur: 3, rise: 6 };
  (function () {
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const aim = document.getElementById('aim');
    aim.style.setProperty('--dim', AIM.dim); aim.style.setProperty('--blur', AIM.blur); aim.style.setProperty('--rise', AIM.rise);
    aim.innerHTML = aim.textContent.trim().split(/\s+/).map(w => `<span class="u">${w}</span>`).join(' ');
    const us = [...aim.querySelectorAll('.u')];
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const t0 = performance.now() + AIM.delay * 1000;
    (function step(now) {
      let done = true;
      us.forEach((u, i) => {
        const k = REDUCED ? 1 : Math.min(1, Math.max(0, (now - t0 - i * AIM.stagger * 1000) / (AIM.duration * 1000)));
        if (k < 1) done = false;
        u.style.setProperty('--q', ease(k).toFixed(4));
      });
      if (!done) requestAnimationFrame(step);
    })(performance.now());
  })();
  requestAnimationFrame(() => hero.classList.add('in'));

  /* the panel */
  const el = document.createElement('div');
  el.id = 'tune';
  const R = (id, label, min, max, step, val) => `<div class="row"><label>${label}<i id="v-${id}">${val}</i></label><input type="range" id="s-${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
  el.innerHTML = `<div id="tune-head"><b>About hero — stone</b><button id="tune-hide" title="Hide (H)">–</button></div>
    <p class="tune-sub">The stone</p>
    ${R('dp', 'Cut depth', .02, .16, .005, STONE.depth)}${R('rg', 'Rough sides', 0, 2, .05, STONE.rough)}${R('gr', 'Grain', 0, 3, .05, STONE.grain)}
    <p class="tune-sub">The hand</p>
    ${R('tl', 'Lean to pointer', 0, 2, .05, STONE.tilt)}${R('lt', 'Raking light', 0, 2.5, .05, STONE.light)}${R('fl', 'Idle float', 0, 2, .05, STONE.float)}`;
  document.body.appendChild(el);
  const bind = (id, fn) => el.querySelector('#s-' + id).addEventListener('input', e => { const v = +e.target.value; el.querySelector('#v-' + id).textContent = v; fn(v); });
  let rb = 0; const later = () => { clearTimeout(rb); rb = setTimeout(() => stone.rebuild(), 120); };
  bind('dp', v => { STONE.depth = v; later(); }); bind('rg', v => { STONE.rough = v; later(); });
  bind('gr', v => stone.setGrain(v)); bind('tl', v => { STONE.tilt = v; }); bind('lt', v => { STONE.light = v; }); bind('fl', v => { STONE.float = v; });
  el.querySelector('#tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
  if (window.wb && window.wb.adopt) window.wb.adopt();
</script>
</body>
</html>
