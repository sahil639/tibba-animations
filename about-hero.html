<style>
/* ══════════════════════════════════════════════════════════════════════════
   About us — hero
   ─────────────────────────────────────────────────────────────────────────
   about.html's hero, kept as it is — the question the studio is named
   after, the dictionary entry that answers it, the aim, and the summit
   close up with the studio's flag on it (assets/about-peak.js) — and set in
   the type system the description page now uses: the same left edge
   (--gut), the same measure (--copy-max), the same light, tightly tracked
   display weight, the same bracketed eyebrow.

   One addition, kept small: the aim line lights word by word on load with
   the description page's exact look (a dim resting word, a hair of blur, a
   few px of rise), so the hero hands over to the description as one
   voice. HERO_CONFIG in the script times it.
   ═════════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; background: #000; }
body { color: var(--ink-warm); font-family: 'F37 Analog', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.hero {
  --copy-max: min(92vw, 1640px);
  position: relative; overflow: hidden; min-height: 100vh; min-height: 100svh;
  display: flex; align-items: center; background: #000; color: #f1eee7;
  padding: clamp(110px, 16vh, 170px) 0 clamp(48px, 8vw, 110px);   /* .wrap (site.css) carries the --gut */
}
#about-peak { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.hero::before {
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, #000 0%, rgba(0,0,0,.84) 30%, rgba(0,0,0,0) 58%),
              linear-gradient(0deg, #000 0%, rgba(0,0,0,0) 22%);
}
.hero .wrap { position: relative; z-index: 2; width: 100%; max-width: calc(var(--copy-max) + var(--gut) * 2); margin: 0; }
.hero .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.hero h1 {
  margin-top: 18px; max-width: 13ch; color: #fff;
  font-weight: 300; font-size: clamp(40px, 6.4vw, 112px); line-height: 1; letter-spacing: -.04em;
  --odo-h: 1.04em;
}
.hero .definition { margin-top: clamp(24px, 3vw, 40px); font-size: clamp(14px, 1.2vw, 18px); letter-spacing: .02em; color: var(--ink-mute); }
.hero .definition b { color: var(--accent); font-weight: 400; }
.hero .aim {
  margin-top: clamp(22px, 2.8vw, 36px); max-width: 24ch; color: #fff;
  font-weight: 300; font-size: clamp(22px, 2.6vw, 44px); line-height: 1.16; letter-spacing: -.025em;
}
.hero .aim .u { --q: 0; display: inline-block; opacity: calc(var(--dim) + (1 - var(--dim)) * var(--q));
  filter: blur(calc((1 - var(--q)) * var(--blur) * 1px)); transform: translateY(calc((1 - var(--q)) * var(--rise) * 1px)); }
.hero .cue { margin-top: clamp(36px, 5vw, 64px); display: flex; align-items: center; gap: 12px;
  font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-faint); }
.hero .cue i { display: block; width: 1px; height: 36px; background: linear-gradient(var(--accent), transparent); transform-origin: top; animation: cue 2.4s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes cue { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }
@media (max-width: 760px) {
  .hero { align-items: flex-end; }
  .hero::before { background: linear-gradient(0deg, #000 18%, rgba(0,0,0,.55) 60%, rgba(0,0,0,.2)); }
}
@media (prefers-reduced-motion: reduce) { .hero .cue i { animation: none; } }
</style>

<body>

<!-- ─────────────────────────────────────────────────────────────────────────
     About us — hero

     The site header from github.com/sahil639/contentarchitecture-clone,
     ported out of React in assets/ca-nav.js and assets/ca-nav.css. It is a
     fixed, pointer-transparent floating pill: the mark, the primary nav, and
     an announcement marquee along its bottom edge.

     Below it, the About hero: about.html's hero, in the About pages' new
     type system (see the note in the <style> block).

     The site menu and the index read this page from assets/manifest.js by its
     id. Change the label there freely; change the id and it shows as New
     again for everyone.
     ───────────────────────────────────────────────────────────────────── -->

<header id="ca-header"></header>

<main class="hero">
  <canvas id="about-peak" aria-hidden="true"></canvas>
  <div class="wrap">
    <p class="eyebrow">[ &nbsp;About us&nbsp; ]</p>
    <h1 data-odo>What does Tibba mean?</h1>
    <p class="definition"><b>tibba</b> / tɪb-bɑ / n &nbsp;1. a higher place &nbsp;•&nbsp; 2. a peak</p>
    <p class="aim" id="aim">Higher place, and that's exactly where we aim to take you and your
       business, with design interventions.</p>
    <p class="cue"><i></i>Who we are</p>
  </div>
</main>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module">
  import { mountCaHeader } from './assets/ca-nav.js';
  mountCaHeader(document.querySelector('#ca-header'));
</script>
<script type="module" src="assets/about-peak.js"></script>
<script>
/* HERO_CONFIG — the aim line's load-in, in the description page's look */
const HERO_CONFIG = {
  delay: 0.9,        // s after load before the first word
  duration: 0.7,     // s for one word
  stagger: 0.045,    // s between words
  dim: 0.12, blur: 3, rise: 6,   // the resting word — the same values as about-description
};
(function () {
  const C = HERO_CONFIG, REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const aim = document.getElementById('aim');
  aim.style.setProperty('--dim', C.dim); aim.style.setProperty('--blur', C.blur); aim.style.setProperty('--rise', C.rise);
  const words = aim.textContent.trim().split(/\s+/);
  aim.innerHTML = words.map(w => `<span class="u">${w}</span>`).join(' ');
  const us = [...aim.querySelectorAll('.u')];
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const t0 = performance.now() + C.delay * 1000;
  (function step(now) {
    let done = true;
    us.forEach((u, i) => {
      const k = REDUCED ? 1 : Math.min(1, Math.max(0, (now - t0 - i * C.stagger * 1000) / (C.duration * 1000)));
      if (k < 1) done = false;
      u.style.setProperty('--q', ease(k).toFixed(4));
    });
    if (!done) requestAnimationFrame(step);
  })(performance.now());
})();
</script>
