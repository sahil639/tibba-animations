<!-- Case study v2 (Website v3). Built by assets/case-v2.js from the 'breathe-esg'
     entry in assets/cases.js, in the design system of assets/case-v2.css;
     the images come from assets/work/ (see assets/work.js). Nothing to edit
     here. -->
<body data-page="work" data-case="breathe-esg">

<header id="ca-header"></header>

<main>
  <section data-case-hero></section>
  <section data-case-ledger></section>
  <div data-case-body></div>
  <section data-case-more></section>
</main>

<footer data-site-footer></footer>

<script type="module">
  import { mountCaHeader } from './assets/ca-nav.js';
  import { TICKER } from './assets/site-sections.js';
  /* Website v3's navbar, hung from the top as on the home page */
  const h = document.getElementById('ca-header');
  mountCaHeader(h, { announcement: TICKER, home: 'website-v3.html', nav: [
    { label: 'Work', href: 'website-v3.html#work' }, { label: 'Services', href: 'website-v3.html#services' },
    { label: 'About', href: 'about-landing.html' }, { label: 'Contact', href: '#contact' }] });
  h.classList.add('site-nav');
  requestAnimationFrame(() => document.documentElement.classList.add('site-nav-in'));
  h.querySelector('a[href="#contact"]').addEventListener('click', e => { e.preventDefault(); document.querySelector('[data-site-footer]').scrollIntoView({ behavior: 'smooth' }); });
</script>
</body>
