<!-- ─────────────────────────────────────────────────────────────────────────
     About us — the one About page, stitched the same way as Website v2
     (the old single-page About us and the About landing, merged)

       About us — hero          about-hero.html
       About us — description   about-description.html
       About us — team          about-team.html
       About us — foundations   about-foundations.html
       (the numbers, about-numbers.html, are off: the home page has them)

<body>
<header id="ca-header"></header>
<main id="stack"></main>

<script type="module">
  import { mountSite } from './assets/site-shell.js?v=8';
  import { ABOUT_SECTIONS, ABOUT_LINKS, V3_SECTIONS, V3_LAYOUT_KEY, loadLayout, resolveLayout, sectionsFor } from './assets/site-sections.js?v=5';
  /* the same footer as Website v3: whichever one it is set to show (by file,
     since v3 and the About page list their footers differently) */
  const v3 = loadLayout(V3_SECTIONS, V3_LAYOUT_KEY).find(e => e.id === 'footer');
  const v3Footer = V3_SECTIONS.find(s => s.id === 'footer').variants[v3 ? v3.variant : 0].file;
  const fIx = ABOUT_SECTIONS.find(s => s.id === 'footer').variants.findIndex(v => v.file === v3Footer);
  const layout = resolveLayout(null, ABOUT_SECTIONS).map(e => e.id === 'footer' && fIx >= 0 ? { ...e, variant: fIx } : e);
  window.tibba = mountSite({
    sections: sectionsFor(layout, ABOUT_SECTIONS),
    home: 'website-v3.html',
    links: ABOUT_LINKS,
  });
</script>
<!-- primary / secondary typography control (assets/type-control.js) -->

</body>
