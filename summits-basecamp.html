<style>
/* ══════════════════════════════════════════════════════════════════════════
   Our summits — 1 · Base Camp
   ─────────────────────────────────────────────────────────────────────────
   Website v3's stacking cards over the range, one summit in focus at a
   time. The summit in focus stands forward and low in the frame, right on
   the progress bar: lit, inked in its own pen, full height, a glowing dot
   pulsing at its top. The rest of the range recedes — dimmer, thinner,
   cooler, sparser, lower — with no dot and no trail. Each card plays its
   project's Rive thumbnail (assets/rive/<client>.riv) while it is the one
   in focus or under the pointer, tinted toward the summit's colour.

   Scene, state machine, panel: assets/basecamp.js (BASECAMP_CONFIG).
   Phones: the section pins; the range on top, and under it one panel that
   holds the card in focus, its Rive and the progress bar.
   ═════════════════════════════════════════════════════════════════════════ */
:root { --dock: 46vh; --ac: #4DD9C0; --pulse-s: 1.8s; --pulse-k: 1; --rv-tint: 0; --bg: #0c0b0a; }
html, body { background: var(--bg); }
.bc-head { padding: clamp(96px, 14vh, 150px) var(--gut) clamp(30px, 5vh, 60px); }
.bc-head .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.bc-head h2 { margin-top: 14px; color: #fff; font-weight: 400; font-size: clamp(26px, 2.6vw, 44px); line-height: 1.1; letter-spacing: -.025em; max-width: 22ch; }

#bc { position: relative; }

/* ── the scene, docked under the cards ─────────────────────────────────── */
.bc-dock { position: sticky; top: calc(100vh - var(--dock)); height: var(--dock); margin-bottom: calc(-1 * var(--dock)); z-index: 20; pointer-events: none; }
.bc-dock::before { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to top, var(--bg) 0%, rgba(12,11,10,.55) 12%, rgba(12,11,10,0) 26%); z-index: 1; }
#range { position: absolute; inset: 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent), linear-gradient(transparent, #000 22%);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent), linear-gradient(transparent, #000 22%);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
#range .fs-layer { z-index: 3; }
.bc-bar { position: absolute; z-index: 4; left: 50%; bottom: clamp(16px, 3vh, 30px); transform: translateX(-50%); width: min(52vw, 820px); pointer-events: auto; }
.bc-bar .lbl { display: flex; justify-content: center; gap: 10px; width: max-content; margin: 0 auto 12px; padding: 5px 10px; background: rgba(12,11,10,.82); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(233,236,242,.55); }
.bc-bar .lbl b { color: var(--ac); font-weight: 400; transition: color .4s linear; }
.bc-bar .lbl span { color: rgba(233,236,242,.35); }

/* the one live mark: the focused summit's dot, glowing and pulsing */
.fs-peak.bc-mark { opacity: 1; transition: opacity .5s ease; }
.fs-peak.bc-mark:not(.on) { display: none; }
.fs-peak.bc-mark.arriving { opacity: .35; }
.fs-peak.bc-mark i { left: -4.5px; top: -4.5px; width: 9px; height: 9px; background: #fff;
  box-shadow: 0 0 0 2px var(--c), 0 0 16px 5px color-mix(in srgb, var(--c) 70%, transparent), 0 0 40px 10px color-mix(in srgb, var(--c) 30%, transparent); }
.fs-peak.bc-mark.on i { left: -4.5px; top: -4.5px; width: 9px; height: 9px; }
.fs-peak.bc-mark::before, .fs-peak.bc-mark::after { left: -4.5px; top: -4.5px; width: 9px; height: 9px; border-width: 1.5px;
  animation: bcPulse var(--pulse-s) cubic-bezier(.16,.62,.36,1) infinite; }
.fs-peak.bc-mark::after { animation-delay: calc(var(--pulse-s) / 2); }
.fs-peak.bc-mark.on::before, .fs-peak.bc-mark.on::after { animation-duration: var(--pulse-s); }
@keyframes bcPulse { 0% { transform: scale(1); opacity: .75; } 70% { opacity: .1; } 100% { transform: scale(calc(1 + 5 * var(--pulse-k))); opacity: 0; } }
.bc-nodot .fs-peak.bc-mark { display: none; }
.bc-still .fs-peak.bc-mark::before, .bc-still .fs-peak.bc-mark::after { animation: none; opacity: 0; }

/* ── the cards ─────────────────────────────────────────────────────────── */
.pn { --c: #fff; position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: var(--bg); }
.pn + .pn { box-shadow: 0 -30px 60px rgba(0,0,0,.55); }
.pn .in { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); gap: clamp(28px, 5vw, 96px); align-items: center;
  padding: clamp(84px, 11vh, 120px) var(--gut) calc(var(--dock) * .82); transform-origin: 50% 0;
  transform: scale(calc(1 - var(--sink, 0) * .06)) translateY(calc(var(--sink, 0) * -3vh)); filter: brightness(calc(1 - var(--sink, 0) * .55)); }
.pn .txt { display: flex; flex-direction: column; gap: clamp(12px, 2vh, 22px); align-items: flex-start; }
.pn .txt .sl-title { font-size: clamp(26px, 2.7vw, 48px); }
.pn .media { display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 16px); min-height: 0; }

/* the Rive thumbnail: plays while active or hovered; tinted toward the summit */
.rv { position: relative; display: block; aspect-ratio: 928 / 486; max-height: calc(100vh - var(--dock) * .82 - 220px); overflow: hidden; background: #141210;
  border: 1px solid rgba(233,236,242,.1); transition: border-color .4s linear, box-shadow .4s ease, filter .5s ease; }
.rv .wk-img { position: absolute; inset: 0; height: 100%; aspect-ratio: auto; }
.rv .rv-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; transition: opacity .5s linear; }
.rv.rv-live .rv-canvas { opacity: 1; }
.rv .tint { position: absolute; inset: 0; z-index: 3; background: var(--c); mix-blend-mode: color; opacity: var(--rv-tint); pointer-events: none; }
.rv .cap { position: absolute; z-index: 4; left: 0; bottom: 0; padding: 7px 10px; background: rgba(12,11,10,.78);
  font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: rgba(233,236,242,.7); }
.rv::before, .rv::after { content: ''; position: absolute; z-index: 5; width: 12px; height: 12px; border: solid var(--c); pointer-events: none; opacity: 0; transition: opacity .4s linear; }
.rv::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; } .rv::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
.pn:not(.active):not(.hovered) .rv { filter: grayscale(.7) brightness(.62); }
.pn.active .rv::before, .pn.active .rv::after, .pn.hovered .rv::before, .pn.hovered .rv::after { opacity: 1; }
.pn.hovered .rv { border-color: color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent), 0 20px 50px rgba(0,0,0,.5); }
.pn .sl-stats { max-width: none; }

/* ── phones: the scene on top, one panel under it ──────────────────────── */
.bc-phone #bc { height: 400vh; }
.bc-phone .bc-dock { top: 0; height: 100vh; height: 100svh; margin-bottom: 0; display: grid; grid-template-rows: 38% 1fr; pointer-events: auto; }
.bc-phone .bc-dock::before { background: linear-gradient(to top, var(--bg) 58%, rgba(12,11,10,0) 66%); }
.bc-phone #range { position: relative; inset: auto; grid-row: 1; -webkit-mask-image: linear-gradient(transparent, #000 25%); mask-image: linear-gradient(transparent, #000 25%); }
.bc-phone #bc-panel { position: relative; z-index: 3; grid-row: 2; border-top: 1px solid rgba(233,236,242,.12); padding-bottom: 76px; overflow: hidden; }
.bc-phone #stack { position: absolute; inset: 0 0 76px; }
.bc-phone .pn { position: absolute; inset: 0; height: auto; background: none; box-shadow: none; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
.bc-phone .pn.active { opacity: 1; pointer-events: auto; }
.bc-phone .pn .in { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px var(--gut) 0; transform: none; filter: none; }
.bc-phone .pn .txt { gap: 8px; order: 1; }
.bc-phone .pn .media { order: 2; }
.bc-phone .pn .txt .sl-title { font-size: clamp(19px, 5.4vw, 26px); }
.bc-phone .pn .sl-body, .bc-phone .pn .sl-tags { display: none; }
.bc-phone .pn .sl-cta { position: absolute; left: var(--gut); bottom: 6px; padding: 10px 14px; font-size: 10.5px; }
.bc-phone .rv { max-height: none; }
.bc-phone .pn .sl-stats b { font-size: 22px; } .bc-phone .pn .sl-stats div > span { font-size: 11px; }
.bc-phone .bc-bar { width: calc(100% - 2 * var(--gut)); bottom: 12px; }
.bc-phone .bc-bar .lbl { display: none; }
.bc-phone .sl-tabs button { font-size: 9.5px; letter-spacing: .02em; } .bc-phone .sl-tabs button::before { margin-bottom: 8px; }
#bc-panel { display: contents; }
.bc-phone #bc-panel { display: block; }
@media (prefers-reduced-motion: reduce) { .fs-peak.bc-mark::before, .fs-peak.bc-mark::after { animation: none; opacity: 0; } }
</style>
