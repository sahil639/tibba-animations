<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer — orange field</title>
<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/workbench.css">
<script src="assets/manifest.js"></script>
<script src="assets/whats-new.js"></script>
<script src="assets/workbench.js" defer></script>
<link rel="stylesheet" href="assets/footer-kit.css">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Footer — orange field
   ─────────────────────────────────────────────────────────────────────────
   After the yellow "Putting the human back into humankind" footer: one
   flat field of colour — ours is the brand orange — a big line on the left
   with a highlighter swept under one word, the campfire large in the middle
   drawn in black dots, and next availability with underlined links on the
   right.
   Phones: the line, the fire, the links.
   Shared parts: assets/footer-kit.js / .css. Every value: the CONFIG object
   in the script, on the panel, and bakeable.
   ═════════════════════════════════════════════════════════════════════════ */
body { background: var(--acc); }
.hu { position: relative; min-height: 100svh; background: var(--acc); color: #0b0b0c; display: grid; grid-template-columns: 1.05fr 1fr .75fr; gap: 24px; padding: clamp(48px, 7vh, 80px) var(--gut); overflow: hidden; }
.hu::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 60% at 55% 60%, rgba(255,200,140,.45), rgba(255,75,31,0) 70%); pointer-events: none; }
.hu h2 { position: relative; z-index: 2; font-weight: 500; font-size: clamp(54px, 6.2vw, 116px); line-height: .96; letter-spacing: -.04em; }
.hu h2 em { font-style: normal; position: relative; z-index: 0; }
.hu h2 em::after { content: ''; position: absolute; z-index: -1; left: .1em; right: .05em; bottom: .02em; height: .2em; background: #f4f2ec; transform: scaleX(0); transform-origin: left; transition: transform 1.1s cubic-bezier(.65,0,.35,1) .3s; }
.hu.on h2 em::after { transform: scaleX(1); }
.hu h2 i { display: inline-block; width: .5em; height: .5em; margin-left: .08em; background: #0b0b0c; vertical-align: .1em; }
.hu canvas.fire { position: absolute; left: 26%; top: 6%; width: 52%; height: 94%; z-index: 1; }
.hu .avail { position: relative; z-index: 2; grid-column: 2; justify-self: end; font-size: clamp(20px, 1.6vw, 28px); line-height: 1.4; }
.hu .avail b { display: block; font-weight: 500; }
.hu ul { position: relative; z-index: 2; list-style: none; display: grid; gap: 16px; align-content: start; font-size: clamp(20px, 1.6vw, 28px); }
.hu ul a { background: linear-gradient(#f4f2ec, #f4f2ec) 0 100% / 100% 3px no-repeat; padding-bottom: 2px; transition: background-size .35s; }
.hu ul a:hover { background-size: 0 3px; }
.hu .base { position: absolute; left: var(--gut); bottom: 24px; z-index: 2; font-size: 13px; }
@media (max-width: 860px) {
  .hu { grid-template-columns: 1fr; padding: 40px 16px 56px; }
  .hu h2 { font-size: 14vw; }
  .hu canvas.fire { position: relative; left: auto; right: auto; top: auto; bottom: auto; width: 100%; height: 92vw; }
  .hu .avail { grid-column: auto; justify-self: start; }
}
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>
<body>
<footer class="foot hu" id="hu" aria-label="Footer">
  <h2>Putting the <em>climb</em> back into design<i aria-hidden="true"></i></h2>
  <canvas class="fire" aria-hidden="true"></canvas>
  <p class="avail">Next availability:<b>1/1/27</b></p>
  <ul><li><a href="mailto:hello@tibba.design">Email us</a></li><li><a href="https://www.linkedin.com/company/tibba-design-studio/">Connect on LinkedIn</a></li><li><a href="https://www.instagram.com/tibba.design/">Follow on Instagram</a></li><li><a href="https://medium.com/@tibbadesignstudio">Our field notes</a></li></ul>
  <p class="base">© <span class="yr"></span> Tibba Design Studio</p>
</footer>
<script type="module">
  import { fire, draggable, clocks, ticker, barWord, panel, slider, applyBaked, pad, year, LINE } from './assets/footer-kit.js';
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  $$('.yr').forEach(e => { e.textContent = year(); });
  const CONFIG = { fire: { mode: 'dither', palette: 'mono', cell: 6, dot: .86, contrast: 1.25, flame: 1.15, embers: 1, speed: .9, scale: 1.25, wood: .95 } };
  const KEY = 'tibba.bake.footer-human'; applyBaked(KEY, CONFIG);
  /* black dots on orange: the fire's ink is the page's black */
  const f = fire($('canvas.fire'), { ...CONFIG.fire, ink: '#0b0b0c', x: .5, y: .82 });
  new IntersectionObserver(([e], io) => { if (e.isIntersecting) { io.disconnect(); $('#hu').classList.add('on'); } }, { threshold: .3 }).observe($('#hu'));
  panel({ title: 'Footer — orange field', key: KEY, config: CONFIG, name: 'CONFIG', fires: [{ fire: f, cfg: CONFIG.fire }] });
</script>
</body>
</html>
