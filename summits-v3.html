<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our summits — Summits v3</title>
<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/workbench.css">
<script src="assets/manifest.js"></script>
<script src="assets/whats-new.js"></script>
<script src="assets/workbench.js" defer></script>
<link rel="stylesheet" href="assets/summits-range.css">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Our summits — Summits v3
   ─────────────────────────────────────────────────────────────────────────
   Summits v2 without the cards: the same country, camera, trails and
   rail, with the section's copy kept bottom-left and naming the summit in
   focus. The move between summits is one continuous chase, so every
   transition is smooth. Click a summit to open its case study.
   Behaviour and every default: SUMMITS2_CONFIG in assets/summits-v2.js.
   ═════════════════════════════════════════════════════════════════════════ */
#scope { height: 520vh; }

/* the summit markers and the walkers (as Four Summits) */
.fs-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.fs-layer > span { position: absolute; left: 0; top: 0; will-change: transform; }
.fs-peak i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; background: var(--accent);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6); transform: scale(.55); opacity: .6; transition: transform .45s cubic-bezier(.65,0,.35,1), opacity .45s linear; }
.fs-peak.arrived i { transform: scale(1); opacity: 1; }
.fs-peak em { position: absolute; left: 12px; top: -20px; font: 400 9.5px/1 'F37 Analog', system-ui, sans-serif; font-style: normal;
  letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.45); white-space: nowrap; transition: color .4s linear; }
.fs-peak.on em { color: #fff; }
.fs-peak.on i::after { content: ''; position: absolute; inset: -1px; border: 1px solid var(--accent); animation: fs-ping 2.2s cubic-bezier(.16,.62,.36,1) infinite; }
@keyframes fs-ping { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.4); } }
.fs-head::before { content: ''; position: absolute; left: -3.5px; top: -3.5px; width: 7px; height: 7px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 2px var(--c), 0 0 14px 3px var(--c); }

/* the rail, as on Three Summits */
#rail { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); z-index: 6; display: grid; gap: 14px; opacity: 1; pointer-events: auto; }
#rail button { appearance: none; -webkit-appearance: none; display: flex; align-items: center; justify-content: flex-end; gap: 9px;
  background: none; border: 0; padding: 2px 0; cursor: pointer; color: #fff; font: 11px/1 'F37 Analog', system-ui, sans-serif;
  letter-spacing: .12em; opacity: .36; transition: opacity .25s; }
#rail button .tick { display: block; width: 16px; height: 1px; background: currentColor; order: 2; transition: width .35s cubic-bezier(.22,.9,.3,1), background .35s; }
#rail button .nm { font-size: 9.5px; text-transform: uppercase; letter-spacing: .16em; opacity: 0; transition: opacity .25s; }
#rail button:hover .nm, #rail button[aria-current="true"] .nm { opacity: 1; }
#rail button[aria-current="true"] { opacity: 1; }
#rail button[aria-current="true"] .tick { width: 34px; background: var(--accent); }
#rail button:hover { opacity: .8; }
@media (prefers-reduced-motion: reduce) { .fs-peak.on i::after { animation: none; } }

/* LAYOUT:START */
/* The words and the hover, as the four summits on Final Website
   (final-website.html, section 4): the heading top left, a radar mark on
   each summit, a rail of rules on the right that names a summit on hover,
   the counter bottom right, and the case band along the foot — tags, the
   title with its phrase in the case's colour and a round arrow for a full
   stop, the summary beside it. The whole band is the link; on hover the
   title inverts and the arrow rolls through. */
#stage::after { opacity: 1; background: linear-gradient(180deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,.3) 18%, rgba(0,0,0,0) 32%); }
#range-head { position: absolute; inset: 0 0 auto 0; z-index: 12; pointer-events: none; padding: clamp(96px, 14vh, 150px) var(--gut) 0; }
#range-head .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
#range-head h2 { margin-top: 12px; font-size: clamp(19px, 2.1vw, 30px); font-weight: 400; line-height: 1.2; letter-spacing: -.02em; color: #fff; max-width: 22ch; }

/* the summit marks: one solid dot in the case's colour, pinging */
.fs-peak { cursor: pointer; pointer-events: auto; --mkr-c: var(--c, #fff); opacity: 0; transition: opacity .5s ease; }
.fs-peak.arrived { opacity: 1; }
.fs-peak.arrived:not(.on) { opacity: .55; }
.fs-peak em { display: none; }
.fs-peak i { left: -2.5px; top: -2.5px; width: 5px; height: 5px; border-radius: 50%; background: var(--mkr-c); transform: none; opacity: 1;
  box-shadow: 0 0 10px color-mix(in srgb, var(--mkr-c) 55%, transparent); transition: width .3s, height .3s, left .3s, top .3s, box-shadow .3s; }
.fs-peak.on i { left: -3.5px; top: -3.5px; width: 7px; height: 7px;
  box-shadow: 0 0 18px color-mix(in srgb, var(--mkr-c) 75%, transparent), 0 0 6px color-mix(in srgb, var(--mkr-c) 55%, transparent); }
.fs-peak.on i::after { display: none; }
.fs-peak::before, .fs-peak::after { content: ''; position: absolute; left: -2.5px; top: -2.5px; width: 5px; height: 5px; border-radius: 50%;
  border: 1px solid var(--mkr-c); box-sizing: border-box; opacity: 0; pointer-events: none; animation: mkrPing 2.8s cubic-bezier(.16,.62,.36,1) infinite; }
.fs-peak::after { animation-delay: 1.4s; }
.fs-peak.on::before, .fs-peak.on::after { animation-duration: 2.1s; } .fs-peak.on::after { animation-delay: 1.05s; }
.fs-peak:not(.on)::before, .fs-peak:not(.on)::after { animation-duration: 3.6s; } .fs-peak:not(.on)::after { animation-delay: 1.8s; }
.fs-peak > b { position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; }      /* the hit area */
@keyframes mkrPing { 0% { transform: scale(1); opacity: .5; } 65% { opacity: .12; } 100% { transform: scale(7.5); opacity: 0; } }

/* the rail: rules, right-aligned, the active one longer and in the case's colour */
#rail { right: clamp(20px, 3vw, 48px); gap: 2px; justify-items: end; z-index: 12; }
#rail button { position: relative; width: 22px; height: 17px; padding: 8px 0; opacity: 1; background: rgba(255,255,255,.28); background-clip: content-box;
  transition: background-color .35s, width .35s cubic-bezier(.22,1,.36,1), height .35s; }
#rail button > * { display: none; }
#rail button::after { content: attr(data-label); position: absolute; right: calc(100% + 14px); top: 50%; transform: translateY(-50%);
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.3); white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
#rail button:hover { background-color: rgba(255,255,255,.42); opacity: 1; }
#rail button:hover::after, #rail button[aria-current="true"]::after { opacity: 1; }
#rail button[aria-current="true"] { width: 40px; height: 18px; background-color: var(--ca, rgba(255,255,255,.85)); }
#rail button[aria-current="true"]::after { color: rgba(255,255,255,.6); }
#case-counter { position: absolute; z-index: 12; right: clamp(20px, 3vw, 48px); bottom: 38px; font-size: 11px; letter-spacing: .1em;
  color: rgba(255,255,255,.2); font-variant-numeric: tabular-nums; pointer-events: none; }
#case-counter b { color: rgba(255,255,255,.55); font-weight: 500; }

/* the case band */
#case-card { position: absolute; left: 0; right: 0; bottom: clamp(74px, 11vh, 128px); z-index: 30; display: grid;
  grid-template-columns: minmax(0, 58%) minmax(0, 1fr); grid-template-rows: auto auto; column-gap: clamp(24px, 4vw, 72px); align-items: start;
  padding-inline: var(--gut); color: inherit; text-decoration: none; cursor: pointer;
  opacity: 0; transform: translateY(14px); transition: opacity .42s ease, transform .42s cubic-bezier(.22,1,.36,1); }
#case-card.shown { opacity: 1; transform: none; }
#case-card::before { content: ''; position: absolute; left: 0; right: 0; bottom: calc(-1 * clamp(74px, 11vh, 128px)); height: 52vh; z-index: -1; pointer-events: none;
  background: linear-gradient(to top, rgba(0,0,0,.94) 0%, rgba(0,0,0,.74) 38%, rgba(0,0,0,0) 100%); }
#cc-inner { display: contents; }
.cc-cat { grid-column: 1; grid-row: 1; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ca); margin-bottom: 14px; }
.cc-title { grid-column: 1; grid-row: 2; font-size: clamp(24px, 3.2vw, 50px); font-weight: 500; line-height: 1.06; letter-spacing: -.025em; color: #fff; transition: color .42s ease; }
.cc-title .hi { color: var(--ca); transition: color .42s ease; }
.cc-body { grid-column: 2; grid-row: 2; align-self: start; font-size: clamp(13px, 1.05vw, 15px); line-height: 1.65; color: rgba(255,255,255,.52); max-width: 40ch; }
.cc-cat, .cc-title, .cc-body { transition: opacity .2s ease, color .42s ease; }
#case-card.swap .cc-cat, #case-card.swap .cc-title, #case-card.swap .cc-body { opacity: 0; }
.cc-go { display: inline-block; position: relative; vertical-align: middle; top: -.06em; width: .82em; height: .82em; margin-left: .3em;
  border: 2px solid rgba(255,255,255,.9); border-radius: 50%; overflow: hidden; color: #fff;
  transition: background-color .42s ease, border-color .42s ease, color .42s ease; }
.cc-go-roll { position: absolute; top: 0; left: 0; display: flex; width: 200%; height: 100%; transform: translateX(-50%); transition: transform .48s cubic-bezier(.22,1,.36,1); }
.cc-go-roll i { flex: 0 0 50%; height: 100%; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: .34em; line-height: 1; }
#case-card:hover .cc-go-roll, #case-card:focus-visible .cc-go-roll { transform: translateX(0); }
#case-card:hover .cc-go, #case-card:focus-visible .cc-go { background-color: var(--ca, #fff); border-color: var(--ca, #fff); color: #0D0F1E; }
#case-card:hover .cc-title, #case-card:focus-visible .cc-title { color: var(--ca, #fff); }
#case-card:hover .cc-title .hi, #case-card:focus-visible .cc-title .hi { color: #fff; }
#case-card:focus-visible { outline: 1px solid var(--ca); outline-offset: 14px; border-radius: 4px; }
@media (max-width: 900px) {
  #case-card { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  .cc-cat, .cc-title, .cc-body { grid-column: 1; }
  .cc-cat { grid-row: 1; } .cc-title { grid-row: 2; margin-bottom: 16px; } .cc-body { grid-row: 3; }
  #rail { display: none; }
}
@media (prefers-reduced-motion: reduce) { .cc-go-roll { transition: none; } .fs-peak::before, .fs-peak::after { animation: none; opacity: 0; } }
/* LAYOUT:END */
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>
<body data-layout="summits">
<div id="scope">
  <div id="stage">
    <canvas id="peak-canvas"></canvas>
    <!-- MARKUP:START -->
    <div id="range-head">
      <p class="eyebrow">[ &nbsp;OUR SUMMITS&nbsp; ]</p>
      <h2>Four climbs, and what they were for</h2>
    </div>
    <p id="case-counter"><b id="c-num">01</b>&thinsp;/&thinsp;04</p>
    <a id="case-card" href="#" aria-label="Open case study">
      <span id="cc-inner"><span class="cc-cat" id="cc-cat"></span><span class="cc-title" id="cc-title"></span><span class="cc-body" id="cc-body"></span></span>
    </a>
    <!-- MARKUP:END -->
    <nav id="rail" aria-label="Summits"></nav>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.min.js"}}</script>
<script type="module">
  import { mountSummitsV2, SUMMITS2_CONFIG as C } from './assets/summits-v2.js';
  import { applyBaked, bakeControls } from './assets/bake.js';
  /* baked settings (the panel's Bake button) load over the defaults before anything mounts */
  const BAKE_KEY = 'tibba.bake.summits-v3';
  /* v3's own ground: more country round the four summits than v2 — more and
     closer landforms, livelier ground and a denser contour sheet */
  Object.assign(C.fill, { count: 46, height: 0.72, spacing: 18, relief: 14 });
  C.terrain = { levels: 44, width: 1 };
  /* phones: a lighter survey — fewer landforms and contour levels to build
     and draw, so the section arrives quickly and scrolls smoothly */
  if (matchMedia('(max-width: 760px), (pointer: coarse)').matches) { C.fill.count = 24; C.terrain.levels = 30; }
  applyBaked(BAKE_KEY, C);
  /* the band's words, as final-website.html's (assets/home.js CASES / BAND) */
  const BAND = [
    { tags: 'Fintech · App · Website', title: 'How we helped Groww <span class="hi">boost engagement</span> on their app' },
    { tags: 'News & media · App · Website', title: 'How we helped Firstpost <span class="hi">2x their traffic</span> through a strategic redesign' },
    { tags: 'SaaS · ESG · Dashboard', title: 'How we helped Breathe ESG <span class="hi">accelerate sales</span>, streamline releases and elevate customer experience' },
    { tags: 'Fitness · Mental health · App', title: 'How we helped Shyft &amp; Mindhouse <span class="hi">grow their business</span> and supercharge product led growth' },
  ];
  const card = document.getElementById('case-card'), q$ = id => document.getElementById(id);
  let first = true, swapT = 0;
  function apply(i, c) {
    document.documentElement.style.setProperty('--ca', c.colour);
    q$('cc-cat').textContent = BAND[i].tags;
    q$('cc-title').innerHTML = BAND[i].title + '<span class="cc-go"><span class="cc-go-roll"><i>\u2192</i><i>\u2192</i></span></span>';
    q$('cc-body').textContent = c.body;
    card.href = c.file; card.setAttribute('aria-label', 'View case study: ' + c.name);
    q$('c-num').textContent = String(i + 1).padStart(2, '0');
  }
  function onCase(i, c) {
    clearTimeout(swapT);
    if (first) { first = false; apply(i, c); requestAnimationFrame(() => card.classList.add('shown')); return; }
    card.classList.add('swap');                                   // the band stays; its words cross-fade
    swapT = setTimeout(() => { apply(i, c); card.classList.remove('swap'); }, 200);
  }
  /* the band is a link: inside the site, open it in the top window */
  card.addEventListener('click', e => { if (window.top !== window) { e.preventDefault(); window.top.location.href = new URL(card.getAttribute('href'), location.href).href; } });
  const s = mountSummitsV2({ layout: 'text', onCase });
  /* the rail names each summit on hover; a summit's mark takes you to it */
  s.railBtns.forEach((b, i) => { b.dataset.label = b.getAttribute('aria-label').replace(/^Show /, ''); });
  s.peakEls.forEach((el, i) => { el.insertAdjacentHTML('beforeend', '<b></b>'); el.addEventListener('click', () => s.goTo(i)); });
  window.tibba = s;

  /* ── the panel: writes into SUMMITS2_CONFIG ─────────────────────────── */
  const el = document.createElement('div');
  el.id = 'tune';
  const R = (id, label, min, max, step, val, unit = '') => `<div class="row"><label>${label}<i id="v-${id}">${val}${unit}</i></label><input type="range" id="s-${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></div>`;
  el.innerHTML = `
    <div id="tune-head"><b>Summits</b><button id="tune-hide" title="Hide (H)">–</button></div>
    <p class="tune-sub">Camera</p>
    ${R('cd', 'Distance', 60, 220, 1, C.camera.dist)}
    ${R('ce', 'Angle', 8, 60, 1, C.camera.elev, '°')}
    ${R('cl', 'Lift between summits', 0, 50, 1, C.camera.lift, '°')}
    ${R('cld', 'Lift distance', 0, 160, 1, C.camera.liftDist)}
    ${R('ch', 'Follow speed', .5, 10, .1, C.focus.chase)}
    <p class="tune-sub">Trails</p>
    ${R('pt', 'Turns round the mountain', 0, 2.5, .05, C.path.turns)}
    ${R('pw', 'Wander', 0, .6, .01, C.path.wander)}
    ${R('pd', 'Draw duration', .5, 8, .1, C.path.duration, 's')}
    ${R('pf', 'Trailhead fade', 0, .6, .01, C.path.fadeIn)}
    ${R('sw', 'Shadow width', 0, 20, .5, C.path.shadow.width, 'px')}
    ${R('so', 'Shadow opacity', 0, 1, .02, C.path.shadow.opacity)}
    <div class="row inline"><label>Trails<i></i></label><button class="tune-btn" id="s-rp">Replay</button></div>
    <p class="tune-sub">Topography (rebuilds on release)</p>
    ${R('tl', 'Contour density', 16, 90, 1, C.terrain.levels)}
    ${R('tw', 'Line thickness', .4, 2.5, .05, C.terrain.width, '×')}
    ${R('tc', 'Landforms round the peaks', 0, 90, 1, C.fill.count)}
    ${R('th', 'Landform height', .2, .95, .01, C.fill.height)}
    ${R('tsp', 'Landform spacing', 8, 40, 1, C.fill.spacing)}
    ${R('tr', 'Ground noise', 0, 30, .5, C.fill.relief)}
    <div class="row inline"><label>Ground<i></i></label><button class="tune-btn" id="s-tg">New ground</button></div>
    ${bakeControls.html}`;
  document.body.appendChild(el);
  const q = id => el.querySelector('#' + id);
  const bind = (id, fn) => q('s-' + id).addEventListener('input', e => { const v = +e.target.value; q('v-' + id).textContent = v + e.target.dataset.unit; fn(v); });
  bind('cd', v => { C.camera.dist = v; }); bind('ce', v => { C.camera.elev = v; }); bind('cl', v => { C.camera.lift = v; });
  bind('cld', v => { C.camera.liftDist = v; }); bind('ch', v => { C.focus.chase = v; });
  bind('pt', v => { C.path.turns = v; s.rebuild(); }); bind('pw', v => { C.path.wander = v; s.rebuild(); });
  bind('pd', v => { C.path.duration = v; }); bind('pf', v => { C.path.fadeIn = v; });
  bind('sw', v => { C.path.shadow.width = v; }); bind('so', v => { C.path.shadow.opacity = v; });
  q('s-rp').addEventListener('click', () => s.replay());
  /* the ground rebuilds once the slider is let go — it is a full re-survey */
  const terr = (id, key) => q('s-' + id).addEventListener('change', e => s.setTerrain({ [key]: +e.target.value }));
  ['tl', 'tw', 'tc', 'th', 'tsp', 'tr'].forEach(id => q('s-' + id).addEventListener('input', e => { q('v-' + id).textContent = e.target.value + e.target.dataset.unit; }));
  terr('tl', 'levels'); terr('tw', 'width'); terr('tc', 'count'); terr('th', 'height'); terr('tsp', 'spacing'); terr('tr', 'relief');
  q('s-tg').addEventListener('click', () => s.setTerrain({ seed: Math.floor(Math.random() * 999) }));
  bakeControls.bind(el, BAKE_KEY, C, 'SUMMITS2_CONFIG');
  q('tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
  if (window.wb && window.wb.adopt) window.wb.adopt();
</script>
</body>
</html>
