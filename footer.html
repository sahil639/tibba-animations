<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tibba Design Studio — Footer</title>

<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/workbench.css">
<script src="assets/manifest.js"></script>
<script src="notes.js"></script>
<script src="assets/workbench.js" defer></script>
<script src="assets/odometer.js" defer></script>
<script src="assets/services.js" defer></script>
<script src="assets/footer-range.js" defer></script>
<script src="assets/site-chrome.js" defer></script>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   The footer, on its own
   ─────────────────────────────────────────────────────────────────────────
   The same footer every page carries, from assets/site-chrome.js — not a
   copy of it. A copy is a second thing to keep in step, and the whole reason
   the chrome is a script is that there should only ever be one.

   What this page adds is somewhere to look at it. The footer is the last
   screen of a long dark scroll and it inverts to white when it arrives; seen
   on its own at the top of a blank page that reversal is invisible, so there
   is a short run of the dark ground above it to arrive out of. Drag the
   pointer across the ridge — the pixel ripple is the thing this page is for.
   ═════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink-warm);
  font-family: 'F37 Analog', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* the run-up: enough dark to make the inversion read */
#approach {
  min-height: 62vh;
  display: flex; align-items: flex-end;
  padding-bottom: clamp(40px, 7vh, 90px);
}
#approach .eyebrow { color: var(--ink-faint); }
#approach h1 {
  margin-top: 14px;
  font-size: clamp(22px, 2.6vw, 38px); font-weight: 400;
  line-height: 1.2; letter-spacing: -.02em; color: var(--ink); max-width: 26ch;
}
#approach p { margin-top: 16px; max-width: 54ch; color: var(--ink-mute); font-size: 14px; }
</style>

<!-- the shared control-panel design; last in the head so it wins over
     whatever styling this page declared for its own panel -->
<link rel="stylesheet" href="assets/tune.css">
</head>

<body data-page="footer">

<main id="approach">
  <div class="wrap">
    <p class="eyebrow" data-odo>[ &nbsp;FOOTER&nbsp; ]</p>
    <h1 data-odo data-odo-delay="0.08">The last screen</h1>
    <p>The shared footer, rendered here on its own so it can be worked on without
       scrolling a whole page to reach it. The skyline is generated — reload for a
       different one — and it pixelates in a ring under the pointer.</p>
  </div>
</main>

<footer data-site-footer></footer>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   The footer's own controls — preview only, adopted by the dock
   ─────────────────────────────────────────────────────────────────────────
   The skyline is the thing being worked on here and the form sits right on
   top of it, so the first control is the one that gets the form out of the
   way. Everything else on this page is the shared footer and is not this
   page's to change.
   ═════════════════════════════════════════════════════════════════════════ */
addEventListener('DOMContentLoaded', function () {
  var el = document.createElement('div');
  el.id = 'tune';
  el.innerHTML =
    '<div id="tune-head"><b>Footer</b><button id="tune-hide" title="Hide (H)">–</button></div>' +
    '<p class="tune-sub">Contents</p>' +
    '<div class="row inline"><label>Request form<i></i></label>' +
      '<input type="checkbox" id="s-form" checked></div>' +
    '<div class="row inline"><label>Email line<i></i></label>' +
      '<input type="checkbox" id="s-mail" checked></div>' +
    '<div class="row inline"><label>Wordmark &amp; links<i></i></label>' +
      '<input type="checkbox" id="s-base" checked></div>' +
    '<p class="tune-sub">Backdrop</p>' +
    '<div class="seg" id="s-back">' +
      '<button data-b="peak" class="on">Massif</button>' +
      '<button data-b="sky">Skyline</button>' +
    '</div>' +
    '<div class="row"><label>Height<i id="v-h">100</i></label>' +
      '<input type="range" id="s-h" min="40" max="320" value="100"></div>' +
    '<div class="row inline"><label>Redraw<i></i></label>' +
      '<button id="s-new" class="tune-btn">New ridge</button></div>' +
    '<p class="tune-sub">Scan reveal</p>' +
    '<div class="row inline"><label>Play it again<i></i></label>' +
      '<button id="s-replay" class="tune-btn">Replay</button></div>' +
    /* These three are fractions of how far the wave travels, not pixels, so
       they mean the same thing whatever size the strip is. Shown per mille
       because the useful range is a few percent. */
    '<div class="row"><label>Solid lag<i id="v-lag">115</i></label>' +
      '<input type="range" id="s-lag" min="0" max="320" value="115"></div>' +
    '<div class="row"><label>Rim width<i id="v-rim">30</i></label>' +
      '<input type="range" id="s-rim" min="5" max="120" value="30"></div>' +
    '<div class="row"><label>Wire trail<i id="v-tr">209</i></label>' +
      '<input type="range" id="s-tr" min="30" max="600" value="209"></div>' +
    '<p class="tune-sub">Massif</p>' +
    '<div class="row"><label>Snow line<i id="v-snow">0.60</i></label>' +
      '<input type="range" id="s-snow" min="20" max="95" value="60"></div>' +
    '<div class="row inline"><label>New mountain<i></i></label>' +
      '<button id="s-peaknew" class="tune-btn">Reshape</button></div>';
  document.body.appendChild(el);

  var q = function (id) { return el.querySelector('#' + id); };
  /* Hidden with visibility rather than display, so the layout does not
     collapse under the skyline as things are switched off — the form is what
     holds the footer's height, and losing it would move the ridge as well as
     reveal it. */
  var bindHide = function (id, sel) {
    q(id).addEventListener('change', function (e) {
      document.querySelectorAll(sel).forEach(function (n) {
        n.style.visibility = e.target.checked ? '' : 'hidden';
      });
    });
  };
  bindHide('s-form', '.footer-form');
  bindHide('s-mail', '.footer-mail');
  bindHide('s-base', '.footer-base');

  var canvas = document.getElementById('footer-range');
  q('s-h').addEventListener('input', function (e) {
    q('v-h').textContent = e.target.value;
    canvas.style.height = e.target.value + 'px';
  });
  q('s-new').addEventListener('click', function () {
    /* the ridge is generated per mount, so a fresh one is a fresh mount */
    if (window.mountFooterRange) window.mountFooterRange(canvas).regenerate();
  });

  /* ── the massif ───────────────────────────────────────────────────────
     The 3D peak is this page's backdrop; the generated skyline is kept on a
     switch beside it rather than deleted, because it is still what the rest
     of the site's footer draws. */
  var peakCanvas = document.getElementById('footer-peak');
  var peak = window.tibbaFooterPeak || null;
  q('s-back').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var wantPeak = b.dataset.b === 'peak';
    el.querySelectorAll('#s-back button').forEach(function (n) { n.classList.toggle('on', n === b); });
    peakCanvas.style.display = wantPeak ? '' : 'none';
    canvas.style.display = wantPeak ? 'none' : '';
  });

  var bindPeak = function (id, vid, map, fmt, apply) {
    q(id).addEventListener('input', function (e) {
      var x = map(+e.target.value);
      if (vid) q(vid).textContent = fmt(x);
      if (window.tibbaFooterPeak) apply(x, window.tibbaFooterPeak);
    });
  };
  var per = function (n) { return n / 1000; };
  var asPerMille = function (x) { return String(Math.round(x * 1000)); };
  bindPeak('s-lag',  'v-lag',  per, asPerMille,
    function (x, pk) { pk.P.solidLag = x; pk.sync(); });
  bindPeak('s-rim',  'v-rim',  per, asPerMille,
    function (x, pk) { pk.P.rimWidth = x; pk.sync(); });
  bindPeak('s-tr',   'v-tr',   per, asPerMille,
    function (x, pk) { pk.P.wireTrail = x; pk.sync(); });
  bindPeak('s-snow', 'v-snow', function (n) { return n / 100; },
    function (x) { return x.toFixed(2); },
    function (x, pk) { pk.P.snowLine = x; pk.sync(); });

  q('s-replay').addEventListener('click', function () {
    if (window.tibbaFooterPeak) window.tibbaFooterPeak.replay();
  });
  q('s-peaknew').addEventListener('click', function () {
    if (window.tibbaFooterPeak) { window.tibbaFooterPeak.regenerate(); window.tibbaFooterPeak.replay(); }
  });

  q('tune-hide').addEventListener('click', function () { el.classList.toggle('hidden'); });
  if (window.wb && window.wb.adopt) window.wb.adopt();
});
</script>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
  /* The massif goes where the generated skyline goes — the strip across the
     top of the footer, with the request form sitting on it. The skyline is
     left in the DOM behind a switch in the panel rather than removed: it is
     still what every other page's footer draws. */
  import { mountFooterPeak } from './assets/footer-peak-scan.js';

  function boot() {
    const sky = document.querySelector('#footer-range');
    if (!sky) return requestAnimationFrame(boot);   // the footer is injected

    const peak = document.createElement('canvas');
    peak.id = 'footer-peak';
    peak.className = 'footer-range';
    peak.setAttribute('aria-hidden', 'true');
    sky.after(peak);
    sky.style.display = 'none';

    window.tibbaFooterPeak = mountFooterPeak(peak);
  }
  boot();
</script>

</body>
</html>
