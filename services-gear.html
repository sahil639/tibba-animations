<style>
/* ══════════════════════════════════════════════════════════════════════════
   Our services — climbing gear tiers (Services v2)
   ─────────────────────────────────────────────────────────────────────────
   The compass gives way to kit. Each stage of company is a tier of gear,
   laid out flat on a mat the way climbers lay out a rack before a climb
   (knolling): the more ambitious the climb, the more there is on the mat.

     01 Base kit        early-stage   shoes, chalk bag, a daypack, water
     02 Expedition kit  mid-size      + harness, rope, lockers, belay
                                      device; the daypack becomes a pack
     03 Summit kit      established   + helmet, ice axe, quickdraws, a cam
                                      and a headlamp; the pack, an
                                      expedition pack

   Moving up a tier, the gear already on the mat slides over to make room
   and the new pieces drop in one after another; the pack swaps for the
   bigger one. Moving down, the extra gear lifts off. Flat 2D drawings in
   the site's hairline and orange, nothing more.

   To the right, the stage said as a statement and its services in two
   plain, left-aligned columns — research & strategy, design & delivery —
   each service a name and the line that says what it delivers.

   Every value: GEAR_CONFIG in the script, on the panel, and bakeable.
   ═════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --line: rgba(233,236,242,.12); --line-2: rgba(233,236,242,.22); --acc: #FF4B1F; }
body { background: #000; color: var(--ink-warm); font-family: 'F37 Analog', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.gs { max-width: 1520px; margin: 0 auto; padding: clamp(84px, 12vh, 130px) var(--gut) clamp(56px, 9vh, 100px); }

/* the heading */
.gs-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: clamp(16px, 2.4vh, 28px); border-bottom: 1px solid var(--line); }
.gs-title .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--acc); }
.gs-title h1 { margin-top: 12px; color: #fff; font-weight: 400; font-size: clamp(30px, 3.3vw, 56px); line-height: 1; letter-spacing: -.035em; }
.gs-title > p { max-width: 34ch; font-size: 12.5px; line-height: 1.6; color: var(--ink-mute); text-align: right; }
.gs-title > p b { color: #fff; font-weight: 400; }

.gs-body { margin-top: clamp(24px, 4vh, 44px); display: grid; grid-template-columns: minmax(0, .74fr) minmax(0, 1.26fr); gap: clamp(28px, 4vw, 72px); align-items: start; }

/* ── the tiers ─────────────────────────────────────────────────────────── */
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); }
.tier { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 13px 16px 14px; background: none; border: 0; border-right: 1px solid var(--line);
  cursor: pointer; text-align: left; color: rgba(233,236,242,.62); transition: color .2s linear, background .2s linear; min-width: 0; }
.tier:last-child { border-right: 0; }
.tier .n { display: inline-flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .16em; color: var(--ink-faint); }
.tier .l { font-size: clamp(13px, .95vw, 15px); color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tier .s { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.tier::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--acc); transform: scaleX(0); transform-origin: left; transition: transform .45s cubic-bezier(.65,0,.35,1); }
.tier:hover { color: #fff; }
.tier[aria-selected="true"] { color: #fff; background: rgba(255,255,255,.035); }
.tier[aria-selected="true"] .n { color: var(--acc); }
.tier[aria-selected="true"] .n::before { content: ''; width: 6px; height: 6px; background: var(--acc); }
.tier[aria-selected="true"]::after { transform: scaleX(1); }
.tier:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; }

/* ── the mat ───────────────────────────────────────────────────────────── */
.mat { position: relative; margin-top: 14px; border: 1px solid var(--line); background:
  linear-gradient(rgba(233,236,242,.035) 1px, transparent 1px) 0 0 / 24px 24px,
  linear-gradient(90deg, rgba(233,236,242,.035) 1px, transparent 1px) 0 0 / 24px 24px,
  radial-gradient(80% 70% at 50% 45%, rgba(255,75,31,.05), rgba(255,75,31,0) 70%), #050506; }
.mat::before, .mat::after { content: ''; position: absolute; width: 10px; height: 10px; pointer-events: none; z-index: 3; }
.mat::before { left: -1px; top: -1px; border-left: 1px solid var(--acc); border-top: 1px solid var(--acc); }
.mat::after { right: -1px; bottom: -1px; border-right: 1px solid var(--acc); border-bottom: 1px solid var(--acc); }
.mat-bar { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); }
.mat-bar b { color: #fff; font-weight: 400; }
.mat-bar .acc { color: var(--acc); }
.mat-bar.foot { border-bottom: 0; border-top: 1px solid var(--line); }
.board { position: relative; aspect-ratio: 1 / 1.06; overflow: hidden; }

/* a piece of gear: placed by its tier's slot, gliding between them */
.gear { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: var(--h); display: grid; place-items: center;
  transform: rotate(var(--rot, 0deg));
  transition: left var(--move) cubic-bezier(.65,0,.35,1), top var(--move) cubic-bezier(.65,0,.35,1), width var(--move) cubic-bezier(.65,0,.35,1), height var(--move) cubic-bezier(.65,0,.35,1), transform var(--move) cubic-bezier(.65,0,.35,1); }
.gear .art { position: relative; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.34,1.5,.64,1), opacity .35s linear; }
.gear svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gear.off .art { opacity: 0; transform: translateY(26px) scale(.7) rotate(-10deg); transition: transform .35s cubic-bezier(.55,0,1,.45), opacity .25s linear; }
.gear.on .art { transition-delay: var(--d, 0s); }
.gear .tag { position: absolute; left: 50%; bottom: -4px; transform: translate(-50%, 100%) rotate(calc(-1 * var(--rot, 0deg))); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap; opacity: 0; transition: opacity .25s linear; pointer-events: none; }
.board:hover .gear.on .tag { opacity: 1; }
.gear.new .art::after { content: ''; position: absolute; left: 50%; top: 50%; width: 70%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%) scale(.3); border: 1px solid var(--acc); opacity: 0;
  animation: ping .9s var(--d, 0s) cubic-bezier(.16,.62,.36,1) both; pointer-events: none; }
@keyframes ping { 0% { opacity: .8; transform: translate(-50%, -50%) scale(.3); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); } }
/* the pack: one slot, three packs, swapped */
.gear.pack .art svg { transition: opacity .35s linear, transform .55s cubic-bezier(.34,1.5,.64,1); }
.gear.pack .art svg:not(.cur) { opacity: 0; transform: scale(.8) translateY(10px); }

/* the drawings */
.ink { fill: none; stroke: rgba(233,236,242,.88); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.ink.thin { stroke-width: 1; stroke: rgba(233,236,242,.5); }
.fill { fill: #19191c; }
.fill2 { fill: #26262b; }
.acc-f { fill: #FF4B1F; }
.acc-s { fill: none; stroke: #FF4B1F; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.pale-f { fill: #e9ecf2; }

/* ── the stage and its services ─────────────────────────────────────────── */
.state .k { display: flex; align-items: center; gap: 12px; font-size: clamp(13px, .95vw, 15px); letter-spacing: .16em; text-transform: uppercase; color: #fff; }
.state .k::before { content: ''; width: 9px; height: 9px; background: var(--acc); }
.state .k b { color: var(--acc); font-weight: 400; }
.state .k i { flex: 0 0 40px; height: 1px; background: var(--line-2); }
.state .blurb { margin-top: 14px; max-width: 30ch; color: #fff; font-size: clamp(20px, 1.9vw, 32px); line-height: 1.22; letter-spacing: -.02em; min-height: 2.5em; }
.lists { margin-top: clamp(24px, 4vh, 40px); display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 2.6vw, 44px); }
.list h3 { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line-2); font-weight: 400; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-mute); }
.list h3 span { display: inline-flex; align-items: center; gap: 10px; } .list h3 span::before { content: ''; width: 6px; height: 6px; background: var(--acc); }
.list h3 b { font-weight: 400; color: var(--acc); letter-spacing: .12em; }
.list ol { list-style: none; }
.sv { position: relative; display: grid; grid-template-columns: clamp(48px, 4.2vw, 64px) 1fr; column-gap: 12px; align-items: start; padding: 18px 0 20px; border-bottom: 1px solid var(--line); }
.sv .ix { grid-row: 1 / span 2; font-size: clamp(22px, 1.9vw, 30px); font-weight: 300; line-height: .9; letter-spacing: -.02em; color: rgba(233,236,242,.42);
  font-variant-numeric: tabular-nums; transition: color .25s linear; }
.sv .nm { color: #fff; font-size: clamp(16px, 1.15vw, 19px); line-height: 1.2; letter-spacing: -.01em; padding-top: 2px; }
.sv .ds { grid-column: 2; margin-top: 7px; font-size: 13px; line-height: 1.5; color: var(--ink-mute); max-width: 44ch; }
.sv::before { content: ''; position: absolute; left: 0; bottom: -1px; height: 1px; width: 100%; background: var(--acc); transform: scaleX(0); transform-origin: left; transition: transform .4s cubic-bezier(.22,.9,.3,1); }
.sv:hover::before { transform: scaleX(1); }
.sv:hover .ix { color: var(--acc); }
.lists.swap .sv { animation: svc-in .5s calc(var(--k) * 40ms) cubic-bezier(.22,1,.36,1) both; }
@keyframes svc-in { from { opacity: 0; transform: translateY(8px); } }

@media (max-width: 1100px) {
  .gs-body { grid-template-columns: 1fr; }
  .mat { max-width: 720px; }
}
@media (max-width: 640px) {
  .gs { padding: 64px 16px 40px; }
  .gs-title > p { display: none; } .gs-title h1 { font-size: 28px; }
  .tier { padding: 10px 8px; align-items: center; text-align: center; } .tier .s { display: none; } .tier .l { font-size: 13px; white-space: normal; }
  .lists { grid-template-columns: 1fr; }
  .board { aspect-ratio: 1 / 1; }
}
@media (prefers-reduced-motion: reduce) { .gear, .gear .art, .gear.pack .art svg { transition: none !important; } .gear.new .art::after { animation: none; } }
</style>

<body>
<main class="gs">
  <header class="gs-title">
    <div><p class="eyebrow">[ &nbsp;Our services&nbsp; ]</p><h1>Gear up for your climb</h1></div>
    <p>Every climb takes its own kit. <b>Pick your stage</b> and see what we bring to the mountain.</p>
  </header>
  <div class="gs-body">
    <section aria-label="The kit">
      <div class="tiers" role="tablist" aria-label="Company stage" id="tiers"></div>
      <div class="mat">
        <p class="mat-bar"><span>Kit <b id="m-n">01</b> · <span class="acc" id="m-name">Base kit</span></span><span>Items <b id="m-c">04</b></span></p>
        <div class="board" id="board" aria-hidden="true"></div>
        <p class="mat-bar foot"><span>Pack weight <b id="m-w">3.4</b> kg</span><span id="m-for">For early-stage startups</span></p>
      </div>
    </section>
    <section class="state" aria-live="polite">
      <p class="k"><b id="st-n">01</b><i></i><span id="st-l">Early-stage startup</span></p>
      <p class="blurb" id="blurb"></p>
      <div class="lists" id="lists"></div>
    </section>
  </div>
</main>

<script type="module">
  import { applyBaked, bakeControls } from './assets/bake.js';
  /* GEAR_CONFIG — the tiers, and how the kit moves between them */
  const GEAR_CONFIG = {
    move: 0.7,            // s, gear gliding to its new place
    stagger: 0.09,        // s between new pieces dropping in
    tiers: [
      { name: 'Base kit',       stage: 'Early-stage',  for: 'For early-stage startups', weight: 3.4 },
      { name: 'Expedition kit', stage: 'Mid-size',     for: 'For mid-size companies',   weight: 11.8 },
      { name: 'Summit kit',     stage: 'Established',  for: 'For established companies', weight: 19.6 },
    ],
  };
  const C = GEAR_CONFIG, KEY = 'tibba.bake.services-gear';
  applyBaked(KEY, C);
  const S = window.TIBBA_SERVICES;
  const STAGE_LABEL = ['Early-stage startup', 'Mid-size company', 'Established company'];

  /* ── the drawings: flat, hairline and orange, each in a 100 × 100 box ── */
  const svg = (inner, vb = '0 0 100 100') => `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
  const ART = {
    /* a pair of climbing shoes: downturned toe, rubber rand, two velcro straps */
    shoes: svg(`${[0, 1].map(k => `<g transform="translate(${k * 9} ${k * 22})">
        <path class="fill" d="M6 46 Q6 30 20 26 Q30 23 38 25 L56 30 Q66 33 76 38 Q90 45 92 52 Q93 57 88 58 L14 58 Q6 57 6 46 Z"/>
        <path class="ink" d="M6 46 Q6 30 20 26 Q30 23 38 25 L56 30 Q66 33 76 38 Q90 45 92 52 Q93 57 88 58 L14 58 Q6 57 6 46 Z"/>
        <path class="fill2" d="M6 50 Q8 56 14 58 L88 58 Q93 57 92 52 Q84 54 70 52 L30 52 Q14 52 6 50 Z"/>
        <path class="ink thin" d="M6 50 Q14 52 30 52 L70 52 Q84 54 92 52"/>
        <path class="ink thin" d="M62 31 Q72 34 80 40 Q86 44 88 48"/>
        <path class="acc-s" d="M30 25 L36 44 M42 26 L48 45" stroke-width="3"/>
        <rect class="pale-f" x="10" y="27" width="6" height="9" rx="2" opacity=".8"/></g>`).join('')}`),
    /* chalk bag: fleece rim, drawcord and toggle, brush in its loop */
    chalk: svg(`<path class="fill" d="M24 30 L76 30 L78 82 Q78 92 50 92 Q22 92 22 82 Z"/><path class="ink" d="M24 30 L76 30 L78 82 Q78 92 50 92 Q22 92 22 82 Z"/>
        <ellipse class="fill2" cx="50" cy="30" rx="27" ry="7"/><ellipse class="ink" cx="50" cy="30" rx="27" ry="7"/>

        <path class="acc-s" d="M60 34 Q66 46 62 54"/><rect class="acc-f" x="58" y="53" width="7" height="9" rx="2"/>
        <path class="ink thin" d="M23 48 h55 M23 52 h55"/>
        <rect class="fill2" x="12" y="44" width="10" height="14" rx="2"/><path class="ink thin" d="M12 44 h10 v14 h-10z"/>
        <path class="ink" d="M16 44 L14 16"/><path class="pale-f" d="M10 6 h8 l-1 10 h-6 z" opacity=".85"/>`),
    /* water: a lidded bottle, its loop, volume marks */
    bottle: svg(`<path class="ink" d="M44 6 q6 -6 12 0" stroke-width="2"/><rect class="acc-f" x="36" y="8" width="28" height="12" rx="3"/>
        <path class="fill" d="M34 20 h32 v4 q8 4 8 12 v52 q0 8 -8 8 h-32 q-8 0 -8 -8 v-52 q0 -8 8 -12 z"/>
        <path class="ink" d="M34 20 h32 v4 q8 4 8 12 v52 q0 8 -8 8 h-32 q-8 0 -8 -8 v-52 q0 -8 8 -12 z"/>
        <path class="ink thin" d="M28 44 h10 M28 56 h6 M28 68 h10 M28 80 h6"/><path d="M60 40 v44" stroke="#fff" stroke-opacity=".12" stroke-width="5" stroke-linecap="round"/>`),
    /* harness: waist belt and buckle, gear loops, leg loops, the orange belay loop */

        <rect class="fill" x="44" y="18" width="12" height="12" rx="2"/><path class="ink" d="M44 18 h12 v12 h-12z M47 22 h6"/>
        ${[22, 34, 66, 78].map(x => `<path class="ink thin" d="M${x} ${x < 50 ? 37 - (x - 22) * .3 : 30 + (x - 66) * .5} q2 8 6 0"/>`).join('')}
        <path class="fill2" d="M18 44 Q8 66 24 80 Q38 90 46 70 Q36 62 34 46 Z"/><path class="ink" d="M18 44 Q8 66 24 80 Q38 90 46 70 Q36 62 34 46 Z"/>
        <path class="fill2" d="M82 44 Q92 66 76 80 Q62 90 54 70 Q64 62 66 46 Z"/><path class="ink" d="M82 44 Q92 66 76 80 Q62 90 54 70 Q64 62 66 46 Z"/>
        <path class="ink thin" d="M22 50 Q16 66 26 76 M78 50 Q84 66 74 76"/>
        <path d="M43 34 Q38 58 50 66 Q62 58 57 34" fill="none" stroke="#FF4B1F" stroke-width="4" stroke-linecap="round"/>`),
    /* rope: a coil, its sheath flecked, tied round its middle, two tails */
    rope: svg(`${Array.from({ length: 9 }, (_, k) => `<ellipse cx="${48 + k * .5}" cy="${50 + k * .35}" rx="${42 - k * 2.2}" ry="${30 - k * 1.6}" fill="none"
          stroke="#FF4B1F" stroke-width="2.4" stroke-opacity="${(1 - k * .06).toFixed(2)}" transform="rotate(${-8 + k * 1.6} 50 50)"/>`).join('')}
        <ellipse cx="48" cy="50" rx="42" ry="30" fill="none" stroke="#fff" stroke-opacity=".5" stroke-dasharray="1 6" transform="rotate(-8 50 50)"/>
        <path class="fill" d="M44 16 h12 l2 68 h-16 z"/><path class="ink" d="M44 16 h12 l2 68 h-16 z M44 30 h13 M43 44 h14 M43 58 h15 M42 72 h15"/>

    /* carabiners: a locker with its screwgate, and a wiregate */
    carabiners: svg(`<g transform="rotate(-10 30 50)"><path class="ink" d="M16 22 Q16 10 28 10 L34 10 Q46 10 46 24 L44 76 Q43 90 30 90 Q18 90 18 78 Z" stroke-width="3"/>
        <rect class="acc-f" x="15" y="44" width="7" height="18" rx="2"/><path d="M15 48 h7 M15 52 h7 M15 56 h7" stroke="#000" stroke-opacity=".4"/></g>
        <g transform="rotate(14 70 50)"><path class="ink" d="M58 20 Q58 10 68 10 L74 10 Q86 10 86 22 L84 78 Q83 90 72 90 Q60 90 60 80" stroke-width="3"/>
        <path d="M60 80 L60 30 Q62 26 66 30 L64 76" fill="none" stroke="#e9ecf2" stroke-opacity=".75" stroke-width="1.2"/></g>`),
    /* belay device: the tube, its keeper cable, clipped to a locker */
    belay: svg(`<path class="fill2" d="M26 14 L74 14 L80 56 Q80 62 74 62 L26 62 Q20 62 20 56 Z"/><path class="ink" d="M26 14 L74 14 L80 56 Q80 62 74 62 L26 62 Q20 62 20 56 Z"/>
        <rect class="fill" x="32" y="24" width="12" height="28" rx="6"/><rect class="fill" x="56" y="24" width="12" height="28" rx="6"/><path class="ink thin" d="M32 24 h12 v28 h-12z M56 24 h12 v28 h-12z"/>
        <path class="ink thin" d="M32 18 h36"/><path d="M50 62 q-10 10 -4 18" fill="none" stroke="#e9ecf2" stroke-opacity=".7" stroke-width="1.6"/>
        <path class="ink" d="M40 74 Q40 68 46 68 L54 68 Q62 68 62 76 L60 92 Q59 98 52 98 Q42 98 42 90 Z" stroke-width="2.4"/><rect class="acc-f" x="40" y="80" width="5" height="10" rx="1.5"/>`),
    /* helmet: shell, vents, headlamp clips, the chinstrap */
    helmet: svg(`<path class="acc-f" d="M10 62 Q10 18 50 16 Q90 18 90 62 Z"/><path class="ink" d="M10 62 Q10 18 50 16 Q90 18 90 62 Z"/>
        ${[[30, 30], [50, 24], [70, 30], [40, 42], [60, 42]].map(([x, y]) => `<rect x="${x - 5}" y="${y - 2.5}" width="10" height="5" rx="2.5" fill="#000" fill-opacity=".55"/>`).join('')}
        <path d="M18 50 q10 -26 34 -30" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
        <rect class="fill" x="6" y="60" width="88" height="8" rx="3"/><path class="ink" d="M6 60 h88 v8 h-88z"/>
        <rect class="pale-f" x="12" y="54" width="7" height="6" rx="1"/><rect class="pale-f" x="81" y="54" width="7" height="6" rx="1"/>
        <path class="ink thin" d="M24 68 q4 20 26 22 q22 -2 26 -22"/><rect class="fill2" x="44" y="86" width="12" height="7" rx="2"/><path class="ink thin" d="M44 86 h12 v7 h-12z"/>`),
    /* ice axe: pick with teeth, adze, shaft, spike and leash */
    axe: svg(`<path class="fill2" d="M46 16 h8 l-1 76 h-6 z"/><path class="ink" d="M46 16 h8 l-1 76 h-6 z"/><path class="acc-f" d="M46.6 66 h6.8 l-.4 26 h-6 z"/>
        <path class="ink" d="M47 92 L50 99 L53 92"/>
        <path class="fill" d="M8 26 Q24 14 46 13 L54 13 L54 22 L46 22 Q30 22 12 32 Z"/><path class="ink" d="M8 26 Q24 14 46 13 L54 13 L54 22 L46 22 Q30 22 12 32 Z"/>
        <path class="ink thin" d="M14 28 l2 3 M19 25 l2 3 M24 23 l2 3 M29 21 l2 3"/>
        <path class="fill" d="M54 13 L82 11 Q90 11 90 18 L90 22 L54 22 Z"/><path class="ink" d="M54 13 L82 11 Q90 11 90 18 L90 22 L54 22 Z"/>
        <path d="M53 40 q22 8 18 30 q-2 10 -14 8" fill="none" stroke="#FF4B1F" stroke-width="2" stroke-linecap="round"/>`),
    /* quickdraws: two biners joined by an orange dogbone, rubber keeper */
    quickdraws: svg(`${[0, 1].map(k => `<g transform="translate(${k * 40} ${k * 6}) rotate(${k ? 8 : -6} 24 50)">
        <path class="ink" d="M14 14 q0 -6 7 -6 h6 q7 0 7 7 l-1 20 q-1 7 -8 7 h-3 q-8 0 -8 -8 z" stroke-width="2.2"/>
        <rect class="acc-f" x="17" y="40" width="12" height="30" rx="4"/><path d="M17 48 h12 M17 62 h12" stroke="#000" stroke-opacity=".35"/>
        <rect class="pale-f" x="16" y="66" width="14" height="6" rx="2" opacity=".8"/>
        <path class="ink" d="M14 74 q0 -6 7 -6 h6 q7 0 7 7 l-1 16 q-1 7 -8 7 h-3 q-8 0 -8 -8 z" stroke-width="2.2"/>
        <path class="ink thin" d="M33 76 L30 92"/></g>`).join('')}`),
    /* headlamp: band, housing, lens and its throw of light */
    headlamp: svg(`<path d="M50 60 L14 98 L86 98 Z" fill="#fff6dd" opacity=".07"/>
        <ellipse cx="50" cy="44" rx="44" ry="18" fill="none" stroke="#FF4B1F" stroke-width="5"/>
        <ellipse cx="50" cy="44" rx="44" ry="18" fill="none" stroke="#000" stroke-opacity=".35" stroke-dasharray="2 4" stroke-width="1"/>
        <rect class="fill2" x="34" y="44" width="32" height="22" rx="5"/><path class="ink" d="M34 44 h32 v22 h-32z"/>
        <circle class="fill" cx="50" cy="55" r="8"/><circle class="ink" cx="50" cy="55" r="8"/><circle class="pale-f" cx="50" cy="55" r="4.5"/>
        <rect class="acc-f" x="60" y="40" width="5" height="4" rx="1"/>`),
    /* cam: trigger, stem, four lobes on their axle */
    cam: svg(`<path class="ink" d="M50 8 L50 56" stroke-width="2.4"/><path class="ink" d="M36 18 h28" stroke-width="2.4"/>
        <path class="ink thin" d="M38 18 q12 8 24 0"/><path class="ink" d="M44 6 q6 -6 12 0 v6 h-12 z"/>
        ${[[-1, 1], [1, 1]].map(([s]) => `<path class="acc-f" d="M50 62 q${s * 26} -10 ${s * 30} 6 q${s * -2} 16 ${s * -22} 20 z"/><path class="ink" d="M50 62 q${s * 26} -10 ${s * 30} 6 q${s * -2} 16 ${s * -22} 20 z"/>`).join('')}
        <path class="fill2" d="M50 62 q-14 4 -14 18 q8 10 14 8 q6 2 14 -8 q0 -14 -14 -18 z"/><path class="ink thin" d="M50 62 q-14 4 -14 18 q8 10 14 8 q6 2 14 -8 q0 -14 -14 -18"/>
        <circle class="pale-f" cx="50" cy="66" r="3.5"/><path class="ink thin" d="M50 88 v8 q0 3 4 3"/>`),
    /* the packs: a daypack, a 45 L pack with its lid, a 70 L expedition pack */
    daypack: svg(`<path class="fill" d="M26 26 Q26 14 40 14 h20 Q74 14 74 26 L76 86 Q76 94 68 94 h-36 Q24 94 24 86 Z"/><path class="ink" d="M26 26 Q26 14 40 14 h20 Q74 14 74 26 L76 86 Q76 94 68 94 h-36 Q24 94 24 86 Z"/>
        <path class="ink" d="M42 14 q8 -10 16 0"/><path class="ink thin" d="M28 30 Q50 22 72 30"/>
        <rect class="fill2" x="32" y="56" width="36" height="28" rx="5"/><path class="ink thin" d="M32 56 h36 v28 h-36z"/><path class="acc-s" d="M36 62 h28"/>
        <path class="ink thin" d="M24 46 h-4 v22 h4 M76 46 h4 v22 h-4"/><rect class="acc-f" x="47" y="34" width="6" height="10" rx="1"/>`),
    backpack: svg(`<path class="fill" d="M24 22 Q24 10 38 10 h24 Q76 10 76 22 L80 88 Q80 96 72 96 h-44 Q20 96 20 88 Z"/><path class="ink" d="M24 22 Q24 10 38 10 h24 Q76 10 76 22 L80 88 Q80 96 72 96 h-44 Q20 96 20 88 Z"/>
        <path class="fill2" d="M20 22 Q50 10 80 22 L80 38 Q50 28 20 38 Z"/><path class="ink" d="M20 22 Q50 10 80 22 L80 38 Q50 28 20 38 Z"/>
        <path class="ink" d="M44 6 q6 -6 12 0"/><rect class="pale-f" x="44" y="24" width="12" height="4" rx="1" opacity=".6"/>
        <path class="acc-s" d="M20 54 h60 M21 72 h58"/><rect class="acc-f" x="46" y="51" width="8" height="6" rx="1"/><rect class="acc-f" x="46" y="69" width="8" height="6" rx="1"/>
        <path class="ink thin" d="M32 40 L30 92 M68 40 L70 92"/><path class="ink" d="M50 78 l-4 14 h8 z"/>`),
    exppack: svg(`<path class="fill" d="M24 14 Q24 2 38 2 h24 Q76 2 76 14 L84 90 Q84 99 74 99 h-48 Q16 99 16 90 Z"/><path class="ink" d="M24 14 Q24 2 38 2 h24 Q76 2 76 14 L84 90 Q84 99 74 99 h-48 Q16 99 16 90 Z"/>
        <path class="fill2" d="M20 14 Q50 2 80 14 L80 32 Q50 20 20 32 Z"/><path class="ink" d="M20 14 Q50 2 80 14 L80 32 Q50 20 20 32 Z"/>
        <rect class="acc-f" x="10" y="36" width="80" height="12" rx="6"/><path d="M10 42 h80" stroke="#000" stroke-opacity=".35"/>
        <rect class="fill" x="44" y="34" width="12" height="16" rx="2"/><path class="ink thin" d="M44 34 h12 v16 h-12z"/>
        <path class="acc-s" d="M18 62 h64 M19 78 h62"/><path class="ink thin" d="M30 30 L28 94 M70 30 L72 94"/>
        <rect class="fill2" x="36" y="54" width="28" height="36" rx="4"/><path class="ink thin" d="M36 54 h28 v36 h-28z"/>
        <path class="ink" d="M84 50 L96 30 M88 50 L98 36" stroke-width="1.4"/><rect class="pale-f" x="93" y="26" width="5" height="8" rx="1" transform="rotate(30 95 30)"/>`),
  };
  const LABEL = { shoes: 'Climbing shoes', chalk: 'Chalk bag', bottle: 'Water', harness: 'Harness', rope: 'Rope', carabiners: 'Lockers', belay: 'Belay device',
    helmet: 'Helmet', axe: 'Ice axe', quickdraws: 'Quickdraws', headlamp: 'Headlamp', cam: 'Cam', pack: 'Pack' };
  const PACK = ['daypack', 'backpack', 'exppack'], PACK_NAME = ['Daypack', '45 L pack', '70 L expedition pack'];

  /* where each piece lies on the mat, per tier: [x, y, w, h, turn°] in % of
     the board. Laid out by hand to read as kit thrown down rather than
     ranked: a hero or two per tier (the pack, the rope, the helmet), the
     small hardware tucked into the gaps at its own small size, every piece
     a few degrees off true. A piece missing from a tier is off the mat. */
  const SLOT = {
    pack:       [[8, 8, 40, 56, -6],    [4, 4, 31, 48, -4],    [3, 3, 25, 40, -3]],
    shoes:      [[38, 62, 54, 30, 7],   [5, 62, 42, 24, -6],   [20, 74, 34, 21, -4]],
    chalk:      [[54, 10, 23, 32, 11],  [81, 3, 16, 22, 14],   [34, 31, 14, 19, 10]],
    bottle:     [[80, 30, 13, 28, -14], [48, 72, 10, 22, -18], [82, 78, 9, 18, -14]],
    rope:       [null, [36, 3, 40, 34, -3], [61, 2, 36, 30, 5]],
    harness:    [null, [61, 37, 36, 30, 7], [57, 33, 31, 24, -6]],
    carabiners: [null, [42, 41, 17, 26, 16], [24, 46, 12, 20, 18]],
    belay:      [null, [64, 72, 15, 20, -10], [58, 78, 11, 16, 14]],
    helmet:     [null, null, [31, 3, 28, 25, -8]],
    axe:        [null, null, [3, 45, 17, 46, -16]],
    quickdraws: [null, null, [38, 50, 17, 23, -6]],
    headlamp:   [null, null, [71, 59, 26, 17, -9]],
    cam:        [null, null, [56, 57, 13, 21, 22]],
  };
  const ORDER = Object.keys(SLOT);
  const board = document.getElementById('board');
  board.innerHTML = ORDER.map(id => `<div class="gear off${id === 'pack' ? ' pack' : ''}" data-id="${id}"><div class="art">${
    id === 'pack' ? PACK.map((p, k) => ART[p].replace('<svg ', `<svg data-k="${k}" `)).join('') : ART[id]}</div><span class="tag">${LABEL[id]}</span></div>`).join('');
  const gearEl = Object.fromEntries([...board.children].map(el => [el.dataset.id, el]));
  const setMove = () => board.style.setProperty('--move', C.move + 's');
  setMove();

  /* ── the tiers ───────────────────────────────────────────────────────── */
  const tiersEl = document.getElementById('tiers');
  tiersEl.innerHTML = C.tiers.map((t, i) => `<button class="tier" role="tab" aria-selected="false" data-i="${i}"><span class="n">0${i + 1}</span><span class="l">${t.name}</span><span class="s">${t.stage}</span></button>`).join('');
  const tierBtns = [...tiersEl.children];
  const $ = id => document.getElementById(id);
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const STRATEGY = /research|testing|strategy|marketing|analysis/i;
  let cur = -1;

  function lay(i, first) {
    const up = i > cur;
    let n = 0, count = 0;
    ORDER.forEach(id => {
      const el = gearEl[id], s = SLOT[id][i];
      if (!s) { el.classList.remove('on', 'new'); el.classList.add('off'); return; }
      count++;
      const was = el.classList.contains('on');
      el.style.setProperty('--x', s[0] + '%'); el.style.setProperty('--y', s[1] + '%');
      el.style.setProperty('--w', s[2] + '%'); el.style.setProperty('--h', s[3] + '%'); el.style.setProperty('--rot', (s[4] || 0) + 'deg');
      if (!was) {
        /* new to the mat: placed without gliding, then dropped in, in turn */
        el.style.transition = 'none'; void el.offsetWidth; el.style.transition = '';
        el.style.setProperty('--d', (first ? .15 : C.move * .45) + n++ * C.stagger + 's');
        el.classList.remove('off'); el.classList.add('on', 'new');
        setTimeout(() => el.classList.remove('new'), 1600);
      }
    });
    /* the pack: swapped for this tier's */
    gearEl.pack.querySelectorAll('svg').forEach(sv => sv.classList.toggle('cur', +sv.dataset.k === i));
    gearEl.pack.querySelector('.tag').textContent = PACK_NAME[i];
    count += 0;
    const t = C.tiers[i];
    $('m-n').textContent = pad(i + 1); $('m-name').textContent = t.name; $('m-for').textContent = t.for;
    const cEl = $('m-c'), wEl = $('m-w');
    cEl.textContent = pad(count); wEl.textContent = t.weight.toFixed(1);
    if (window.Odometer && !first) { delete cEl.dataset.odoText; window.Odometer.count(cEl, { duration: .8 }); }
  }

  function services(i) {
    const st = S[i];
    $('st-n').textContent = pad(i + 1); $('st-l').textContent = STAGE_LABEL[i];
    $('blurb').textContent = st.blurb;
    const left = st.services.filter(s => STRATEGY.test(s.name)), right = st.services.filter(s => !STRATEGY.test(s.name));
    let k = 0, n = 0;
    const col = (title, list) => `<div class="list"><h3><span>${title}</span><b>${pad(list.length)}</b></h3><ol>${list.map(s =>
      `<li class="sv" style="--k:${k++}"><span class="ix">${pad(++n)}</span><span class="nm">${s.name}</span><span class="ds">${s.points[2] || s.points[0]}</span></li>`).join('')}</ol></div>`;
    const lists = $('lists');
    lists.innerHTML = col('Research and strategy', left) + col('Design &amp; delivery', right);
    lists.classList.remove('swap'); void lists.offsetWidth; lists.classList.add('swap');
  }

  function pick(i, first) {
    if (i === cur) return;
    tierBtns.forEach((b, k) => { b.setAttribute('aria-selected', String(k === i)); b.tabIndex = k === i ? 0 : -1; });
    lay(i, first); services(i); cur = i;
  }
  tierBtns.forEach((b, i) => b.addEventListener('click', () => pick(i)));
  tiersEl.addEventListener('keydown', e => {
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
    const i = (cur + d + 3) % 3; pick(i); tierBtns[i].focus();
  });
  /* the kit is laid out the first time the mat comes into view */
  services(0);
  tierBtns[0].setAttribute('aria-selected', 'true');
  new IntersectionObserver(([e], io) => { if (!e.isIntersecting) return; io.disconnect(); cur = -1; pick(0, true); }, { threshold: .3 }).observe(board);

  /* ── the panel ───────────────────────────────────────────────────── */
  const el = document.createElement('div'); el.id = 'tune';
  const R = (id, label, min, max, step, val, unit = '') => `<div class="row"><label>${label}<i id="v-${id}">${val}${unit}</i></label><input type="range" id="s-${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></div>`;
  el.innerHTML = `<div id="tune-head"><b>Services — gear tiers</b><button id="tune-hide" title="Hide (H)">–</button></div>
    <p class="tune-sub">Motion</p>${R('mv', 'Glide', .2, 1.6, .05, C.move, 's')}${R('sg', 'Drop-in stagger', 0, .3, .01, C.stagger, 's')}
    <div class="row inline"><label>Kit<i></i></label><button class="tune-btn" id="s-rp">Replay</button></div>
    ${bakeControls.html}`;
  document.body.appendChild(el);
  const q = id => el.querySelector('#' + id);
  const bind = (id, fn) => q('s-' + id).addEventListener('input', e => { const v = +e.target.value; q('v-' + id).textContent = v + e.target.dataset.unit; fn(v); });
  bind('mv', v => { C.move = v; setMove(); }); bind('sg', v => { C.stagger = v; });
  q('s-rp').addEventListener('click', () => { const i = cur; ORDER.forEach(id => { gearEl[id].classList.remove('on'); gearEl[id].classList.add('off'); }); cur = -1; setTimeout(() => pick(i, true), 400); });
  bakeControls.bind(el, KEY, C, 'GEAR_CONFIG');
  q('tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
  if (window.wb && window.wb.adopt) window.wb.adopt();
</script>
</body>
</html>
