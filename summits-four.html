<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our summits — Four Summits</title>
<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/workbench.css">
<script src="assets/manifest.js"></script>
<script src="assets/whats-new.js"></script>
<script src="assets/workbench.js" defer></script>
<!-- ══════════════════════════════════════════════════════════════════════════
     Our summits — Four Summits
     One mountain in focus at a time, centred; scrolling walks the camera
     to the next. Each summit's trail draws once, base to peak, the first
     time it is in focus. The case sits bottom-left (or beside the peak: cards.anchor).
     Behaviour and every default: SUMMITS_CONFIG in assets/four-summits.js.
     The panel on the right writes into that object live; "Bake settings"
     keeps them in this browser so the next refresh opens on them (as the
     Polaroids page does), and copies them to paste back as defaults.
     ═════════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="assets/summits-range.css">
<style>
#scope { height: 520vh; }   /* overwritten from SUMMITS_CONFIG.scroll.height */
/* a quiet vignette on both sides: the centred mountain is the subject */
#stage::after { opacity: 1;
  background: radial-gradient(120% 90% at 50% 55%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%),
              linear-gradient(0deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 26%); }

.fs-head-copy { position: absolute; z-index: 3; left: var(--gut); top: clamp(76px, 11vh, 120px); max-width: 440px; }
.fs-head-copy .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.fs-head-copy h1 { margin-top: 14px; color: #fff; font-weight: 400; font-size: clamp(28px, 3vw, 48px); line-height: 1.02; letter-spacing: -.03em; }
.fs-head-copy .meta { margin-top: 18px; display: flex; gap: 20px; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.fs-head-copy .meta b { color: #fff; font-weight: 400; }

/* ── the card beside the focused summit ─────────────────────────────────
   Placed in script (left/top, off the summit's projection). Timing comes
   from SUMMITS_CONFIG.cards via the --fs-* variables. */
body[data-layout="summits"] #cases { inset: 0; pointer-events: none; }
body[data-layout="summits"] .card {
  --p: 1; right: auto; bottom: auto; left: 0; top: 0; width: var(--fs-card-w, 380px);
  visibility: visible; opacity: 0; pointer-events: none;
  transform: translateX(calc(var(--fs-slide, 28px) * var(--dx, 1)));
  transition: opacity var(--fs-out, .3s) linear, transform var(--fs-out, .3s) var(--fs-ease), border-color .4s, background .4s;
}
body[data-layout="summits"] .card[data-side="left"] { --dx: -1; }
body[data-layout="summits"] .card.active {
  opacity: 1; transform: none; pointer-events: auto;
  transition: opacity var(--fs-in, .7s) var(--fs-ease) var(--fs-delay, .35s), transform var(--fs-in, .7s) var(--fs-ease) var(--fs-delay, .35s), border-color .4s, background .4s;
}
body[data-layout="summits"] .card.leaving { transform: translateX(calc(var(--fs-slide, 28px) * -.5 * var(--dx, 1))); }
.card .nm { display: none; }

/* ── corner: the case as plain type, bottom-left (cards.anchor = 'corner') ─
   Title top-left stays as it is; the lit summit's name, its line and the
   View project link sit in the bottom-left corner, on a soft floor of dark. */
body[data-cards="corner"] #stage::after { opacity: 1; background: linear-gradient(20deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.45) 28%, rgba(0,0,0,0) 52%); }
body[data-cards="corner"][data-layout="summits"] .card {
  left: var(--gut) !important; top: auto !important; right: auto; bottom: clamp(32px, 7vh, 72px);
  width: min(var(--fs-card-w, 380px), calc(100vw - 2 * var(--gut))); padding: 0; border: 0; background: none !important;
  backdrop-filter: none; -webkit-backdrop-filter: none; clip-path: none;
  transform: translateY(var(--fs-slide, 28px));
}
body[data-cards="corner"][data-layout="summits"] .card.active { transform: none; }
body[data-cards="corner"][data-layout="summits"] .card.leaving { transform: translateY(calc(var(--fs-slide, 28px) * -.4)); }
body[data-cards="corner"] .card .k, body[data-cards="corner"] .card .tags,
body[data-cards="corner"] .card .body, body[data-cards="corner"] .card .pin, body[data-cards="corner"] .card .frame { display: none; }
body[data-cards="corner"] .card .nm { display: block; margin: 0; color: #fff; font-weight: 400; font-size: clamp(34px, 4.2vw, 68px); line-height: .98; letter-spacing: -.035em; }
body[data-cards="corner"] .card .nm::before { content: ''; display: block; width: 28px; height: 2px; margin-bottom: 18px; background: var(--c, var(--accent)); }
body[data-cards="corner"] .card .t { margin-top: 12px; max-width: 34ch; color: var(--ink-mute); font-size: clamp(14px, 1.1vw, 17px); line-height: 1.4; }
body[data-cards="corner"] .card .more { grid-template-rows: 1fr; }
body[data-cards="corner"] .card .go { margin-top: 22px; }

/* the orange squares and the walkers */
.fs-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.fs-layer > span { position: absolute; left: 0; top: 0; will-change: transform; }
.fs-peak i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; background: var(--accent);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6); transform: scale(.55); opacity: .6; transition: transform .45s cubic-bezier(.65,0,.35,1), opacity .45s linear; }
.fs-peak.arrived i { transform: scale(1); opacity: 1; }
.fs-peak em { position: absolute; left: 12px; top: -20px; font: 400 9.5px/1 'F37 Analog', system-ui, sans-serif; font-style: normal;
  letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.45); white-space: nowrap; transition: color .4s linear; }
.fs-peak.on em { color: #fff; }
.fs-peak.on i::after { content: ''; position: absolute; inset: -1px; border: 1px solid var(--accent); animation: fs-ping 2.2s cubic-bezier(.16,.62,.36,1) infinite; }
@keyframes fs-ping { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.4); } }
.fs-head::before { content: ''; position: absolute; left: -3.5px; top: -3.5px; width: 7px; height: 7px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 2px var(--c), 0 0 14px 3px var(--c); }

@media (max-width: 820px) {
  body[data-layout="summits"] .card { left: 16px !important; right: 16px; top: auto !important; bottom: 24px; width: auto; transform: translateY(var(--fs-slide, 28px)); }
  body[data-layout="summits"] .card.active { transform: none; }
  .fs-head-copy .meta { display: none; }
}
@media (prefers-reduced-motion: reduce) { .fs-peak.on i::after { animation: none; } }
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>

<body data-layout="summits">
<div id="scope">
  <div id="stage">
    <canvas id="peak-canvas"></canvas>
    <div class="fs-head-copy">
      <p class="eyebrow">[ &nbsp;Our summits&nbsp; ]</p>
      <h1>Four climbs, and what they were for</h1>
      <p class="meta"><span>Summit <b id="fs-count">01&thinsp;/&thinsp;04</b></span><span>Scroll to walk the range</span></p>
    </div>
    <section id="cases" aria-label="Case studies"></section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.min.js"}}</script>
<script type="module">
  import { mountFourSummits, SUMMITS_CONFIG as C, EASES } from './assets/four-summits.js';
  import { applyBaked, bakeControls } from './assets/bake.js';
  /* baked settings (the panel's Bake button) load over the defaults before anything mounts */
  const BAKE_KEY = 'tibba.bake.summits-four';
  applyBaked(BAKE_KEY, C);
  const fs = mountFourSummits();
  window.tibba = fs;

  /* ── the panel: writes straight into SUMMITS_CONFIG ────────────────── */
  const el = document.createElement('div');
  el.id = 'tune';
  const R = (id, label, min, max, step, val, unit = '') => `<div class="row"><label>${label}<i id="v-${id}">${val}${unit}</i></label><input type="range" id="s-${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></div>`;
  const eases = Object.keys(EASES).map(k => `<option>${k}</option>`).join('');
  const camEases = ['power3.inOut', 'power2.inOut', 'sine.inOut', 'expo.inOut', 'power2.out', 'expo.out'].map(k => `<option>${k}</option>`).join('');
  el.innerHTML = `
    <div id="tune-head"><b>Four Summits</b><button id="tune-hide" title="Hide (H)">–</button></div>
    <p class="tune-sub">Scroll thresholds</p>
    ${C.scroll.thresholds.map((v, i) => i ? R('th' + i, `Summit ${i + 1} at`, 0, 1, .01, v) : '').join('')}
    ${R('hy', 'Hysteresis', 0, .1, .005, C.scroll.hysteresis)}
    ${R('sh', 'Section height', 200, 900, 10, C.scroll.height, 'vh')}
    <p class="tune-sub">Camera</p>
    ${R('cd', 'Flight duration', .3, 4, .05, C.camera.duration, 's')}
    <div class="row"><label>Flight easing<i></i></label><select id="s-ce">${camEases}</select></div>
    ${R('ev', 'Angle', 10, 60, 1, C.camera.elev, '°')}
    ${R('az', 'Turn', -80, 80, 1, C.camera.azim, '°')}
    ${R('ds', 'Distance', 60, 260, 1, C.camera.dist)}
    ${R('ay', 'Aim height', 0, 1, .01, C.camera.aimY)}
    ${R('cx', 'Off-centre', -60, 60, 1, C.camera.shiftX)}
    <p class="tune-sub">Path — per summit</p>
    ${C.path.perSummit.map((o, i) => R('pd' + i, `Summit ${i + 1} duration`, .5, 8, .1, o.duration ?? C.path.defaults.duration, 's')
      + `<div class="row"><label>Summit ${i + 1} easing<i></i></label><select id="s-pe${i}">${eases}</select></div>`).join('')}
    ${R('pl', 'Delay', 0, 2, .05, C.path.defaults.delay, 's')}
    ${R('ac', 'Start after camera', 0, 1, .05, C.path.afterCamera)}
    ${R('wd', 'Trail width', 1, 6, .1, C.path.width, 'px')}
    ${R('dm', 'Inactive trails', 0, 1, .01, C.path.dim)}
    ${R('cv', 'Bézier bend', 0, 2, .01, C.path.curve)}
    <div class="row inline"><label>Trails<i></i></label><button class="tune-btn" id="s-rp">Replay</button></div>
    <p class="tune-sub">Focus</p>
    ${R('fz', 'Depth (how far the rest recedes)', 0, .95, .01, C.focus.depth)}
    <p class="tune-sub">Cards</p>
    <div class="seg" id="s-anchor"><button data-s="corner">Bottom-left</button><button data-s="peak">Beside peak</button></div>
    <div class="seg" id="s-side"><button data-s="left">Left</button><button data-s="right">Right</button></div>
    ${R('cl', 'Clear of flank', 0, 2, .05, C.cards.clearance, '×')}
    ${R('ox', 'Offset X', -.2, .4, .005, C.cards.offsetX, ' vw')}
    ${R('oy', 'Offset Y', -.4, .4, .005, C.cards.offsetY, ' vh')}
    ${R('cw', 'Width', 260, 520, 10, C.cards.width, 'px')}
    ${R('fi', 'Fade in', .1, 2, .05, C.cards.fadeIn, 's')}
    ${R('fo', 'Fade out', .05, 1.5, .05, C.cards.fadeOut, 's')}
    ${R('fd', 'Delay', 0, 1.5, .05, C.cards.delay, 's')}
    ${R('sl', 'Slide', 0, 80, 1, C.cards.slide, 'px')}
    ${bakeControls.html}`;
  document.body.appendChild(el);
  const q = id => el.querySelector('#' + id);
  const bind = (id, fn) => q('s-' + id).addEventListener('input', e => {
    const v = +e.target.value; q('v-' + id).textContent = v + e.target.dataset.unit; fn(v);
  });
  C.scroll.thresholds.forEach((_, i) => i && bind('th' + i, v => { C.scroll.thresholds[i] = v; fs.rescroll(); }));
  bind('hy', v => { C.scroll.hysteresis = v; });
  bind('sh', v => { C.scroll.height = v; fs.rescroll(); });
  bind('cd', v => { C.camera.duration = v; });
  q('s-ce').value = C.camera.ease;
  q('s-ce').addEventListener('change', e => { C.camera.ease = e.target.value; });
  bind('ev', v => { C.camera.elev = v; fs.reframe(); });
  bind('az', v => { C.camera.azim = v; fs.reframe(); });
  bind('ds', v => { C.camera.dist = v; fs.reframe(); });
  bind('ay', v => { C.camera.aimY = v; fs.reframe(); });
  bind('cx', v => { C.camera.shiftX = v; fs.reframe(); });
  C.path.perSummit.forEach((o, i) => {
    bind('pd' + i, v => { o.duration = v; });
    const s = q('s-pe' + i); s.value = o.ease || C.path.defaults.ease;
    s.addEventListener('change', e => { o.ease = e.target.value; });
  });
  bind('pl', v => { C.path.defaults.delay = v; });
  bind('ac', v => { C.path.afterCamera = v; });
  bind('wd', v => { C.path.width = v; });
  bind('dm', v => { C.path.dim = v; fs.trails.forEach((t, k) => { if (k !== fs.active) t.alphaT = v; }); });
  bind('cv', v => fs.setCurve(v));
  bind('fz', v => fs.setFocusDepth(v));
  q('s-rp').addEventListener('click', () => fs.replay());
  const side = q('s-side');
  [...side.children].forEach(b => b.classList.toggle('on', b.dataset.s === C.cards.side));
  side.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...side.children].forEach(c => c.classList.toggle('on', c === b)); C.cards.side = b.dataset.s;
  });
  const anchor = q('s-anchor');
  [...anchor.children].forEach(b => b.classList.toggle('on', b.dataset.s === C.cards.anchor));
  anchor.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...anchor.children].forEach(c => c.classList.toggle('on', c === b));
    C.cards.anchor = document.body.dataset.cards = b.dataset.s;
  });
  bind('cl', v => { C.cards.clearance = v; });
  bind('ox', v => { C.cards.offsetX = v; });
  bind('oy', v => { C.cards.offsetY = v; });
  bind('cw', v => { C.cards.width = v; fs.applyCardVars(); });
  bind('fi', v => { C.cards.fadeIn = v; fs.applyCardVars(); });
  bind('fo', v => { C.cards.fadeOut = v; fs.applyCardVars(); });
  bind('fd', v => { C.cards.delay = v; fs.applyCardVars(); });
  bind('sl', v => { C.cards.slide = v; fs.applyCardVars(); });
  bakeControls.bind(el, BAKE_KEY, C, 'SUMMITS_CONFIG');
  q('tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
  if (window.wb && window.wb.adopt) window.wb.adopt();
</script>
</body>
</html>
