     ─────────────────────────────────────────────────────────────────────────
     The Active Peak hero, station for station — plan, perspective, aside —
     and then the four case studies in the column the aside state leaves
     free, one scroll band each. A trail is drawn up the massif as the
     perspective arrives and finishes on the studio's pen mark; the control
     at the bottom left (or T) shows and hides it.

     The layout and behaviour are shared with summits-range-l2.html:
     assets/summits-range.css and assets/summits-range.js. This page is the
     `cards` layout: the copy in four containers up the right flank of the
     peak — wipe, fold, focus and draw — each tied back to its camp on the
     trail by a leader line.
