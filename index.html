function perspective(fovy, aspect, near, far){
  var f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
}
function lookAt(e, c, up){
  var zx=e[0]-c[0], zy=e[1]-c[1], zz=e[2]-c[2];
  var zl=Math.hypot(zx,zy,zz)||1; zx/=zl; zy/=zl; zz/=zl;
  var xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  var xl=Math.hypot(xx,xy,xz)||1; xx/=xl; xy/=xl; xz/=xl;
  var yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  return new Float32Array([
    xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
    -(xx*e[0]+xy*e[1]+xz*e[2]), -(yx*e[0]+yy*e[1]+yz*e[2]), -(zx*e[0]+zy*e[1]+zz*e[2]), 1
  ]);
}

/* -------------------------------- WebGL ----------------------------- */
var canvas = document.getElementById("c");
var opts = {antialias:true, alpha:false, powerPreference:"high-performance"};
var gl = canvas.getContext("webgl2", opts);
if (!gl){
  gl = canvas.getContext("webgl", opts);
  if (!gl) return { destroy: function(){} };
  gl.getExtension("OES_element_index_uint");
}
var isGL2 = (typeof WebGL2RenderingContext !== "undefined") && (gl instanceof WebGL2RenderingContext);

/* Focus maths, shared by every pass so the passes never disagree:
   uFocus runs 0..2 and each peak's weight falls off linearly around it. */
var FOCUS = [
  "uniform float uFocus; uniform vec2 uPk0; uniform vec2 uPk1; uniform vec2 uPk2;",
  "float nearOf(float i){ return 1.0 - clamp(abs(uFocus - i), 0.0, 1.0); }",
  "float belongOf(vec2 xz, vec2 c){",
  "  vec2 d = xz - c;",
  "  return exp(-dot(d, d) / (2.0*" + CFG.FOCUS_R.toFixed(1) + "*" + CFG.FOCUS_R.toFixed(1) + "));",
  "}",
  "void focusAt(vec2 xz, out float belong, out float focused){",
  "  float b0 = belongOf(xz, uPk0), b1 = belongOf(xz, uPk1), b2 = belongOf(xz, uPk2);",
  "  belong  = clamp(b0 + b1 + b2, 0.0, 1.0);",
  "  focused = clamp(b0*nearOf(0.0) + b1*nearOf(1.0) + b2*nearOf(2.0), 0.0, 1.0);",
  "}"
].join("\n");

var DISPLACE = [
  "uniform float uTime; uniform vec3 uCursor; uniform float uCursorAmt; uniform float uHScale;",
  FOCUS,
  "vec3 displace(vec3 p0, float ga, float flow){",
  "  vec3 p = vec3(p0.x, p0.y * uHScale, p0.z);",
  "  vec2 g = vec2(cos(ga), sin(ga));",
  "  float n = sin(p.x*0.31 + uTime*0.36) * cos(p.z*0.27 - uTime*0.25)",
  "          + 0.5*sin((p.x + p.z)*0.19 + uTime*0.52);",
  "  vec3 q = p;",
  "  q.xz += g * n * 0.62 * flow;",
  // unfocused ground settles: a purely positional field, so lines and the depth
  // surface move together and the occlusion stays exact
  "  float belong, focused; focusAt(p.xz, belong, focused);",
  "  q.y -= (belong - focused) * " + CFG.DEFOCUS_SINK.toFixed(2) + ";",
  "  float R = " + CFG.CURSOR_R.toFixed(2) + ";",
  "  vec2 v = p.xz - uCursor.xz;",
  "  float d = length(v);",
  "  float f = exp(-(d*d)/(2.0*R*R)) * uCursorAmt;",
  "  q.xz += (v / (d + 2.0)) * f * " + CFG.CURSOR_AMP.toFixed(2) + ";",
  "  q.y  += f * " + CFG.CURSOR_LIFT.toFixed(2) + ";",
  "  return q;",
  "}"
].join("\n");

var lineVS = [
  "precision highp float;",
  "attribute vec4 aPosSide; attribute vec4 aNextG; attribute vec4 aMeta;",
  "uniform mat4 uVP; uniform vec2 uHalfRes; uniform float uDPR;",
  "uniform vec3 uEye; uniform vec2 uFadeRange;",
  DISPLACE,
  "varying float vArc; varying float vEdge; varying float vCore;",
  "varying float vWeight; varying float vStyle; varying float vFar; varying float vDim;",
  "void main(){",
  "  vec3 p = displace(aPosSide.xyz, aNextG.w, aMeta.z);",
  "  vec3 q = displace(aNextG.xyz,   aNextG.w, aMeta.z);",
  "  vec4 cp = uVP * vec4(p, 1.0);",
  "  vec4 cq = uVP * vec4(q, 1.0);",
  "  vec2 sp = (cp.xy / max(abs(cp.w), 1e-4)) * uHalfRes;",
  "  vec2 sq = (cq.xy / max(abs(cq.w), 1e-4)) * uHalfRes;",
  "  vec2 dir = sq - sp;",
  "  dir = (length(dir) < 1e-5) ? vec2(1.0, 0.0) : normalize(dir);",
  "  vec2 nrm = vec2(-dir.y, dir.x);",
  "  float core  = mix(" + CFG.LINE_MIN.toFixed(2) + ", " + CFG.LINE_MAX.toFixed(2) + ", aMeta.y) * 0.5 * uDPR;",
  "  if (aMeta.w > 1.5 && aMeta.w < 2.5) core *= 1.30;",
  "  float half_ = core + 1.0;",
  "  cp.xy += (nrm * aPosSide.w * half_ / uHalfRes) * cp.w;",
  "  gl_Position = cp;",
  "  vArc = aMeta.x; vWeight = aMeta.y; vStyle = aMeta.w;",
  "  vEdge = aPosSide.w * half_; vCore = core;",
  "  vFar = 1.0 - smoothstep(uFadeRange.x, uFadeRange.y, distance(p, uEye));",
  "  float belong, focused; focusAt(vec2(aPosSide.x, aPosSide.z), belong, focused);",
  "  vDim = 1.0 - " + CFG.DEFOCUS_DIM.toFixed(2) + " * clamp(belong - focused, 0.0, 1.0);",
  "}"
].join("\n");

var lineFS = [
  "precision highp float;",
  "uniform float uFade; uniform float uTime; uniform vec3 uInk; uniform vec3 uAccent;",
  "varying float vArc; varying float vEdge; varying float vCore;",
  "varying float vWeight; varying float vStyle; varying float vFar; varying float vDim;",
  "void main(){",
  "  float a = clamp(vCore - abs(vEdge) + 0.6, 0.0, 1.0);",
  "  vec3 ink = uInk;",
  "  if (vStyle > 2.5){",
  "    float t = fract((vArc + uTime * 0.16) / 0.42);",
  "    a *= 1.0 - smoothstep(0.16, 0.30, t);",
  "  } else if (vStyle > 1.5){",
  "    ink = mix(uInk, uAccent, clamp(vDim*1.6 - 0.5, 0.0, 1.0));",
  "  } else if (vStyle > 0.5){",
  "    float t = fract((vArc + uTime * 0.20) / 0.70);",
  "    a *= smoothstep(0.0, 0.10, t) * (1.0 - smoothstep(0.54, 0.66, t));",
  "  }",
  "  a *= mix(0.42, 1.00, vWeight) * uFade * vFar * vDim;",
  "  if (a < 0.004) discard;",
  "  gl_FragColor = vec4(ink, a);",
  "}"
].join("\n");

var meshVS = [
  "precision highp float;",
  "attribute vec3 aPos; attribute float aGrad; attribute float aFlow;",
  "uniform mat4 uVP;",
  DISPLACE,
  "void main(){ gl_Position = uVP * vec4(displace(aPos, aGrad, aFlow), 1.0); }"
].join("\n");

var meshFS = "precision mediump float; void main(){ gl_FragColor = vec4(0.0); }";

/* linear depth + the focused peak's mask, for the single outline */
var depthVS = [
  "precision highp float;",
  "attribute vec3 aPos; attribute float aGrad; attribute float aFlow;",
  "attribute vec3 aCones;",
  "uniform mat4 uVP; uniform vec3 uEye; uniform float uFarDist;",
  DISPLACE,
  "varying float vD; varying float vMask;",
  "void main(){",
  "  vec3 p = displace(aPos, aGrad, aFlow);",
  "  vD = distance(p, uEye) / uFarDist;",
  // hard-select the peak nearest the current focus; the outline fades out while
  // focus is between two peaks, so the switch is never seen
  "  float fi = floor(uFocus + 0.5);",
  "  float m = aCones.x * step(abs(fi - 0.0), 0.25)",
  "          + aCones.y * step(abs(fi - 1.0), 0.25)",
  "          + aCones.z * step(abs(fi - 2.0), 0.25);",
  "  vMask = clamp(0.5 + (m - " + CFG.MASK_TH.toFixed(3) + ") * " + CFG.MASK_K.toFixed(1) + ", 0.0, 1.0);",
  "  gl_Position = uVP * vec4(p, 1.0);",
  "}"
].join("\n");

var depthFS = [
  "precision highp float;",
  "varying float vD; varying float vMask;",
  "void main(){",
  "  float v = clamp(vD, 0.0, 0.999999);",
  "  vec3 enc = fract(v * vec3(1.0, 255.0, 65025.0));",
  "  enc.xy -= enc.yz * (1.0/255.0);",
  "  gl_FragColor = vec4(enc, vMask);",
  "}"
].join("\n");

var edgeVS = [
  "precision highp float;",
  "attribute vec2 aXY; varying vec2 vUV;",
  "void main(){ vUV = aXY*0.5 + 0.5; gl_Position = vec4(aXY, 0.0, 1.0); }"
].join("\n");

var edgeFS = [
  "precision highp float;",
  "uniform sampler2D uTex; uniform vec2 uTexel; uniform float uRadius;",
  "uniform float uOutlineW; uniform float uOpacity;",
  "uniform vec3 uInk; uniform float uFarDist; uniform vec2 uFadeRange; uniform float uFade;",
  "varying vec2 vUV;",
  "float unpackD(vec3 c){ return dot(c, vec3(1.0, 1.0/255.0, 1.0/65025.0)); }",
  "void main(){",
  "  vec2 o = uTexel * uRadius;",
  "  vec4 c0 = texture2D(uTex, vUV);",
  "  float mL = texture2D(uTex, vUV - vec2(o.x, 0.0)).a;",
  "  float mR = texture2D(uTex, vUV + vec2(o.x, 0.0)).a;",
  "  float mD = texture2D(uTex, vUV - vec2(0.0, o.y)).a;",
  "  float mU = texture2D(uTex, vUV + vec2(0.0, o.y)).a;",
  "  vec2 g = vec2(mR - mL, mU - mD) * 0.5 / uRadius;",
  "  float gm = length(g);",
  "  if (gm < 1e-5) discard;",
  "  float dist = (c0.a - 0.5) / gm;",
  "  float a = clamp(uOutlineW*0.5 - abs(dist) + 0.5, 0.0, 1.0) * uOpacity;",
  "  if (a < 0.01) discard;",
  "  a *= (1.0 - smoothstep(uFadeRange.x, uFadeRange.y, unpackD(c0.rgb) * uFarDist)) * uFade;",
  "  if (a < 0.01) discard;",
  "  gl_FragColor = vec4(uInk, a);",
  "}"
].join("\n");

function compile(src, type){
  var s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs){
  var p = gl.createProgram();
  gl.attachShader(p, compile(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
function loc(p, names){ var o = {}; for (var i=0;i<names.length;i++) o[names[i]] = gl.getUniformLocation(p, names[i]); return o; }

var progLine = program(lineVS, lineFS);
var progMesh = program(meshVS, meshFS);
var progDepth = isGL2 ? program(depthVS, depthFS) : null;
var progEdge  = isGL2 ? program(edgeVS,  edgeFS)  : null;

var FOCUS_U = ["uFocus","uPk0","uPk1","uPk2"];
var uL = loc(progLine, ["uVP","uHalfRes","uDPR","uEye","uFadeRange","uTime","uCursor",
                        "uCursorAmt","uHScale","uFade","uInk","uAccent"].concat(FOCUS_U));
var uM = loc(progMesh, ["uVP","uTime","uCursor","uCursorAmt","uHScale"].concat(FOCUS_U));
var uD = progDepth ? loc(progDepth, ["uVP","uEye","uFarDist","uTime","uCursor","uCursorAmt",
                                     "uHScale"].concat(FOCUS_U)) : null;
var uE = progEdge  ? loc(progEdge,  ["uTex","uTexel","uRadius","uOutlineW","uOpacity",
                                     "uInk","uFarDist","uFadeRange","uFade"]) : null;

var aL = {
  posSide: gl.getAttribLocation(progLine, "aPosSide"),
  nextG:   gl.getAttribLocation(progLine, "aNextG"),
  meta:    gl.getAttribLocation(progLine, "aMeta")
};
var aM = {
  pos:  gl.getAttribLocation(progMesh, "aPos"),
  grad: gl.getAttribLocation(progMesh, "aGrad"),
  flow: gl.getAttribLocation(progMesh, "aFlow")
};
var aD = progDepth ? {
  pos:   gl.getAttribLocation(progDepth, "aPos"),
  grad:  gl.getAttribLocation(progDepth, "aGrad"),
  flow:  gl.getAttribLocation(progDepth, "aFlow"),
  cones: gl.getAttribLocation(progDepth, "aCones")
} : null;
var aE = progEdge ? gl.getAttribLocation(progEdge, "aXY") : -1;

var silFBO = null, silTex = null, silRBO = null, silW = 0, silH = 0, quadVBO = null;
if (isGL2){
  silFBO = gl.createFramebuffer(); silTex = gl.createTexture(); silRBO = gl.createRenderbuffer();
  quadVBO = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
}
function sizeSilhouette(w, h){
  if (!isGL2 || (w === silW && h === silH)) return;
  silW = w; silH = h;
  gl.bindTexture(gl.TEXTURE_2D, silTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindRenderbuffer(gl.RENDERBUFFER, silRBO);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
  gl.bindFramebuffer(gl.FRAMEBUFFER, silFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, silTex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, silRBO);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

var lineVBO = gl.createBuffer(), lineIBO = gl.createBuffer();
var meshVBO = gl.createBuffer(), meshIBO = gl.createBuffer();
var lineCount = 0, meshCount = 0;
gl.bindBuffer(gl.ARRAY_BUFFER, lineVBO); gl.bufferData(gl.ARRAY_BUFFER, vtx, gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineIBO); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
lineCount = idx.length;
gl.bindBuffer(gl.ARRAY_BUFFER, meshVBO); gl.bufferData(gl.ARRAY_BUFFER, mvtx, gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIBO); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, midx, gl.STATIC_DRAW);
meshCount = midx.length;

/* ------------------------------ scrolling --------------------------- */
/* The section owns the wheel: focus runs 0..2 and the page never scrolls. */
var focus = 0, focusTarget = 0, lastInput = -9999;

function setTarget(v, immediate){
  focusTarget = Math.max(0, Math.min(2, v));
  lastInput = performance.now();
  hintSeen();
  if (immediate) focus = focusTarget;
}
on(window, "wheel", function(e){
  e.preventDefault();
  setTarget(focusTarget + e.deltaY * 0.0021);
}, {passive:false});

var touchY = null;
on(window, "touchstart", function(e){ touchY = e.touches[0].clientY; }, {passive:true});
on(window, "touchmove", function(e){
  if (touchY === null) return;
  var y = e.touches[0].clientY;
  setTarget(focusTarget + (touchY - y) * 0.006);
  touchY = y;
  e.preventDefault();
}, {passive:false});
on(window, "touchend", function(){ touchY = null; }, {passive:true});

on(window, "keydown", function(e){
  var k = e.key;
  if (k === "ArrowDown" || k === "PageDown" || k === " ")      setTarget(Math.round(focusTarget) + 1);
  else if (k === "ArrowUp" || k === "PageUp")                  setTarget(Math.round(focusTarget) - 1);
  else if (k === "Home")                                       setTarget(0);
  else if (k === "End")                                        setTarget(2);
  else return;
  e.preventDefault();
});

/* ------------------------------- overlay ---------------------------- */
function peakArt(P, i){
  /* a small contour portrait, drawn to the same profile as the peak itself */
  var w = 340, h = 128, cx = w*0.5, base = h - 6, rings = "";
  for (var r=1; r<=6; r++){
    var t = r/6;
    var rx = 150*Math.pow(t, 1.0/P.s) * (P.w/1.05);
    var ry = rx * 0.30;
    var cy = base - (1 - t) * 92;
    var col = (r === 1) ? '#e2620f' : '#0d0e0b';
    var op  = (r === 1) ? '1' : '.5';
    rings += '<ellipse cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" rx="' + rx.toFixed(1) +
             '" ry="' + ry.toFixed(1) + '" fill="none" stroke="' + col +
             '" stroke-opacity="' + op + '" stroke-width="' + (r === 1 ? 1.6 : 1) + '"/>';
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '">' +
         '<rect width="' + w + '" height="' + h + '" fill="#e4e0d8"/>' + rings + '</svg>';
}

var panel = document.getElementById("panel");
var rail  = document.getElementById("rail");
var hint  = document.getElementById("hint");
var shown = -1;

for (var ri=0; ri<3; ri++){
  (function(i){
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="tick"></span><span>' + ("0" + (i+1)) + '</span>';
    b.setAttribute("aria-label", "Show " + PEAKS[i].name);
    b.addEventListener("click", function(){ setTarget(i); });
    rail.appendChild(b);
  })(ri);
}
var railBtns = rail.querySelectorAll("button");

function showPeak(i){
  if (i === shown) return;
  shown = i;
  var P = PEAKS[i];
  document.getElementById("p-img").src = "data:image/svg+xml;utf8," + encodeURIComponent(peakArt(P, i));
  document.getElementById("p-index").textContent = ("0" + (i+1)) + " / 03";
  document.getElementById("p-elev").textContent = P.elev;
  document.getElementById("p-name").textContent = P.name;
  document.getElementById("p-region").textContent = P.region;
  document.getElementById("p-fact").textContent = P.fact;
  for (var k=0;k<railBtns.length;k++) railBtns[k].setAttribute("aria-current", k === i ? "true" : "false");
}
function hintSeen(){ hint.classList.add("gone"); }
showPeak(0);

/* ------------------------------ interaction ------------------------- */
var pointer = {x:0, y:0, tx:0, ty:0, amt:0, tamt:0};
var cursorWorld = [0,0,0], cursorTarget = [0,0,0];
on(window, "pointermove", function(e){
  var r = canvas.getBoundingClientRect();
  if (!r.width) return;
  pointer.tx = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.ty = ((e.clientY - r.top) / r.height) * 2 - 1;
  pointer.tamt = 1;
}, {passive:true});
on(window, "pointerleave", function(){ pointer.tamt = 0; }, {passive:true});
on(document, "visibilitychange", function(){ if (!document.hidden) last = performance.now(); });

var W = 1, H = 1, DPR = 1;
function resize(){
  var dpr = DPR = Math.min(window.devicePixelRatio || 1, 2);
  var r = canvas.getBoundingClientRect();
  var w = Math.max(1, Math.round(r.width * dpr));
  var h = Math.max(1, Math.round(r.height * dpr));
  if (w !== W || h !== H){ W = w; H = h; canvas.width = W; canvas.height = H; }
}
on(window, "resize", resize);
resize();

var CAM = { dist: 40.0, elev: 0.415, fov: 32 };

function raycastTerrain(eye, ray){
  var far = CAM.dist * 2.6, prev = 0;
  var prevGap = eye[1] - sampleField(eye[0]/S, eye[2]/S)*HS;
  for (var i=1;i<=72;i++){
    var t = (i/72)*far;
    var x = eye[0] + ray[0]*t, y = eye[1] + ray[1]*t, z = eye[2] + ray[2]*t;
    if (Math.abs(x) > E*S || Math.abs(z) > E*S){ prev = t; continue; }
    var gap = y - sampleField(x/S, z/S)*HS;
    if (gap <= 0){
      var f = prevGap / (prevGap - gap), tt = prev + (t - prev)*f;
      RC[0] = eye[0] + ray[0]*tt; RC[1] = eye[2] + ray[2]*tt;
      return RC;
    }
    prev = t; prevGap = gap;
  }
  return null;
}
var RC = [0, 0];

/* -------------------------------- render ---------------------------- */
gl.enable(gl.DEPTH_TEST);
gl.depthFunc(gl.LEQUAL);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

var BG = [0.925, 0.914, 0.890], INK = [0.051, 0.055, 0.043];
var t0 = performance.now(), last = t0;
var PK = [new Float32Array(2), new Float32Array(2), new Float32Array(2)];
for (var pk=0; pk<3; pk++){ PK[pk][0] = PEAKS[pk].x * S; PK[pk][1] = PEAKS[pk].z * S; }

function lerp(a, b, t){ return a + (b - a) * t; }

function frame(now){
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  var t = (now - t0) / 1000;
  var fade = Math.min(1, t / 1.5); fade = fade*fade*(3-2*fade);

  /* settle onto the nearest summit once the wheel goes quiet */
  if (now - lastInput > 260){
    var snap = Math.round(focusTarget);
    focusTarget += (snap - focusTarget) * Math.min(1, dt*3.4);
  }
  focus += (focusTarget - focus) * Math.min(1, dt*(reduceMotion ? 12 : 4.2));

  var fi = Math.max(0, Math.min(1.9999, focus));
  var i0 = Math.floor(fi), i1 = Math.min(2, i0 + 1), ft = fi - i0;
  var fs = ft*ft*(3 - 2*ft);

  showPeak(Math.round(focus));
  var transit = Math.abs(focus - Math.round(focus));
  panel.style.opacity = String(1 - Math.min(1, transit / 0.34));
  panel.style.transform = "translateY(" + (Math.min(1, transit / 0.34) * 14).toFixed(1) + "px)";

  pointer.x   += (pointer.tx   - pointer.x)   * Math.min(1, dt*5.0);
  pointer.y   += (pointer.ty   - pointer.y)   * Math.min(1, dt*5.0);
  pointer.amt += (pointer.tamt - pointer.amt) * Math.min(1, dt*3.0);

  resize();
  gl.viewport(0, 0, W, H);

  /* camera rides from summit to summit */
  var A = PEAKS[i0], B = PEAKS[i1];
  var tgX = lerp(A.x, B.x, fs) * S, tgZ = lerp(A.z, B.z, fs) * S;
  var topY = lerp(peakTopY[i0], peakTopY[i1], fs);
  var yaw  = lerp(A.yaw, B.yaw, fs) + pointer.x * CFG.TILT_YAW * pointer.amt
           + (reduceMotion ? 0 : Math.sin(t*0.11) * 0.022);
  var elev = CAM.elev - pointer.y * CFG.TILT_PITCH * pointer.amt;

  var eyeY = Math.max(Math.sin(elev) * CAM.dist, topY + 5.0);
  var eye = new Float32Array([
    tgX + Math.sin(yaw) * Math.cos(elev) * CAM.dist,
    eyeY,
    tgZ + Math.cos(yaw) * Math.cos(elev) * CAM.dist
  ]);
  var halfFov  = CAM.fov * Math.PI/360;
  var horiz    = Math.max(1, Math.hypot(eye[0]-tgX, eye[2]-tgZ));
  var camPitch = Math.atan((topY - eyeY)/horiz) - halfFov*0.70;
  var target   = [tgX, eyeY + Math.tan(camPitch)*horiz, tgZ];

  var view = lookAt(eye, target, [0,1,0]);
  var proj = perspective(CAM.fov * Math.PI/180, W/H, 0.5, 240);
  var VP = mul(proj, view);

  if (pointer.amt > 0.01){
    var tanY = Math.tan(CAM.fov * Math.PI/360), tanX = tanY * (W/H);
    var fwd = [target[0]-eye[0], target[1]-eye[1], target[2]-eye[2]];
    var fl = Math.hypot(fwd[0],fwd[1],fwd[2])||1; fwd = [fwd[0]/fl, fwd[1]/fl, fwd[2]/fl];
    var rgt = [fwd[2], 0, -fwd[0]];
    var rl = Math.hypot(rgt[0],rgt[2])||1; rgt = [rgt[0]/rl, 0, rgt[2]/rl];
    var up = [rgt[1]*fwd[2]-rgt[2]*fwd[1], rgt[2]*fwd[0]-rgt[0]*fwd[2], rgt[0]*fwd[1]-rgt[1]*fwd[0]];
    var ray = [
      fwd[0] + rgt[0]*pointer.x*tanX - up[0]*pointer.y*tanY,
      fwd[1] + rgt[1]*pointer.x*tanX - up[1]*pointer.y*tanY,
      fwd[2] + rgt[2]*pointer.x*tanX - up[2]*pointer.y*tanY
    ];
    var hit = raycastTerrain(eye, ray);
    if (hit){ cursorTarget[0] = hit[0]; cursorTarget[2] = hit[1]; }
  }
  var lp = Math.min(1, dt*8.0);
  cursorWorld[0] += (cursorTarget[0] - cursorWorld[0]) * lp;
  cursorWorld[2] += (cursorTarget[2] - cursorWorld[2]) * lp;

  var farDist = CAM.dist * 3.4;
  var fadeA = CAM.dist*CFG.FADE_A, fadeB = CAM.dist*CFG.FADE_B;

  function focusUniforms(u){
    gl.uniform1f(u.uFocus, focus);
    gl.uniform2fv(u.uPk0, PK[0]); gl.uniform2fv(u.uPk1, PK[1]); gl.uniform2fv(u.uPk2, PK[2]);
  }

  /* pass 0 — packed depth + the focused peak's mask */
  if (isGL2){
    sizeSilhouette(W, H);
    gl.bindFramebuffer(gl.FRAMEBUFFER, silFBO);
    gl.viewport(0, 0, W, H);
    gl.clearColor(1, 1, 1, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(progDepth);
    gl.uniformMatrix4fv(uD.uVP, false, VP);
    gl.uniform3fv(uD.uEye, eye);
    gl.uniform1f(uD.uFarDist, farDist);
    gl.uniform1f(uD.uTime, t);
    gl.uniform3fv(uD.uCursor, cursorWorld);
    gl.uniform1f(uD.uCursorAmt, pointer.amt);
    gl.uniform1f(uD.uHScale, 1.0);
    focusUniforms(uD);
    gl.depthMask(true);
    gl.bindBuffer(gl.ARRAY_BUFFER, meshVBO);
    gl.enableVertexAttribArray(aD.pos);   gl.vertexAttribPointer(aD.pos,   3, gl.FLOAT, false, 32, 0);
    gl.enableVertexAttribArray(aD.grad);  gl.vertexAttribPointer(aD.grad,  1, gl.FLOAT, false, 32, 12);
    gl.enableVertexAttribArray(aD.flow);  gl.vertexAttribPointer(aD.flow,  1, gl.FLOAT, false, 32, 16);
    gl.enableVertexAttribArray(aD.cones); gl.vertexAttribPointer(aD.cones, 3, gl.FLOAT, false, 32, 20);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIBO);
    gl.drawElements(gl.TRIANGLES, meshCount, gl.UNSIGNED_INT, 0);
    gl.disableVertexAttribArray(aD.pos);
    gl.disableVertexAttribArray(aD.grad);
    gl.disableVertexAttribArray(aD.flow);
    gl.disableVertexAttribArray(aD.cones);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
  }

  /* pass 1 — depth only, for hidden-line removal */
  gl.useProgram(progMesh);
  gl.uniformMatrix4fv(uM.uVP, false, VP);
  gl.uniform1f(uM.uTime, t);
  gl.uniform3fv(uM.uCursor, cursorWorld);
  gl.uniform1f(uM.uCursorAmt, pointer.amt);
  gl.uniform1f(uM.uHScale, 1.0);
  focusUniforms(uM);
  gl.clearColor(BG[0], BG[1], BG[2], 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.colorMask(false, false, false, false);
  gl.depthMask(true);
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(2.0, 6.0);
  gl.bindBuffer(gl.ARRAY_BUFFER, meshVBO);
  gl.enableVertexAttribArray(aM.pos);  gl.vertexAttribPointer(aM.pos,  3, gl.FLOAT, false, 32, 0);
  gl.enableVertexAttribArray(aM.grad); gl.vertexAttribPointer(aM.grad, 1, gl.FLOAT, false, 32, 12);
  gl.enableVertexAttribArray(aM.flow); gl.vertexAttribPointer(aM.flow, 1, gl.FLOAT, false, 32, 16);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIBO);
  gl.drawElements(gl.TRIANGLES, meshCount, gl.UNSIGNED_INT, 0);
  gl.disableVertexAttribArray(aM.pos);
  gl.disableVertexAttribArray(aM.grad);
  gl.disableVertexAttribArray(aM.flow);
  gl.disable(gl.POLYGON_OFFSET_FILL);

  /* pass 2 — one outline, on the peak in focus, faded out while in transit */
  gl.colorMask(true, true, true, true);
  gl.depthMask(false);
  if (isGL2){
    var opacity = 1 - smooth01(transit, 0.10, 0.40);
    if (opacity > 0.01){
      gl.useProgram(progEdge);
      gl.disable(gl.DEPTH_TEST);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, silTex);
      gl.uniform1i(uE.uTex, 0);
      gl.uniform2f(uE.uTexel, 1/W, 1/H);
      gl.uniform1f(uE.uRadius, 1.0);
      gl.uniform1f(uE.uOutlineW, CFG.LINE_MAX * CFG.OUTLINE * DPR);
      gl.uniform1f(uE.uOpacity, opacity);
      gl.uniform3fv(uE.uInk, INK);
      gl.uniform1f(uE.uFarDist, farDist);
      gl.uniform2f(uE.uFadeRange, fadeA, fadeB);
      gl.uniform1f(uE.uFade, fade);
      gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
      gl.enableVertexAttribArray(aE);
      gl.vertexAttribPointer(aE, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.disableVertexAttribArray(aE);
      gl.enable(gl.DEPTH_TEST);
    }
  }

  /* pass 3 — contour ribbons */
  gl.useProgram(progLine);
  gl.uniformMatrix4fv(uL.uVP, false, VP);
  gl.uniform2f(uL.uHalfRes, W*0.5, H*0.5);
  gl.uniform1f(uL.uDPR, DPR);
  gl.uniform3fv(uL.uEye, eye);
  gl.uniform2f(uL.uFadeRange, fadeA, fadeB);
  gl.uniform1f(uL.uTime, t);
  gl.uniform3fv(uL.uCursor, cursorWorld);
  gl.uniform1f(uL.uCursorAmt, pointer.amt);
  gl.uniform1f(uL.uHScale, 1.0);
  gl.uniform1f(uL.uFade, fade);
  gl.uniform3fv(uL.uInk, INK);
  gl.uniform3fv(uL.uAccent, CFG.ACCENT);
  focusUniforms(uL);
  gl.bindBuffer(gl.ARRAY_BUFFER, lineVBO);
  gl.enableVertexAttribArray(aL.posSide); gl.vertexAttribPointer(aL.posSide, 4, gl.FLOAT, false, 48, 0);
  gl.enableVertexAttribArray(aL.nextG);   gl.vertexAttribPointer(aL.nextG,   4, gl.FLOAT, false, 48, 16);
  gl.enableVertexAttribArray(aL.meta);    gl.vertexAttribPointer(aL.meta,    4, gl.FLOAT, false, 48, 32);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineIBO);
  gl.drawElements(gl.TRIANGLES, lineCount, gl.UNSIGNED_INT, 0);
  gl.depthMask(true);

  _raf = requestAnimationFrame(frame);
}
function smooth01(x, a, b){
  var t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t*t*(3 - 2*t);
}
_raf = requestAnimationFrame(frame);

return { destroy: function(){

    _bound[i][0].removeEventListener(_bound[i][1], _bound[i][2], _bound[i][3]);
  }
  if (typeof rebuildTimer !== "undefined") clearTimeout(rebuildTimer);
  if (typeof ovTimer !== "undefined") clearTimeout(ovTimer);
  var lose = gl && gl.getExtension("WEBGL_lose_context");
  if (lose) lose.loseContext();
} };
}

var MODULES = { ridge: __app_ridge, scroll: __app_scroll, peaks: __app_peaks };
var host = document.getElementById("app");
var buttons = document.querySelectorAll("#switch button");
var live = null, current = null;

function show(key){
  if (key === current) return;
  if (live && live.destroy) { try { live.destroy(); } catch (e) {} }
  live = null;

  host.innerHTML = "";
  document.documentElement.style.cssText = "";   // drop any palette a mode had set
  document.documentElement.setAttribute("data-app", key);
  document.body.setAttribute("data-app", key);
  host.innerHTML = MARKUP[key];
  window.scrollTo(0, 0);

  for (var i = 0; i < buttons.length; i++){
    buttons[i].setAttribute("aria-current",
      buttons[i].getAttribute("data-app") === key ? "true" : "false");
  }
  current = key;
  if (location.hash.slice(1) !== key) history.replaceState(null, "", "#" + key);

  /* let layout settle before the module measures the canvas, with a timer
     fallback in case rAF is throttled (background tab, reduced power) */
  var started = false;
  function go(){ if (started || current !== key) return; started = true; live = MODULES[key](); }
  requestAnimationFrame(function(){ requestAnimationFrame(go); });
  setTimeout(go, 90);
}

for (var b = 0; b < buttons.length; b++){
  buttons[b].addEventListener("click", function(){ show(this.getAttribute("data-app")); });
}
window.addEventListener("hashchange", function(){
  var k = location.hash.slice(1);
  if (MODULES[k]) show(k);
});

var start = location.hash.slice(1);
show(MODULES[start] ? start : "ridge");
