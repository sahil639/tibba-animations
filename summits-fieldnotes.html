<!DOCTYPE html>

<head>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   Our summits — 2 · Field Notes (two panels)
   ─────────────────────────────────────────────────────────────────────────
   The section pins and splits in two. On the left, the mountain: the
   Summits v3 range, the camera riding from summit to summit as the scroll
   steps through the projects. A hairline divides it from the right: the
   notes for the project at that summit — the shared Rive animation playing
   for it (assets/rive/, the project's own file if there is one), then the
   title, the tags, a line about the work and the way into the case study.

   The controls sit across the divider at the foot: back, a bar per project
   that fills as it is read, on. Any of them, or a summit's mark, goes
   straight to that project.

   Phones: the panels stack — the mountain above, the notes below.
   ═════════════════════════════════════════════════════════════════════════ */
#scope { position: relative; height: 400vh; }
#stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.fn-left { position: relative; }
.fn-left #range { position: absolute; inset: 0; }
.fn-left .head { position: absolute; z-index: 3; left: var(--gut); top: clamp(84px, 11vh, 120px); pointer-events: none; }
.fn-left .head .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.fn-left .head p + p { margin-top: 10px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: rgba(233,236,242,.5); font-variant-numeric: tabular-nums; }
.fn-left .head b { color: var(--c); font-weight: 400; }
.fn-right { position: relative; border-left: 1px solid rgba(233,236,242,.18); background: #070708;
  padding: clamp(84px, 11vh, 120px) var(--gut) clamp(120px, 17vh, 170px) clamp(28px, 3.6vw, 64px); display: flex; flex-direction: column; gap: clamp(22px, 3.4vh, 40px); }
.fn-right .sl-rive { width: min(100%, 560px); aspect-ratio: 16 / 9; flex: none; }
.fn-words { display: flex; flex-direction: column; gap: clamp(14px, 2.4vh, 26px); align-items: flex-start; }
.fn-words .sl-title { font-size: clamp(24px, 2.5vw, 44px); }

/* the controls, across the divider */
.fn-ctl { position: absolute; z-index: 10; left: 58%; bottom: 0; transform: translateX(-50%); width: min(56vw, 860px);
  display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: clamp(14px, 2vw, 30px);
  padding: clamp(18px, 2.6vh, 28px) clamp(18px, 2vw, 32px); background: #050506; border: 1px solid rgba(233,236,242,.18); border-bottom: 0; }
.fn-ctl .arr { appearance: none; border: 1px solid rgba(233,236,242,.25); background: none; color: #fff; width: 38px; height: 38px; cursor: pointer;
  display: grid; place-items: center; transition: border-color .25s linear, background-color .25s linear; }
.fn-ctl .arr:hover { border-color: #fff; background: rgba(255,255,255,.06); }
.fn-ctl .arr:disabled { opacity: .3; cursor: default; }
.fn-ctl .arr svg { width: 14px; height: 14px; }

@media (max-width: 900px) {
  #stage { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
  .fn-left .head { top: 70px; }
  .fn-right { border-left: 0; border-top: 1px solid rgba(233,236,242,.18); padding: 18px var(--gut) 104px; gap: 14px; }
  .fn-right .sl-rive { aspect-ratio: 2 / 1; width: 100%; }
  .fn-words { gap: 10px; }
  .fn-words .sl-title { font-size: clamp(20px, 5.6vw, 28px); }
  .fn-words .sl-body { display: none; }
  .fn-words .sl-tags { font-size: 10px; }
  .fn-words .sl-cta { padding: 11px 16px; font-size: 11px; }
  .fn-ctl { left: 0; right: 0; transform: none; width: auto; padding: 14px var(--gut); gap: 12px; border-inline: 0; }
  .fn-ctl .arr { width: 32px; height: 32px; }
  .sl-tabs button { font-size: 9.5px; letter-spacing: .02em; }
  .sl-tabs button::before { margin-bottom: 8px; }
}
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>
<body>
<div id="scope">
  <div id="stage">
    <div class="fn-left">
      <div id="range"></div>
      <div class="head"><p class="eyebrow">[ &nbsp;Our summits&nbsp; ]</p><p id="fn-count"></p></div>
    </div>
    <div class="fn-right">
      <div id="rive-host"></div>
      <div class="fn-words sl-swap" id="words"></div>
    </div>
    <div class="fn-ctl">
      <button class="arr" type="button" id="prev" aria-label="Previous project"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2 4 7l5 5"/></svg></button>
      <nav class="sl-tabs" id="tabs" aria-label="Projects"></nav>
      <button class="arr" type="button" id="next" aria-label="Next project"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m5 2 5 5-5 5"/></svg></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.min.js"}}</script>
<script type="module">
  import { S, N, clamp, pad, mountRange, tags, cta, riveBox, links, swap, pinned } from './assets/summits-layouts.js';
  const scope = document.getElementById('scope'), stage = document.getElementById('stage'), words = document.getElementById('words'),
        tabsEl = document.getElementById('tabs'), host = document.getElementById('rive-host');
  const P = pinned(scope);
  tabsEl.innerHTML = S.map(s => `<button type="button" style="--c:${s.colour}">${s.client.replace(' & Mindhouse', '')}</button>`).join('');
  const tabs = [...tabsEl.children];
  links(stage);

  /* the right panel: the Rive box and the words, for one project */
  let rive = null, shown = -1;
  const wordsOf = s => `<h3 class="sl-title">${s.title}</h3>${tags(s)}<p class="sl-body">${s.body}</p>${cta(s)}`;
  function show(i) {
    if (i === shown) return;
    const s = S[i], first = shown < 0; shown = i;
    stage.style.setProperty('--c', s.colour);
    document.getElementById('fn-count').innerHTML = `<b>${pad(i)}</b> / ${pad(N - 1)} &nbsp;·&nbsp; ${s.client} &nbsp;·&nbsp; Alt ${s.alt} m`;
    host.innerHTML = riveBox(s, 0);
    rive = window.TibbaRive ? window.TibbaRive.mount(host.firstElementChild, { names: [s.folder, 'summits'], project: i }) : null;
    if (first) words.innerHTML = wordsOf(s); else swap(words, wordsOf(s));
    tabs.forEach((b, k) => b.classList.toggle('on', k === i));
    document.getElementById('prev').disabled = i === 0; document.getElementById('next').disabled = i === N - 1;
  }
  const range = mountRange(document.getElementById('range'), { focus: P.focus, frame: 'ride', onPick: P.jump, onCase: i => show(i) });
  tabs.forEach((b, i) => b.addEventListener('click', () => P.jump(i)));
  document.getElementById('prev').addEventListener('click', () => P.jump(shown - 1));
  document.getElementById('next').addEventListener('click', () => P.jump(shown + 1));

  let raf = 0;
  const frame = () => { raf = 0; const f = P.focus(); tabs.forEach((b, i) => b.style.setProperty('--f', clamp(f - i + 1, 0, 1).toFixed(3))); };
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(frame); }, { passive: true });
  frame();
  window.tibba = range;
</script>
</body>
</html>
