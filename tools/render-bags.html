<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Render — the three bags as looping video frames</title>
<style>
  html, body { margin: 0; background: #000; color: #ccc; font: 13px system-ui; }
  iframe { width: 780px; height: 660px; border: 0; display: block; }
  p { padding: 8px; margin: 0; }
</style>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────────
     tools/render-bags.html — a local tool, run against dev-server.mjs

     Renders each of misc-bags.html's three bags, standing at its own
     reference angle, as a seamless loop: the rings flow a whole number of
     their own spacings (period 1 in the phase) and the slow morph goes out
     and comes back (one sine), so the last frame leads into the first.
     Same virtual clock as render-basecamp.html.

     Frames: tools/out/bag<B>-NNNN.png (B = the bag's index in misc-bags).
     Then tools/encode-bags.sh.   ?seconds=5.2&fps=30&rings=4
     ───────────────────────────────────────────────────────────────────── -->
<iframe id="f"></iframe>
<p id="log">loading…</p>
<script type="module">
  const q = new URLSearchParams(location.search), num = (k, d) => +(q.get(k) || d);
  const SECONDS = num('seconds', 5.2), FPS = num('fps', 30), RINGS = num('rings', 4);
  const N = Math.round(SECONDS * FPS), dt = 1000 / FPS, log = document.getElementById('log');

  const SHIM = `<base href="${location.origin}/"><script>(() => {
    let t = 0, id = 0; const q = [];
    performance.now = () => t; const d0 = Date.now(); Date.now = () => d0 + t;
    window.requestAnimationFrame = cb => { q.push([++id, cb]); return id; };
    window.cancelAnimationFrame = i => { const k = q.findIndex(e => e[0] === i); if (k >= 0) q.splice(k, 1); };
    Object.defineProperty(window, 'devicePixelRatio', { get: () => 1 });
    Object.defineProperty(Document.prototype, 'hidden', { get: () => false });
    window.__advance = ms => { t += ms; q.splice(0).forEach(([, cb]) => cb(t)); };
  })();<\/script>`;
  const html = await (await fetch('/misc-bags.html')).text();
  const f = document.getElementById('f');
  f.srcdoc = html.replace(/<head>/i, '<head>' + SHIM);
  await new Promise(r => f.onload = r);
  const W = f.contentWindow, wait = ms => new Promise(r => setTimeout(r, ms));
  for (let i = 0; i < 50 && !W.bags; i++) { W.__advance(dt); await wait(100); }
  const { bags } = W, cv = bags.scene && W.document.querySelector('canvas');
  W.document.getElementById('tune')?.remove();
  bags.CONFIG.anim.play = false;                    // the phase and morph are set here, frame by frame
  /* the shared uniforms, found on any of the line materials */
  let U = null; bags.scene.traverse(o => { if (!U && o.material && o.material.uniforms && o.material.uniforms.uPhase) U = o.material.uniforms; });
  const MORPH = bags.CONFIG.anim.morph, L = SECONDS;

  for (const b of [1, 2, 0]) {                      // the order the stages use them
    bags.showBag(b);
    for (let i = 0; i < 90; i++) W.__advance(dt);   // the swap and the camera land
    for (let n = 0; n < N; n++) {
      const t = n / FPS;
      U.uPhase.value = RINGS * t / L;               // whole rings over the loop
      U.uMorphT.value = MORPH * L / (2 * Math.PI) * Math.sin(2 * Math.PI * t / L);
      W.__advance(dt);
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      await fetch(`/__save/bag${b}-${String(n).padStart(4, '0')}.png`, { method: 'POST', body: blob });
      if (n % 10 === 0) log.textContent = `bag ${b}: frame ${n + 1} / ${N} — ${cv.width}×${cv.height}`;
    }
  }
  log.textContent = `done — 3 × ${N} frames at ${cv.width}×${cv.height}`;
  window.__done = true;
</script>
</body>
</html>
