<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Render — the phone hero (portrait video frames + SVG)</title>
<style>
  html, body { margin: 0; background: #000; color: #ccc; font: 13px system-ui; }
  #c { display: block; }
  p { padding: 8px; margin: 0; }
</style>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────────
     tools/render-hero-mobile.html — a local tool, run against dev-server.mjs

     The phone hero, framed for a portrait screen: the camera looks further
     down on the range than the desktop station, so the terrain runs the full
     height of the frame (no sky), with the summit in the middle of it.

     In the console (or through the preview tools):
       await probe()            one still → tools/out/probe.png, returns the
                                summit's position on screen
       await frames()           the seamless loop → tools/out/mhero-%04d.png
       await svg()              the first frame as vector contours →
                                tools/out/hero-mountain-m.svg

     Then:
       ffmpeg -framerate 30 -i tools/out/mhero-%04d.png -c:v libx264 -crf 26 \
         -pix_fmt yuv420p -movflags +faststart assets/video/hero-mountain-m.mp4

     ?w=360&h=780&dpr=2   CAM below is the station; the loop sways round it
     as tools/render-hero.html does (one full sine, 10.5 s, seamless).
     ───────────────────────────────────────────────────────────────────── -->
<canvas id="c"></canvas>
<p id="log">loading…</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.min.js"}}</script>
<script type="module">
  import { createRangeScene } from '../assets/range-scene.js';
  const q = new URLSearchParams(location.search), num = (k, d) => +(q.get(k) || d);
  const W = num('w', 360), H = num('h', 780), DPR = num('dpr', 2);
  const cv = document.getElementById('c'), log = document.getElementById('log');
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  Object.defineProperty(window, 'devicePixelRatio', { get: () => DPR });
  const SECONDS = 10.5, FPS = 30, N = Math.round(SECONDS * FPS);

  const scene = createRangeScene({ canvas: cv, mode: 'hero', ink: false, palette: 'peak', backdrop: 'behind', hover: false, lockFade: 0.9, quality: 'high' });
  scene.setAccent('#FF4B1F'); scene.setDepth(0.22); scene.setHover(false); scene.setFill(null); scene.lockTo(0);
  scene.setRunning(false);
  window.scene = scene;
  /* the portrait station: higher than the desktop's (elev 30) so the far
     country fills the top of the frame instead of the sky */
  window.CAM = { elev: 46, azim: 6, dist: 118, x: 2, y: 22, z: -4 };

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const put = async (name, body) => fetch('/__save/' + name, { method: 'POST', body });
  const png = () => new Promise(r => cv.toBlob(r, 'image/png'));
  const at = (a = 0) => scene.setHeroCam({ elev: CAM.elev + Math.sin(a) * 1.2, azim: CAM.azim + Math.sin(a) * 5,
    dist: CAM.dist + (1 - Math.cos(a)) * 3, tgtX: CAM.x, tgtY: CAM.y, tgtZ: CAM.z });
  function settle() { for (let i = 0; i < 90; i++) { at(0); scene.step(1 / FPS); } }

  window.probe = async () => { settle(); at(0); scene.step(1 / FPS); await put('probe.png', await png()); return scene.summitScreen(); };
  window.frames = async () => {
    settle();
    for (let i = 0; i < N; i++) { at(i / N * Math.PI * 2); scene.step(1 / FPS); await put('mhero-' + String(i).padStart(4, '0') + '.png', await png());
      if (i % 15 === 0) log.textContent = `frame ${i + 1} / ${N}`; }
    log.textContent = 'frames done'; return N;
  };

  /* the vector copy: the scene's own contour polylines, projected with the
     same camera; each point kept only where the rendered frame shows the
     line there (so the hidden ones behind a ridge drop out) and coloured
     from the frame */
  window.svg = async () => {
    settle(); at(0); scene.step(1 / FPS);
    const k = cv.width / W, c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height;
    const g = c2.getContext('2d', { willReadFrequently: true }); g.drawImage(cv, 0, 0);
    const px = g.getImageData(0, 0, c2.width, c2.height).data;
    const look = (x, y) => {           // the brightest pixel within 1.5 CSS px
      let best = 0, col = null; const r = Math.ceil(1.5 * k);
      const cx = Math.round(x * k), cy = Math.round(y * k);
      for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
        const X = cx + i, Y = cy + j; if (X < 0 || Y < 0 || X >= c2.width || Y >= c2.height) continue;
        const o = (Y * c2.width + X) * 4, l = px[o] * .3 + px[o + 1] * .59 + px[o + 2] * .11;
        if (l > best) { best = l; col = [px[o], px[o + 1], px[o + 2]]; }
      }
      return { l: best, col };
    };
    /* the ground colour: the median of the frame's darkest half */
    const ls = []; for (let o = 0; o < px.length; o += 4 * 97) ls.push([px[o] * .3 + px[o + 1] * .59 + px[o + 2] * .11, o]);
    ls.sort((a, b) => a[0] - b[0]); const go = ls[ls.length >> 2][1];
    const ground = `rgb(${px[go]},${px[go + 1]},${px[go + 2]})`;
    const groundL = ls[ls.length >> 2][0];

    const runs = new Map();            // "colour|width|dot" → [path strings]
    const qc = v => Math.min(255, Math.round(v / 12) * 12);
    const lines = scene.contourExport();
    const f = v => v.toFixed(1);
    function simplify(P, eps) {        // Ramer–Douglas–Peucker
      if (P.length < 3) return P;
      const [a, b] = [P[0], P[P.length - 1]]; let dm = 0, im = 0;
      for (let i = 1; i < P.length - 1; i++) {
        const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
        const d = Math.abs(dy * P[i][0] - dx * P[i][1] + b[0] * a[1] - b[1] * a[0]) / L;
        if (d > dm) { dm = d; im = i; }
      }
      return dm > eps ? simplify(P.slice(0, im + 1), eps).slice(0, -1).concat(simplify(P.slice(im), eps)) : [a, b];
    }
    let kept = 0;
    for (const L of lines) {
      const P = L.closed ? L.pts.concat([L.pts[0]]) : L.pts;
      let run = [], acc = [0, 0, 0], an = 0;
      const flush = () => {
        if (run.length > 1 && an) {
          const col = `#${acc.map(v => qc(v / an).toString(16).padStart(2, '0')).join('')}`;
          const wd = Math.max(.5, Math.round(L.w * 4) / 4);
          const key = col + '|' + wd + '|' + (L.dot ? 1 : 0);
          const s = simplify(run, .45);
          (runs.get(key) || runs.set(key, []).get(key)).push('M' + s.map(p => f(p[0]) + ' ' + f(p[1])).join('L'));
          kept += s.length;
        }
        run = []; acc = [0, 0, 0]; an = 0;
      };
      for (const p of P) {
        const on = !p[3] && p[2] < 1 && p[0] > -20 && p[0] < W + 20 && p[1] > -20 && p[1] < H + 20;
        const s = on ? look(p[0], p[1]) : { l: 0 };
        if (on && s.l > groundL + 14) { run.push(p); acc[0] += s.col[0]; acc[1] += s.col[1]; acc[2] += s.col[2]; an++;
          if (run.length >= 24) { const last = run[run.length - 1]; flush(); run.push(last); } }
        else flush();
      }
      flush();
    }
    let body = '';
    for (const [key, ds] of runs) {
      const [col, wd, dot] = key.split('|');
      body += `<path stroke="${col}" stroke-width="${wd}"${dot === '1' ? ` stroke-dasharray="${f(wd * 1.2)} ${f(wd * 2.6)}"` : ''} d="${ds.join('')}"/>`;
    }
    const out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">` +
      `<rect width="${W}" height="${H}" fill="${ground}"/><g fill="none" stroke-linecap="round" stroke-linejoin="round">${body}</g></svg>`;
    await put('hero-mountain-m.svg', new Blob([out], { type: 'image/svg+xml' }));
    await put('svgref.png', await png());
    return { kb: Math.round(out.length / 1024), groups: runs.size, points: kept, ground };
  };
  await wait(1500);
  log.textContent = 'ready'; window.__ready = true;
</script>
</body>
</html>
