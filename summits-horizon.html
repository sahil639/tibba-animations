<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our summits — Horizon</title>
<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/site.css">

<link rel="stylesheet" href="assets/work.css">

<style>
/* ══════════════════════════════════════════════════════════════════════════
   Our summits — 3 · Horizon (the range, minimised)
   ─────────────────────────────────────────────────────────────────────────
   The work leads; the mountain is an instrument. The section pins: the
   project's words on the left, its work on the right — a tall box with the
   shared Rive file (assets/rive/) and two images — and along the foot, in
   a small framed strip, the whole range in miniature, seen from the front.
   The strip is the navigator: the summit in focus is lit and its trail
   drawn, a bar per project under it fills as the scroll steps through,
   and a summit's mark, or its bar, goes straight to that project.

   Unlike Base Camp (the range wide across the foot of stacking cards) this
   is one screen whose contents change, and the range is a quarter of it.

   Phones: words, then the work, the strip pinned at the foot.
   ═════════════════════════════════════════════════════════════════════════ */
#scope { position: relative; height: 400vh; }
#stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); grid-template-rows: 1fr auto; column-gap: clamp(28px, 5vw, 96px);
  padding: clamp(84px, 11vh, 120px) var(--gut) clamp(18px, 3vh, 30px); }
.hz-words { align-self: center; display: flex; flex-direction: column; gap: clamp(16px, 2.6vh, 30px); align-items: flex-start; }
.hz-words .sl-tags { margin-top: 6px; }
.hz-work { position: relative; align-self: stretch; min-height: 0; }
.hz-work > div { position: absolute; inset: 0; display: grid; grid-template-columns: .9fr 1fr; grid-template-rows: 1fr 1fr; gap: clamp(10px, 1vw, 16px);
  transition: opacity .45s ease, translate .6s cubic-bezier(.22,1,.36,1); }
.hz-work > div:not(.on) { opacity: 0; translate: 0 14px; pointer-events: none; }
.hz-work .sl-rive { grid-row: 1 / span 2; }

/* the instrument: the range in miniature */
.hz-strip { grid-column: 1 / -1; justify-self: center; width: min(48vw, 760px); margin-top: clamp(16px, 2.6vh, 28px); position: relative;
  border: 1px solid rgba(233,236,242,.14); background: linear-gradient(#0a0b0d, #050506); padding: 0 clamp(14px, 1.6vw, 24px) clamp(12px, 1.8vh, 18px); }
.hz-strip #range { height: clamp(96px, 15vh, 150px); margin: 0 calc(-1 * clamp(14px, 1.6vw, 24px)); }
.hz-strip .meta { position: absolute; z-index: 3; left: 12px; right: 12px; top: 9px; display: flex; justify-content: space-between; pointer-events: none;
  font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: rgba(233,236,242,.45); font-variant-numeric: tabular-nums; }
.hz-strip .meta b { color: var(--c); font-weight: 400; }
.hz-strip .sl-tabs button { font-size: clamp(10px, .85vw, 13px); }
.hz-strip .sl-tabs button::before { height: 2px; margin-bottom: 10px; }
.hz-head { position: absolute; left: var(--gut); top: clamp(52px, 7vh, 80px); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }

@media (max-width: 900px) {
  #stage { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; padding: 96px var(--gut) 12px; row-gap: 14px; }
  .hz-head { top: 66px; }
  .hz-words { align-self: start; gap: 10px; }
  .hz-words .sl-title { font-size: clamp(22px, 6vw, 30px); }
  .hz-words .sl-body { display: none; }
  .hz-words .sl-tags { font-size: 10px; }
  .hz-words .sl-cta { padding: 11px 16px; font-size: 11px; }
  .hz-strip { width: 100%; margin-top: 0; }
  .hz-strip .sl-tabs button { font-size: 9.5px; letter-spacing: .02em; }
}
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>
<body>
<div id="scope">
  <div id="stage">
    <p class="hz-head">[ &nbsp;Our summits&nbsp; ]</p>
    <div class="hz-words sl-swap" id="words"></div>
    <div class="hz-work" id="work"></div>
    <div class="hz-strip">
      <div class="meta"><span id="hz-name"></span><span id="hz-alt"></span></div>
      <div id="range"></div>
      <nav class="sl-tabs" id="tabs" aria-label="Projects"></nav>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.min.js"}}</script>
<script type="module">
  import { S, N, clamp, pad, mountRange, tags, cta, riveBox, armRive, box, links, swap, pinned } from './assets/summits-layouts.js';
  const scope = document.getElementById('scope'), stage = document.getElementById('stage'), words = document.getElementById('words'),
        work = document.getElementById('work'), tabsEl = document.getElementById('tabs');
  const P = pinned(scope);
  /* every project's work is laid out once; the one in focus is shown */
  work.innerHTML = S.map((s, i) => `<div style="--c:${s.colour}">${riveBox(s, 0)}${box(s, 1)}${box(s, 2)}</div>`).join('');
  const sets = [...work.children];
  sets.forEach((el, i) => armRive(el, i));
  tabsEl.innerHTML = S.map(s => `<button type="button" style="--c:${s.colour}">${s.client.replace(' & Mindhouse', '')}</button>`).join('');
  const tabs = [...tabsEl.children];
  links(stage);

  let shown = -1;
  const wordsOf = s => `<h3 class="sl-title">${s.title}</h3>${tags(s)}<p class="sl-body">${s.body}</p>${cta(s)}`;
  function show(i) {
    if (i === shown) return;
    const s = S[i], first = shown < 0; shown = i;
    stage.style.setProperty('--c', s.colour);
    document.getElementById('hz-name').innerHTML = `<b>${pad(i)}</b> / ${pad(N - 1)} · ${s.client}`;
    document.getElementById('hz-alt').textContent = `Alt ${s.alt} m`;
    if (first) words.innerHTML = wordsOf(s); else swap(words, wordsOf(s));
    sets.forEach((el, k) => el.classList.toggle('on', k === i));
    tabs.forEach((b, k) => b.classList.toggle('on', k === i));
  }
  const range = mountRange(document.getElementById('range'), { focus: P.focus, frame: 'range', mini: true,
    view: { dist: .62, elev: 12, follow: .2, aimY: .28 }, onPick: P.jump, onCase: i => show(i) });
  tabs.forEach((b, i) => b.addEventListener('click', () => P.jump(i)));

  let raf = 0;
  const frame = () => { raf = 0; const f = P.focus(); tabs.forEach((b, i) => b.style.setProperty('--f', clamp(f - i + 1, 0, 1).toFixed(3))); };
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(frame); }, { passive: true });
  frame();
  window.tibba = range;
</script>
</body>
</html>
