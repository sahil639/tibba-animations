<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About us — team</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/workbench.css">
<script src="assets/manifest.js"></script>
<script src="assets/whats-new.js"></script>
<script src="assets/workbench.js" defer></script>


<style>
/* ══════════════════════════════════════════════════════════════════════════
   About us — team, as Metrics plates
   ─────────────────────────────────────────────────────────────────────────
   Each member on a plate set the way the Metrics section sets its numbers:
   glass and a hairline, the four sharing edges in a row, corner brackets,
   an index row, and the orange cube in the corner. Behind each person a
   contour field drifts — every card its own ground (assets/card-topo.js),
   each with its own settings on the panel. The mountains are gone.

   The plates open as the metric boxes do, once, the first time the row
   comes into view. On hover the portrait still dissolves into a one-bit
   ordered dither, and the contours behind come up a little.

   Every value: TEAM_CONFIG in the script, on the panel, and bakeable.
   ═════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: var(--ink-warm); font-family: 'F37 Analog', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.team { padding: clamp(80px, 14vh, 150px) var(--gut) clamp(80px, 12vh, 140px); max-width: 1600px; margin: 0 auto; }
.head .eyebrow { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.head .eyebrow::before { content: ''; width: 7px; height: 7px; background: var(--accent); }
.head h2 { margin-top: 16px; color: #fff; font-weight: 300; font-size: clamp(30px, 3.6vw, 60px); line-height: 1.04; letter-spacing: -.035em; max-width: 18ch; }
.head p { margin-top: 18px; max-width: 52ch; color: var(--ink-mute); font-size: clamp(14px, 1.05vw, 16px); line-height: 1.7; }

.people { margin-top: clamp(40px, 7vh, 80px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.member { position: relative; margin-left: -1px; outline: none; cursor: default; display: flex; flex-direction: column; }
.member:first-child { margin-left: 0; }
.member .plate { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.16); background: rgba(10,10,12,.78); clip-path: inset(50% 0 50% 0); transition: border-color .4s linear; }
.member.hot .plate, .member:focus-visible .plate { border-color: rgba(255,75,31,.5); z-index: 1; }
.member .hl { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--accent); transform: scaleX(0); opacity: 0; pointer-events: none; z-index: 2; }
.member .cn { position: absolute; width: 10px; height: 10px; border-color: #fff; border-style: solid; opacity: 0; z-index: 2; }
.member .cn.tl { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
.member .cn.tr { right: -1px; top: -1px; border-width: 1px 1px 0 0; }
.member .cn.bl { left: -1px; bottom: -1px; border-width: 0 0 1px 1px; }
.member .cn.br { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
.member .pin { position: absolute; right: -1px; top: -1px; width: 8px; height: 8px; background: var(--accent); transform: scale(0); z-index: 3; }
.member .in { position: relative; z-index: 1; display: flex; flex-direction: column; padding: clamp(14px, 1.4vw, 22px) clamp(14px, 1.5vw, 24px) clamp(16px, 1.6vw, 24px); }
.member .k { display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); opacity: 0; }
.member .k b { color: var(--accent); font-weight: 400; }
/* the window the person stands in, over their own contours */
.member .scene { position: relative; margin-top: 14px; aspect-ratio: 4 / 5; overflow: hidden; opacity: 0; }
.member .scene::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(10,10,12,0) 55%, rgba(10,10,12,.85) 100%); }
.who { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--ph) * 100%); z-index: 1; }
.who img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; user-select: none; }
.who canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.member .name { margin-top: 16px; color: #fff; font-weight: 300; font-size: clamp(20px, 1.7vw, 30px); line-height: 1; letter-spacing: -.03em; opacity: 0; }
.member .role { margin-top: 8px; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-mute); opacity: 0; }
@media (max-width: 900px) {
  .people { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .member:nth-child(odd) { margin-left: 0; } .member:nth-child(n+3) { margin-top: -1px; }
}
@media (prefers-reduced-motion: reduce) { .member .plate { clip-path: none; } .member .k, .member .scene, .member .name, .member .role { opacity: 1; } .member .pin { transform: none; } }
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>
<body>

<section class="team" aria-labelledby="team-h">
  <div class="head">
    <p class="eyebrow">Our team</p>
    <h2 id="team-h">The people, and the ones beside them</h2>
    <p>In addition to our team, we work with a number of collaborators and advisors,
       depending on the needs of a project.</p>
  </div>
  <div class="people" id="people"></div>
</section>
<div style="height: 20vh"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="assets/card-topo.js"></script>
<script type="module">
  import { applyBaked, bakeControls } from './assets/bake.js';
  import { topoPanel } from './assets/topo-panel.js';

  /* ══ TEAM_CONFIG ═════════════════════════════════════════════════════ */
  const TEAM_CONFIG = {
    person: { height: 0.92 },                  // portrait height, fraction of the window it stands in
    entrance: { duration: 1.1, stagger: 0.14, ease: 'power1.inOut' },   // as Metrics' open — plays once
    hoverLift: 1.6,                            // the contours' strength on hover, × their resting opacity
    dither: {
      intensity: 1,        // 0 = none, 1 = the whole portrait goes one-bit
      cell: 2,             // px per dither dot
      duration: 0.55,      // s for the dissolve, in and out
      contrast: 1.25,      // tone curve before dithering
      ink: '#E8E3DC',      // the lit dots
      ground: '#34322e',   // the unlit dots
    },
    /* one contour field per member — see assets/card-topo.js */
    topo: [
      { on: true, pattern: 'peak',  seed: 3,  speed: 0.4,  levels: 12, scale: 1,   opacity: 0.5, width: 1, colour: '#FF4B1F', tint: 0.3 },
      { on: true, pattern: 'ridge', seed: 7,  speed: 0.35, levels: 11, scale: 1.1, opacity: 0.5, width: 1, colour: '#7B8FF5', tint: 0.35 },
      { on: true, pattern: 'twin',  seed: 11, speed: 0.45, levels: 12, scale: 1,   opacity: 0.5, width: 1, colour: '#4DD9C0', tint: 0.3 },
      { on: true, pattern: 'basin', seed: 17, speed: 0.3,  levels: 10, scale: 1.2, opacity: 0.5, width: 1, colour: '#E05555', tint: 0.3 },
    ],
  };
  const TEAM = [
    { name: 'Rahul Beniwal',  role: 'Founder, designer', img: 'assets/people/rahul.png' },
    { name: 'Neel Lakhwani',  role: 'Designer',          img: 'assets/people/neel.png' },
    { name: 'Riya Pandey',    role: 'Designer',          img: 'assets/people/riya.png' },
    { name: 'Sahil Pednekar', role: 'Designer',          img: 'assets/people/sahil.png' },
  ];
  const C = TEAM_CONFIG;
  const BAKE_KEY = 'tibba.bake.about-team';
  applyBaked(BAKE_KEY, C);
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const host = document.getElementById('people');
  const pad = i => String(i + 1).padStart(2, '0');

  host.innerHTML = TEAM.map((m, i) => `
    <article class="member" data-i="${i}" tabindex="0">
      <div class="plate" aria-hidden="true"></div>
      <span class="hl"></span><span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span><span class="pin"></span>
      <div class="in">
        <p class="k"><b>${pad(i)} / ${pad(TEAM.length - 1)}</b><span>Team</span></p>
        <div class="scene"><div class="who"><img src="${m.img}" alt="${m.name}" draggable="false"><canvas></canvas></div></div>
        <p class="name">${m.name}</p>
        <p class="role">${m.role}</p>
      </div>
    </article>`).join('');
  const cards = [...host.querySelectorAll('.member')];
  const topos = cards.map((c, i) => CardTopo.attach(c.querySelector('.scene'), Object.assign({}, C.topo[i])));
  const syncTopo = i => { Object.assign(topos[i].settings, C.topo[i], { opacity: C.topo[i].opacity * (cards[i].classList.contains('hot') ? C.hoverLift : 1) }); topos[i].reseed(); };
  function layout() { cards.forEach(card => card.style.setProperty('--ph', C.person.height)); }
  layout();

  /* ── the dither ─────────────────────────────────────────────────────────
     Each portrait is dithered once, into a grid of on/off cells, from its
     own luminance and alpha. The overlay canvas then shows, per cell, the
     dithered dot wherever the dissolve has reached it — and the dissolve's
     threshold walks through the same Bayer matrix, so cells flip in the
     ordered pattern rather than as a fade. */
  const BAYER = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,
                 3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map(v => (v + 0.5) / 64);
  const bayer = (x, y) => BAYER[(y & 7) * 8 + (x & 7)];
  const state = cards.map(() => ({ p: 0, target: 0, raf: 0, grid: null }));

  function prepare(i) {
    const card = cards[i], img = card.querySelector('img'), cv = card.querySelector('.who canvas');
    const r = img.getBoundingClientRect();
    if (!r.width || !img.naturalWidth) return;
    const cell = Math.max(1, C.dither.cell), dpr = Math.min(2, devicePixelRatio || 1);
    const cw = Math.ceil(r.width / cell), ch = Math.ceil(r.height / cell);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    const tmp = document.createElement('canvas'); tmp.width = cw; tmp.height = ch;
    const g = tmp.getContext('2d', { willReadFrequently: true });
    /* object-fit: contain, bottom-centred — as the <img> is drawn */
    const k = Math.min(cw / img.naturalWidth, ch / img.naturalHeight);
    const dw = img.naturalWidth * k, dh = img.naturalHeight * k;
    g.drawImage(img, (cw - dw) / 2, ch - dh, dw, dh);
    const d = g.getImageData(0, 0, cw, ch).data;
    const grid = new Int8Array(cw * ch);                  // -1 empty · 0 unlit · 1 lit
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const o = (y * cw + x) * 4;
      if (d[o + 3] < 90) { grid[y * cw + x] = -1; continue; }
      let L = (0.2126 * d[o] + 0.7152 * d[o + 1] + 0.0722 * d[o + 2]) / 255;
      L = Math.min(1, Math.max(0, (L - 0.5) * C.dither.contrast + 0.5));
      grid[y * cw + x] = L > bayer(x, y) ? 1 : 0;
    }
    state[i].grid = { grid, cw, ch, cell: cell * dpr };
    draw(i);
  }
  function draw(i) {
    const S = state[i], G = S.grid; if (!G) return;
    const cv = cards[i].querySelector('.who canvas'), g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    const reach = S.p * C.dither.intensity;
    if (reach <= 0) return;
    const ink = C.dither.ink, ground = C.dither.ground;
    for (let y = 0; y < G.ch; y++) for (let x = 0; x < G.cw; x++) {
      const v = G.grid[y * G.cw + x];
      if (v < 0 || bayer(x + 3, y + 5) > reach) continue;
      g.fillStyle = v ? ink : ground;
      g.fillRect(x * G.cell, y * G.cell, Math.ceil(G.cell), Math.ceil(G.cell));
    }
  }
  function animate(i) {
    const S = state[i];
    cancelAnimationFrame(S.raf);
    let last = performance.now();
    const step = now => {
      const dt = (now - last) / 1000; last = now;
      const rate = REDUCED ? 1e9 : 1 / Math.max(0.05, C.dither.duration);
      S.p = S.target > S.p ? Math.min(S.target, S.p + dt * rate) : Math.max(S.target, S.p - dt * rate);
      draw(i);
      if (S.p !== S.target) S.raf = requestAnimationFrame(step);
    };
    S.raf = requestAnimationFrame(step);
  }
  cards.forEach((card, i) => {
    const on = v => {
      card.classList.toggle('hot', v); state[i].target = v ? 1 : 0; animate(i);
      /* the ground comes up a little under the pointer */
      gsap.to(topos[i].settings, { opacity: C.topo[i].opacity * (v ? C.hoverLift : 1), duration: .5, ease: 'power2.out' });
    };
    card.addEventListener('pointerenter', () => on(true));
    card.addEventListener('pointerleave', () => on(false));
    card.addEventListener('focus', () => on(true));
    card.addEventListener('blur', () => on(false));
    const img = card.querySelector('img');
    if (img.complete) prepare(i); else img.addEventListener('load', () => prepare(i));
  });
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => cards.forEach((_, i) => prepare(i)), 150); });

  /* ── the open: Metrics' sequence, once ─────────────────────────────── */
  let tl;
  function build() {
    if (tl) tl.kill();
    tl = gsap.timeline({ paused: true });
    cards.forEach((card, i) => {
      const q = s => card.querySelectorAll(s), o = i * C.entrance.stagger / C.entrance.duration;
      const sx = [-8, 8, -8, 8], sy = [-8, -8, 8, 8];
      tl.fromTo(q('.hl'), { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: .28, ease: 'power3.inOut' }, o)
        .fromTo(q('.plate'), { clipPath: 'inset(50% 0% 50% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: .34, ease: 'power3.inOut' }, o + .24)
        .to(q('.hl'), { opacity: 0, duration: .16, ease: 'none' }, o + .52)
        .fromTo(q('.cn'), { opacity: 0, x: k => sx[k], y: k => sy[k] }, { opacity: .9, x: 0, y: 0, duration: .22, ease: 'expo.out' }, o + .52)
        .fromTo(q('.k'), { opacity: 0 }, { opacity: 1, duration: .2, ease: 'none' }, o + .6)
        .fromTo(q('.scene'), { opacity: 0 }, { opacity: 1, duration: .3, ease: 'none' }, o + .6)
        .fromTo(q('.name'), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .24, ease: 'power2.out' }, o + .68)
        .fromTo(q('.role'), { opacity: 0 }, { opacity: 1, duration: .2, ease: 'none' }, o + .76)
        .fromTo(q('.pin'), { scale: 0 }, { scale: 1, duration: .1, ease: 'none' }, o + .9);
    });
  }
  const play = () => { build(); gsap.to(tl, { progress: 1, duration: REDUCED ? 0.01 : tl.duration() * C.entrance.duration, ease: C.entrance.ease }); };
  build();
  if (REDUCED) tl.progress(1);
  else new IntersectionObserver(([e], io) => { if (e.isIntersecting) { io.disconnect(); play(); } }, { threshold: 0.25 }).observe(host);

  /* ── the panel ─────────────────────────────────────────────────────── */
  const el = document.createElement('div');
  el.id = 'tune';
  const R = (id, label, min, max, step, val, unit = '') => `<div class="row"><label>${label}<i id="v-${id}">${val}${unit}</i></label><input type="range" id="s-${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></div>`;
  const tp = topoPanel({ names: TEAM.map(m => m.name.split(' ')[0]), list: C.topo, onChange: syncTopo });
  el.innerHTML = `
    <div id="tune-head"><b>Team</b><button id="tune-hide" title="Hide (H)">–</button></div>
    <p class="tune-sub">Entrance (plays once)</p>
    ${R('ed', 'Duration', .3, 3, .05, C.entrance.duration, 's')}
    ${R('es', 'Stagger', 0, .8, .02, C.entrance.stagger, 's')}
    <div class="row inline"><label>Entrance<i></i></label><button class="tune-btn" id="s-rp">Replay</button></div>
    ${tp.html}
    ${R('hl', 'Contours on hover', 1, 3, .05, C.hoverLift, '×')}
    <p class="tune-sub">Portrait</p>
    ${R('ph', 'Height', .5, 1, .01, C.person.height)}
    <p class="tune-sub">Dither on hover</p>
    ${R('di', 'Intensity', 0, 1, .01, C.dither.intensity)}
    ${R('dc', 'Dot size', 1, 8, 1, C.dither.cell, 'px')}
    ${R('dd', 'Duration', .05, 2, .05, C.dither.duration, 's')}
    ${R('dk', 'Contrast', .5, 2.5, .05, C.dither.contrast)}
    ${bakeControls.html}`;
  document.body.appendChild(el);
  const q = id => el.querySelector('#' + id);
  const bind = (id, fn) => q('s-' + id).addEventListener('input', e => { const v = +e.target.value; q('v-' + id).textContent = v + e.target.dataset.unit; fn(v); });
  bind('ed', v => { C.entrance.duration = v; }); bind('es', v => { C.entrance.stagger = v; });
  q('s-rp').addEventListener('click', play);
  tp.bind(el);
  bind('hl', v => { C.hoverLift = v; });
  bind('ph', v => { C.person.height = v; layout(); requestAnimationFrame(() => cards.forEach((_, i) => prepare(i))); });
  bind('di', v => { C.dither.intensity = v; cards.forEach((_, i) => draw(i)); });
  bind('dc', v => { C.dither.cell = v; cards.forEach((_, i) => prepare(i)); });
  bind('dd', v => { C.dither.duration = v; });
  bind('dk', v => { C.dither.contrast = v; cards.forEach((_, i) => prepare(i)); });
  bakeControls.bind(el, BAKE_KEY, C, 'TEAM_CONFIG');
  q('tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
  if (window.wb && window.wb.adopt) window.wb.adopt();
  window.tibba = { CONFIG: C, preview: i => { state[i].target = 1; cards[i].classList.add('hot'); animate(i); } };
</script>

</body>
</html>
