<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campfire — contour</title>
<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/workbench.css">
<script src="assets/manifest.js"></script>
<script src="notes.js"></script>
<script src="assets/workbench.js" defer></script>
<style>
body { background: var(--bg); color: var(--ink-warm); font-family: 'F37 Analog', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.lead { min-height: 40vh; display: flex; align-items: flex-end; max-width: var(--max); margin: 0 auto; padding: 0 var(--gut) 40px; }
.lead p { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); }

/* the section is built to drop into about.html unchanged — same id pattern,
   same fades, same copy block as the lit campfire */
#campfire-contour {
  position: relative; height: 100vh; height: 100svh; min-height: 560px;
  border-top: 1px solid var(--line-soft); overflow: hidden; cursor: crosshair;
}
#campfire-contour canvas {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  opacity: 0; transition: opacity 1.6s var(--ease);
}
#campfire-contour.is-lit canvas { opacity: 1; }
#campfire-contour::before, #campfire-contour::after {
  content: ''; position: absolute; left: 0; right: 0; height: 22%; z-index: 1; pointer-events: none;
}
#campfire-contour::before { top: 0; background: linear-gradient(var(--bg), rgba(22,22,23,0)); }
#campfire-contour::after  { bottom: 0; background: linear-gradient(rgba(22,22,23,0), var(--bg)); }
#campfire-contour .cf-copy { position: absolute; z-index: 2; left: 0; right: 0; top: clamp(70px, 12vh, 130px); text-align: center; pointer-events: none; }
#campfire-contour .cf-copy .eyebrow { color: var(--ink-faint); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
#campfire-contour .cf-copy h2 { margin-top: 14px; font-size: clamp(24px, 3vw, 44px); font-weight: 400; letter-spacing: -.025em; color: var(--ink); }
#campfire-contour .cf-hint { position: absolute; z-index: 2; left: 0; right: 0; bottom: clamp(40px, 7vh, 70px); text-align: center;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); pointer-events: none; transition: opacity .8s var(--ease); }
#campfire-contour.touched .cf-hint { opacity: 0; }
.after { height: 30vh; }
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>
<body>

<!-- ─────────────────────────────────────────────────────────────────────────
     Campfire — contour

     The About page's campfire, drawn in the hero's language: contour rings
     for the stones and logs, live contour lines for the fire, dotted ground
     and smoke, orange embers. Behaviour: assets/campfire-contour.js.
     ───────────────────────────────────────────────────────────────────── -->

<div class="lead"><p>About us — campfire, contour version</p></div>

<section id="campfire-contour" aria-label="An animated campfire, drawn in contour lines">
  <canvas aria-hidden="true"></canvas>
  <div class="cf-copy">
    <p class="eyebrow">[ &nbsp;Around the fire&nbsp; ]</p>
    <h2>Where every climb ends</h2>
  </div>
  <p class="cf-hint">Move your cursor near the flames</p>
</section>

<div class="after"></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
  import { mountContourFire, K } from './assets/campfire-contour.js';
  const sec = document.querySelector('#campfire-contour');
  const fire = mountContourFire(sec, sec.querySelector('canvas'));
  window.tibbaContourFire = fire;
  sec.addEventListener('pointermove', () => sec.classList.add('touched'), { once: true });

  /* ── the panel ────────────────────────────────────────────────────────
     One group per animation, each led by its own on/off switch, then the
     dials that only matter while it is on. Built from a table so every
     control is a real, labelled input — keyboard and screen reader get the
     same panel the mouse does. */
  const toggle = (key, label) => ({ t: 'toggle', key, label });
  const range = (key, label, min, max, step = 0.01, fmt = v => v.toFixed(2)) => ({ t: 'range', key, label, min, max, step, fmt });
  const GROUPS = [
    ['All animation', [
      toggle('paused', 'Pause everything'),
      range('speed', 'Overall speed', 0, 2),
    ]],
    ['Fire', [
      toggle('fireOn', 'Fire'),
      range('size', 'Size', 0.5, 1.5),
      range('fireSpeed', 'Speed', 0, 2),
      range('levels', 'Flame lines', 2, 7, 1, v => String(v)),
      toggle('flicker', 'Flicker'),
    ]],
    ['Embers', [
      toggle('embersOn', 'Embers'),
      range('embers', 'Amount', 0, 1),
      range('emberSpeed', 'Speed', 0, 2),
    ]],
    ['Smoke', [
      toggle('smokeOn', 'Smoke'),
      range('smoke', 'Amount', 0, 1.5),
      range('smokeOpacity', 'Opacity', 0, 2),
      range('smokeSpeed', 'Rise speed', 0, 2),
      toggle('wisps', 'Contour wisps'),
    ]],
    ['Ground', [
      toggle('flowOn', 'Flowing lines'),
      range('flowSpeed', 'Flow speed', 0, 3),
    ]],
    ['Rocks', [
      { t: 'seg', key: 'randomness', label: 'Randomness', options: [['Low', 0.12], ['Medium', 0.5], ['High', 0.9]] },
      range('randomness', 'Randomness (fine)', 0, 1),
      range('rocks', 'Rocks', 6, 14, 1, v => String(v)),
      { t: 'button', label: 'New arrangement', text: 'Reshuffle', run: () => fire.reshuffle() },
    ]],
    ['Cursor', [
      toggle('cursorOn', 'React to cursor'),
      range('push', 'Push away', 0, 2),
      range('wind', 'Wind from movement', 0, 2),
      range('ease', 'Smoothness', 0.1, 1.2, 0.01, v => v.toFixed(2) + 's'),
    ]],
    ['Lines', [
      range('weight', 'Line weight', 0.4, 2.5),
      { t: 'button', label: 'Light it again', text: 'Relight', run: () => fire.relight() },
    ]],
  ];

  /* which settings need the rocks rebuilt (slicing is not free, so it waits
     for the slider to settle) */
  const REBUILD = new Set(['randomness', 'rocks']);
  let rebuildTimer = 0;
  const changed = key => {
    if (!REBUILD.has(key)) return;
    clearTimeout(rebuildTimer); rebuildTimer = setTimeout(() => fire.rebuildRocks(), 160);
  };

  const el = document.createElement('div');
  el.id = 'tune';
  let html = '<div id="tune-head"><b>Campfire — contour</b><button id="tune-hide" title="Hide (H)">–</button></div>';
  let uid = 0;
  for (const [title, rows] of GROUPS) {
    html += `<p class="tune-sub">${title}</p>`;
    for (const r of rows) {
      const id = 'c' + (uid++);
      if (r.t === 'toggle') html += `<div class="row inline"><label for="${id}">${r.label}<i></i></label><input type="checkbox" id="${id}" data-k="${r.key}" data-t="toggle" ${K[r.key] ? 'checked' : ''}></div>`;
      if (r.t === 'range') html += `<div class="row"><label for="${id}">${r.label}<i data-v="${r.key}">${r.fmt(K[r.key])}</i></label><input type="range" id="${id}" data-k="${r.key}" data-t="range" min="${r.min}" max="${r.max}" step="${r.step}" value="${K[r.key]}"></div>`;
      if (r.t === 'seg') html += `<div class="seg" role="group" aria-label="${r.label}" data-seg="${r.key}">${r.options.map(([l, v]) => `<button type="button" data-val="${v}" class="${Math.abs(K[r.key] - v) < .05 ? 'on' : ''}">${l}</button>`).join('')}</div>`;
      if (r.t === 'button') html += `<div class="row inline"><label>${r.label}<i></i></label><button type="button" class="tune-btn" data-btn="${id}">${r.text}</button></div>`;
      r.id = id;
    }
  }
  el.innerHTML = html;
  document.body.appendChild(el);

  const fmtOf = {}; GROUPS.forEach(([, rows]) => rows.forEach(r => { if (r.t === 'range') fmtOf[r.key] = r.fmt; }));
  const sync = key => {
    el.querySelectorAll(`[data-v="${key}"]`).forEach(n => n.textContent = fmtOf[key](K[key]));
    el.querySelectorAll(`input[data-k="${key}"]`).forEach(n => { if (n.type === 'range') n.value = K[key]; });
    el.querySelectorAll(`[data-seg="${key}"] button`).forEach(b => b.classList.toggle('on', Math.abs(K[key] - +b.dataset.val) < .05));
  };
  el.addEventListener('input', e => {
    const n = e.target, key = n.dataset.k; if (!key) return;
    K[key] = n.dataset.t === 'toggle' ? n.checked : +n.value;
    if (n.dataset.t === 'range') sync(key);
    changed(key);
  });
  el.addEventListener('change', e => {
    const n = e.target; if (n.dataset.t === 'toggle') K[n.dataset.k] = n.checked;
  });
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const seg = b.closest('[data-seg]');
    if (seg) { const key = seg.dataset.seg; K[key] = +b.dataset.val; sync(key); changed(key); return; }
    if (b.dataset.btn) GROUPS.forEach(([, rows]) => rows.forEach(r => { if (r.id === b.dataset.btn) r.run(); }));
  });

  el.querySelector('#tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
  if (window.wb && window.wb.adopt) window.wb.adopt();
</script>
</body>
</html>
