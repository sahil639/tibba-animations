<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our studio — polaroids</title>
<link rel="stylesheet" href="assets/type.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/workbench.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap">
<script src="assets/manifest.js"></script>
<script src="assets/whats-new.js"></script>
<script src="assets/workbench.js" defer></script>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Our studio — polaroids
   ─────────────────────────────────────────────────────────────────────────
   The team and the studio's life as a table of polaroids round a title in
   the middle of the screen: white frame, the deep bottom margin, a line in
   handwriting. No tape; a soft shadow under each print; every print the
   same size.

     entrance  the first time the table is on screen, the prints fly in
               from the left and right edges — each from its nearer side —
               on a spring, staggered, and land exactly on their layout
     layout    authored, not random: every print's x, y and rotation live in
               POLAROID_CONFIG.cards (x/y as fractions of the table)
     hover     the print lifts and tilts toward the pointer
     drag      pick any print up and put it down; the move is written back
               into its layout entry, so a drag is an edit

   "Bake layout" on the panel freezes the current layout: it is saved in
   this browser (localStorage) and loaded instead of the defaults, and the
   same values are copied to the clipboard to paste over POLAROID_CONFIG
   as the new defaults. From then on the resting layout is plain data —
   it never depends on where an animation happened to stop.

   Six prints: the studio's own photos (assets/studio/team-*), the sixth a
   stand-in until its photo arrives.
   ═════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: var(--ink-warm); font-family: 'F37 Analog', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
.table { position: relative; width: 100vw; height: 100vh; height: 100svh; overflow: hidden;
  background: #000; }   /* black, as every other section */
.title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 1; }
.title .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.title h1 { margin-top: 14px; color: #fff; font-weight: 400; font-size: clamp(34px, 5vw, 80px); line-height: .96; letter-spacing: -.04em; }
.title p { margin: 16px auto 0; max-width: 34ch; color: var(--ink-mute); font-size: 13.5px; line-height: 1.6; }
.title .hint { margin-top: 18px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); }

.pol { --r: 0deg; --tx: 0deg; --ty: 0deg; --lift: 0;
  position: absolute; left: 0; top: 0; width: var(--w, 190px); touch-action: none; cursor: grab; z-index: 2;
  transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)); will-change: transform; perspective: 900px; }
.pol.drag { cursor: grabbing; }
/* the shadow: one soft drop (--sh-*, from POLAROID_CONFIG.shadow) that
   lengthens as the print lifts, over a hairline contact shadow */
.pol .card { background: #f4f2ec; padding: 9px 9px 0; border-radius: 2px;
  transform: rotateX(var(--tx)) rotateY(var(--ty)) translateZ(calc(var(--lift) * 24px)) scale(calc(1 + var(--lift) * .03));
  box-shadow: 0 calc(var(--sh-y, 8px) + var(--lift) * 12px) calc(var(--sh-blur, 22px) + var(--lift) * 18px) rgba(0,0,0,calc(var(--sh-a, .26) + var(--lift) * .12)),
              0 1px 2px rgba(0,0,0,.25);
  transition: box-shadow .25s ease; transform-style: preserve-3d; }
.pol.sel .card { outline: 1px dashed rgba(255,75,31,.7); outline-offset: 5px; }
.pol .ph { position: relative; aspect-ratio: 1; overflow: hidden; background: #1a1a1c; }
.pol .ph img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; filter: saturate(.9) contrast(1.03); }
.pol .ph.person { background: radial-gradient(120% 90% at 50% 30%, #d8d2c8 0%, #b9b2a6 70%, #a39b8e 100%); }
.pol .ph.person img { object-position: 50% 12%; filter: saturate(.92) contrast(1.02); }
.pol .ph svg { width: 100%; height: 100%; display: block; }
.pol .ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.1), rgba(255,255,255,0) 40%); pointer-events: none; }
.pol .note { height: 52px; display: flex; align-items: center; padding: 0 4px; font-family: 'Caveat', 'Segoe Print', cursive; color: #232220; }
.pol .note b { font-weight: 500; font-size: 22px; line-height: 1; outline: none; }
.pol .note b[contenteditable="true"] { background: rgba(255,75,31,.12); }

.reset { position: absolute; right: var(--gut); bottom: 22px; z-index: 50; padding: 9px 12px; border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.4);
  color: var(--ink-warm); font: 10.5px/1 'F37 Analog', system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
.reset:hover { border-color: rgba(255,255,255,.4); }
@media (max-width: 760px) { .pol .note { height: 44px; } .pol .note b { font-size: 19px; } }
/* ── mobile: one messy stack, swiped through ─────────────────────────── */
body.stacked .title { top: clamp(64px, 11vh, 110px); transform: translateX(-50%); width: calc(100% - 32px); }
body.stacked .title h1 { font-size: 40px; }
body.stacked .title p { font-size: 13px; }
body.stacked .pol { cursor: grab; transition: none; }
body.stacked .pol.sel .card { outline: none; }
body.stacked .pol .card { transition: box-shadow .3s ease; }
body.stacked .reset { display: none; }
.dots { display: none; }
body.stacked .dots { position: absolute; z-index: 60; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 6px; }
body.stacked .dots i { width: 5px; height: 5px; background: rgba(255,255,255,.25); transition: background .3s linear, transform .3s ease; }
body.stacked .dots i.on { background: var(--accent); transform: scale(1.4); }
@media (prefers-reduced-motion: reduce) { .pol .card { transform: none !important; } }
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>
<body>
<main class="table" id="table">
  <div class="title">
    <p class="eyebrow">[ &nbsp;Our studio&nbsp; ]</p>
    <h1>Team Tibba</h1>
    <p>A lean design team based out of India, and the places we go to think.</p>
    <p class="hint" id="hint">Drag the photos around</p>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button class="reset" id="reset" type="button">Replay entrance</button>
</main>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   POLAROID_CONFIG — size, shadow, spring and the layout itself
   ═════════════════════════════════════════════════════════════════════════ */
const POLAROID_CONFIG = {
  scale: 1,              // one scale for every print
  baseWidth: 210,        // px width of a print at scale 1 on a 1440px-wide table
  shadow: { y: 8, blur: 22, opacity: 0.26 },
  /* the entrance: a damped spring per print. stiffness pulls it home,
     damping bleeds the bounce (critical ≈ 2·√stiffness — lower is springier) */
  spring: { stiffness: 120, damping: 14, stagger: 0.07, travel: 120, spin: 18 },
  /* one title per print, in order — edit on the panel, or double-click a caption */
  titles: ['On the ridge', 'Crit hour', 'Speaking at VizChitra', 'Home base', 'After the launch', 'Next climb'],
  /* mobile: the stack, and the swipe that cycles it */
  stack: { spring: 170, damping: 22, threshold: 0.26, spread: 1, tilt: 1 },
  /* x, y: the print's top-left as a fraction of the table; r: degrees */
  cards: [
    { x: 0.07, y: 0.07, r: -5 },
    { x: 0.42, y: 0.04, r: 3 },
    { x: 0.78, y: 0.08, r: -3 },
    { x: 0.06, y: 0.56, r: 4 },
    { x: 0.43, y: 0.66, r: -2 },
    { x: 0.79, y: 0.57, r: 5 },
  ],
};
const BAKE_KEY = 'tibba.polaroids.layout';

(function () {
  const C = POLAROID_CONFIG;
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* a baked layout, if this browser has one, wins over the defaults */
  try { const b = JSON.parse(localStorage.getItem(BAKE_KEY) || 'null'); if (b && b.cards && b.cards.length === C.cards.length) { Object.assign(C, b); } } catch {}
  if (!C.stack) C.stack = { spring: 170, damping: 22, threshold: 0.26, spread: 1, tilt: 1 };

  /* the studio's six photos (the sixth is a stand-in until it arrives) */
  const PICS = [
    { img: 'assets/studio/team-01-ridge.webp' }, { img: 'assets/studio/team-02-review.webp' },
    { img: 'assets/studio/team-03-talk.webp' }, { img: 'assets/studio/team-04-desk.webp' },
    { img: 'assets/studio/team-05-cheers.webp' }, { img: 'assets/studio/team-06-placeholder.svg' },
  ];
  const title = i => (C.titles && C.titles[i]) || '';
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const table = document.getElementById('table');
  let z = 10, selected = 0;

  const els = PICS.map((p, i) => {
    const el = document.createElement('figure');
    el.className = 'pol';
    el.dataset.i = i;
    el.innerHTML = `<div class="card">
      <div class="ph${p.person ? ' person' : ''}"><img src="${p.person || p.img}" alt="${esc(title(i))}"></div>
      <figcaption class="note"><b>${esc(title(i))}</b></figcaption></div>`;
    table.appendChild(el);
    return el;
  });

  /* ── size, shadow, and where each print rests ──────────────────────── */
  const width = () => {
    const W = table.clientWidth;
    if (document.body.classList.contains('stacked')) return Math.round(Math.min(W * 0.62, 300) * C.scale);
    return Math.round(C.baseWidth * C.scale * (W < 760 ? 0.66 : Math.min(1.15, Math.max(0.7, W / 1440))));
  };
  function applyLook() {
    const st = table.style;
    st.setProperty('--w', width() + 'px');
    st.setProperty('--sh-y', C.shadow.y + 'px');
    st.setProperty('--sh-blur', C.shadow.blur + 'px');
    st.setProperty('--sh-a', C.shadow.opacity);
  }
  /* the layout, held inside the table so a small window never crops a print */
  const home = i => {
    const W = table.clientWidth, H = table.clientHeight, c = C.cards[i], el = els[i];
    const w = el.offsetWidth || width(), h = el.offsetHeight || w * 1.4;
    return { x: Math.min(W - w - 8, Math.max(8, c.x * W)), y: Math.min(H - h - 8, Math.max(8, c.y * H)), r: c.r };
  };
  function put(el, x, y, r) {
    el._x = x; el._y = y;
    el.style.setProperty('--x', x.toFixed(1) + 'px'); el.style.setProperty('--y', y.toFixed(1) + 'px');
    el.style.setProperty('--r', r.toFixed(2) + 'deg');
  }
  function settle() { els.forEach((el, i) => { const h = home(i); put(el, h.x, h.y, h.r); }); }

  /* ── the entrance: a spring per print, from its nearer side ────────── */
  let springs = null, raf = 0;
  function enter() {
    applyLook();
    if (stacked) { stackEnter(); return; }
    cancelAnimationFrame(raf);
    if (REDUCED) { settle(); return; }
    const W = table.clientWidth, w = width(), S = C.spring;
    springs = els.map((el, i) => {
      const h = home(i), left = h.x + w / 2 < W / 2;
      const x0 = left ? -w - S.travel : W + S.travel;
      return { el, i, h, delay: i * S.stagger, t: 0,
        x: x0, vx: 0, y: h.y + (i % 2 ? 40 : -30), vy: 0, r: h.r + (left ? -S.spin : S.spin), vr: 0 };
    });
    springs.forEach(s => put(s.el, s.x, s.y, s.r));
    let last = performance.now();
    const step = now => {
      const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
      let moving = false;
      springs.forEach(s => {
        s.t += dt;
        if (s.t < s.delay) { moving = true; return; }
        /* semi-implicit Euler, in small substeps so stiff springs stay stable */
        for (let k = 0; k < 4; k++) {
          const h = dt / 4, K = C.spring.stiffness, D = C.spring.damping;
          s.vx += (K * (s.h.x - s.x) - D * s.vx) * h; s.x += s.vx * h;
          s.vy += (K * (s.h.y - s.y) - D * s.vy) * h; s.y += s.vy * h;
          s.vr += (K * (s.h.r - s.r) - D * s.vr) * h; s.r += s.vr * h;
        }
        put(s.el, s.x, s.y, s.r);
        if (Math.abs(s.h.x - s.x) + Math.abs(s.h.y - s.y) + Math.abs(s.vx) + Math.abs(s.vy) > 0.2) moving = true;
      });
      if (moving) raf = requestAnimationFrame(step);
      else { springs = null; settle(); }      // land exactly on the layout
    };
    raf = requestAnimationFrame(step);
  }
  applyLook(); settle();
  els.forEach(el => { el.style.visibility = 'hidden'; });
  const io = new IntersectionObserver(([e]) => {
    if (!e.isIntersecting) return;
    io.disconnect(); entered = true;
    els.forEach(el => { el.style.visibility = ''; });
    enter();
  }, { threshold: 0.3 });
  io.observe(table);
  document.getElementById('reset').addEventListener('click', enter);
  addEventListener('resize', () => { applyLook(); setMode(); if (!springs && !stacked) settle(); });

  /* ══ mobile: the stack ════════════════════════════════════════════════
     Under 760px the table becomes one pile of prints, dealt a little out of
     true. The top one follows the finger — sliding, turning with the drag,
     the one beneath rising to meet it — and a swipe past the threshold (or
     a quick flick) throws it to that side, from where it tucks back in at
     the bottom of the pile on the same side. Every print rides its own
     spring toward its place in the pile, so a cycle is one continuous,
     slightly bouncy move rather than a jump. */
  let stacked = false, entered = false, order = PICS.map((_, i) => i), sraf = 0;
  const S = PICS.map(() => ({ x: 0, y: 0, r: 0, s: 1, vx: 0, vy: 0, vr: 0, vs: 0, hold: null, fly: 0, side: 0 }));
  const jit = (i, k) => { const v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return (v - Math.floor(v)) * 2 - 1; };
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = PICS.map(() => '<i></i>').join('');
  function slot(i, d) {
    const W = table.clientWidth, H = table.clientHeight, el = els[i], w = el.offsetWidth || width(), h = el.offsetHeight || w * 1.25;
    const cx = W / 2, cy = Math.min(H * 0.62, H - h / 2 - 48);
    const sp = C.stack.spread, tl = C.stack.tilt, D = Math.min(d, 6);
    const st = S[i];
    /* a print just sent back keeps a lean toward the side it went */
    const lean = st.side * Math.max(0, 1 - D / 6) * 0;
    return {
      x: cx - w / 2 + (d ? jit(i, 1) * 16 * sp : jit(i, 1) * 3) + lean,
      y: cy - h / 2 + D * 7 * sp + (d ? jit(i, 2) * 6 * sp : 0),
      r: (d ? jit(i, 3) * 9 : jit(i, 3) * 2.5) * tl,
      s: 1 - D * 0.028,
    };
  }
  function stackStep(now) {
    sraf = 0;
    const dt = Math.min(1 / 30, (now - (stackStep.last || now)) / 1000); stackStep.last = now;
    let moving = false;
    order.forEach((i, d) => {
      const st = S[i], el = els[i];
      let T = slot(i, d);
      if (st.hold) T = st.hold;                       // under the finger
      else if (st.fly) T = { x: T.x + st.side * table.clientWidth * 0.62, y: T.y - 24, r: st.side * 22, s: 1 };
      const K = st.hold ? 900 : C.stack.spring, Dm = st.hold ? 60 : C.stack.damping;
      for (let k = 0; k < 3; k++) {
        const h = dt / 3;
        st.vx += (K * (T.x - st.x) - Dm * st.vx) * h; st.x += st.vx * h;
        st.vy += (K * (T.y - st.y) - Dm * st.vy) * h; st.y += st.vy * h;
        st.vr += (K * (T.r - st.r) - Dm * st.vr) * h; st.r += st.vr * h;
        st.vs += (K * (T.s - st.s) - Dm * st.vs) * h; st.s += st.vs * h;
      }
      /* out at the side: now tuck it under, from that side */
      if (st.fly && Math.abs(st.x - T.x) < table.clientWidth * 0.18) {
        st.fly = 0; order = order.filter(k => k !== i).concat(i);
      }
      el.style.zIndex = st.fly ? 200 : 100 - order.indexOf(i);
      el.style.setProperty('--x', st.x.toFixed(1) + 'px'); el.style.setProperty('--y', st.y.toFixed(1) + 'px');
      el.style.setProperty('--r', st.r.toFixed(2) + 'deg');
      el.style.transform = `translate3d(${st.x.toFixed(1)}px, ${st.y.toFixed(1)}px, 0) rotate(${st.r.toFixed(2)}deg) scale(${st.s.toFixed(4)})`;
      el.style.visibility = d < 7 || st.fly ? '' : 'hidden';
      if (Math.abs(T.x - st.x) + Math.abs(T.y - st.y) + Math.abs(st.vx) + Math.abs(st.vy) + Math.abs(T.r - st.r) > 0.05 || st.hold || st.fly) moving = true;
    });
    [...dotsEl.children].forEach((dt2, k) => dt2.classList.toggle('on', k === order[0]));
    if (moving && stacked) sraf = requestAnimationFrame(stackStep);
  }
  const stackKick = () => { if (!sraf && stacked) { stackStep.last = performance.now(); sraf = requestAnimationFrame(stackStep); } };
  function stackEnter() {
    const H = table.clientHeight;
    order.forEach((i, d) => { const st = S[i], T = slot(i, d); Object.assign(st, { x: T.x + jit(i, 5) * 40, y: H + 80 + d * 40, r: jit(i, 6) * 30, s: 1, vx: 0, vy: 0, vr: 0, vs: 0, fly: 0, hold: null }); });
    els.forEach(el => { el.style.visibility = ''; });
    stackKick();
  }
  /* the swipe, on whichever print is on top */
  let sw = null;
  table.addEventListener('pointerdown', e => {
    if (!stacked) return;
    const el = e.target.closest('.pol'); if (!el || +el.dataset.i !== order[0]) return;
    const i = order[0], st = S[i], base = slot(i, 0);
    sw = { i, id: e.pointerId, x0: e.clientX, y0: e.clientY, base, t: performance.now(), lx: e.clientX, vx: 0 };
    el.setPointerCapture(e.pointerId); el.classList.add('drag');
    st.hold = { ...base };
    stackKick();
  });
  table.addEventListener('pointermove', e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0, now = performance.now();
    sw.vx = sw.vx * 0.6 + ((e.clientX - sw.lx) / Math.max(1, now - sw.t)) * 0.4; sw.lx = e.clientX; sw.t = now;
    S[sw.i].hold = { x: sw.base.x + dx, y: sw.base.y + dy * 0.35, r: sw.base.r + dx * 0.07, s: 1.02 };
    stackKick();
  });
  const release = e => {
    if (!sw || e.pointerId !== sw.id) return;
    const st = S[sw.i], dx = e.clientX - sw.x0, w = els[sw.i].offsetWidth;
    els[sw.i].classList.remove('drag');
    st.hold = null;
    if (Math.abs(dx) > w * C.stack.threshold || Math.abs(sw.vx) > 0.55) { st.side = Math.sign(dx || sw.vx); st.fly = 1; }
    sw = null; stackKick();
  };
  table.addEventListener('pointerup', release);
  table.addEventListener('pointercancel', release);
  /* desktop table ⇄ mobile stack */
  function setMode() {
    const want = matchMedia('(max-width: 760px)').matches;
    if (want === stacked) return;
    stacked = want; document.body.classList.toggle('stacked', stacked); applyLook();
    document.getElementById('hint').textContent = stacked ? 'Swipe the photos' : 'Drag the photos around';
    if (stacked) { cancelAnimationFrame(raf); springs = null; order.forEach((i, d) => { const T = slot(i, d); Object.assign(S[i], T); }); if (entered) stackKick(); }
    else { els.forEach(el => { el.style.transform = ''; el.style.zIndex = ''; el.style.visibility = ''; }); settle(); }
  }
  setMode();

  /* hover tilt + lift, and dragging — a drop writes back into the layout */
  els.forEach((el, i) => {
    const card = el.querySelector('.card');
    let lift = 0, liftT = 0, tx = 0, ty = 0, txT = 0, tyT = 0, raf = 0;
    const tick = () => {
      lift += (liftT - lift) * .18; tx += (txT - tx) * .18; ty += (tyT - ty) * .18;
      el.style.setProperty('--lift', lift.toFixed(3)); el.style.setProperty('--tx', tx.toFixed(2) + 'deg'); el.style.setProperty('--ty', ty.toFixed(2) + 'deg');
      if (Math.abs(liftT - lift) + Math.abs(txT - tx) + Math.abs(tyT - ty) > .01) raf = requestAnimationFrame(tick); else raf = 0;
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
    el.addEventListener('pointermove', e => {
      if (REDUCED || stacked) return;
      const r = card.getBoundingClientRect();
      const u = (e.clientX - r.left) / r.width - .5, v = (e.clientY - r.top) / r.height - .5;
      tyT = u * 16; txT = -v * 14; liftT = drag ? 1.2 : 1; kick();
    });
    el.addEventListener('pointerleave', () => { if (drag) return; liftT = 0; txT = 0; tyT = 0; kick(); });

    let drag = false, ox = 0, oy = 0;
    el.addEventListener('pointerdown', e => {
      if (stacked || springs) return;              // the stack has its own swipe; not mid-entrance
      drag = true; el.setPointerCapture(e.pointerId); el.classList.add('drag');
      el.style.zIndex = ++z; select(i);
      ox = e.clientX - el._x; oy = e.clientY - el._y; liftT = 1.2; kick();
    });
    el.addEventListener('pointermove', e => {
      if (!drag) return;
      const W = table.clientWidth, H = table.clientHeight, w = el.offsetWidth, h = el.offsetHeight;
      const x = Math.min(W - w * .4, Math.max(-w * .6, e.clientX - ox));
      const y = Math.min(H - h * .3, Math.max(-h * .5, e.clientY - oy));
      C.cards[i].x = +(x / W).toFixed(4); C.cards[i].y = +(y / H).toFixed(4);
      put(el, x, y, C.cards[i].r);
    });
    const drop = () => {
      if (!drag) return; drag = false; el.classList.remove('drag');
      liftT = 0; txT = 0; tyT = 0; kick(); syncPanel();
    };
    el.addEventListener('pointerup', drop);
    el.addEventListener('pointercancel', drop);
  });

  /* ── the panel ─────────────────────────────────────────────────────── */
  const tn = document.createElement('div');
  tn.id = 'tune';
  const R = (id, label, min, max, step, val, unit = '') => `<div class="row"><label>${label}<i id="v-${id}">${val}${unit}</i></label><input type="range" id="s-${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></div>`;
  tn.innerHTML = `
    <div id="tune-head"><b>Polaroids</b><button id="tune-hide" title="Hide (H)">–</button></div>
    <p class="tune-sub">All prints</p>
    ${R('sc', 'Scale', .5, 1.6, .01, C.scale)}
    ${R('sy', 'Shadow offset', 0, 30, 1, C.shadow.y, 'px')}
    ${R('sb', 'Shadow blur', 0, 60, 1, C.shadow.blur, 'px')}
    ${R('sa', 'Shadow strength', 0, .7, .01, C.shadow.opacity)}
    <p class="tune-sub">Spring entrance</p>
    ${R('st', 'Stiffness', 20, 400, 1, C.spring.stiffness)}
    ${R('dp', 'Damping', 2, 40, .5, C.spring.damping)}
    ${R('sg', 'Stagger', 0, .3, .01, C.spring.stagger, 's')}
    <div class="row inline"><label>Entrance<i></i></label><button class="tune-btn" id="p-replay">Replay</button></div>
    <p class="tune-sub">One print — click or drag it to pick</p>
    <div class="row"><label>Print<i></i></label><select id="s-pk">${PICS.map((p, i) => `<option value="${i}">${String(i + 1).padStart(2, '0')} ${esc(title(i))}</option>`).join('')}</select></div>
    <div class="row"><label>Title<i></i></label><input type="text" id="s-tt" maxlength="40" style="width:100%;padding:6px 8px;background:#111;border:1px solid rgba(255,255,255,.16);color:#fff;font:inherit"></div>
    ${R('px', 'X', -.1, 1, .001, 0)}
    ${R('py', 'Y', -.1, 1, .001, 0)}
    ${R('pr', 'Rotation', -30, 30, .5, 0, '°')}
    <p class="tune-sub">Layout</p>
    <p class="tune-sub">Mobile stack</p>
    ${R('ms', 'Spring', 60, 400, 5, C.stack.spring)}
    ${R('md', 'Damping', 8, 50, .5, C.stack.damping)}
    ${R('mt', 'Swipe distance', .1, .6, .01, C.stack.threshold, '× width')}
    ${R('mp', 'Messiness', 0, 2, .05, C.stack.spread)}
    ${R('mr', 'Tilt', 0, 2, .05, C.stack.tilt)}
    <div class="tune-acts"><button class="tune-btn" id="p-bake">Bake layout</button><button class="tune-btn" id="p-clear">Clear baked</button></div>
    <p class="why" id="p-state"></p>`;
  document.body.appendChild(tn);
  const q = id => tn.querySelector('#' + id);
  const bind = (id, fn) => q('s-' + id).addEventListener('input', e => {
    const v = +e.target.value; q('v-' + id).textContent = v + e.target.dataset.unit; fn(v);
  });
  bind('sc', v => { C.scale = v; applyLook(); });
  bind('sy', v => { C.shadow.y = v; applyLook(); });
  bind('sb', v => { C.shadow.blur = v; applyLook(); });
  bind('sa', v => { C.shadow.opacity = v; applyLook(); });
  bind('st', v => { C.spring.stiffness = v; });
  bind('dp', v => { C.spring.damping = v; });
  bind('sg', v => { C.spring.stagger = v; });
  q('p-replay').addEventListener('click', enter);
  bind('ms', v => { C.stack.spring = v; }); bind('md', v => { C.stack.damping = v; });
  bind('mt', v => { C.stack.threshold = v; }); bind('mp', v => { C.stack.spread = v; stackKick(); }); bind('mr', v => { C.stack.tilt = v; stackKick(); });
  /* the title: one field per print */
  function setTitle(i, t) {
    C.titles[i] = t;
    els[i].querySelector('.note b').textContent = t; els[i].querySelector('img').alt = t;
    q('s-pk').options[i].textContent = String(i + 1).padStart(2, '0') + ' ' + t;
  }
  q('s-tt').addEventListener('input', e => setTitle(selected, e.target.value));
  /* or straight on the print: double-click its caption */
  els.forEach((el, i) => {
    const b = el.querySelector('.note b');
    b.addEventListener('dblclick', () => { b.contentEditable = 'true'; b.focus(); document.getSelection().selectAllChildren(b); });
    b.addEventListener('blur', () => { b.contentEditable = 'false'; setTitle(i, b.textContent.trim()); if (i === selected) q('s-tt').value = C.titles[i]; });
    b.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); b.blur(); } });
    b.addEventListener('pointerdown', e => { if (b.isContentEditable) e.stopPropagation(); });
  });
  function select(i) {
    selected = i; els.forEach((el, k) => el.classList.toggle('sel', k === i && !tn.classList.contains('hidden')));
    q('s-pk').value = i; q('s-tt').value = title(i); syncPanel();
  }
  function syncPanel() {
    const c = C.cards[selected];
    [['px', c.x, ''], ['py', c.y, ''], ['pr', c.r, '°']].forEach(([id, v, u]) => { q('s-' + id).value = v; q('v-' + id).textContent = (+v).toFixed(3).replace(/\.?0+$/, '') + u; });
  }
  q('s-pk').addEventListener('change', e => select(+e.target.value));
  const edit = (k, v) => { C.cards[selected][k] = v; const h = home(selected); put(els[selected], h.x, h.y, h.r); };
  bind('px', v => edit('x', v));
  bind('py', v => edit('y', v));
  bind('pr', v => edit('r', v));
  const state = () => {
    let baked = false; try { baked = !!localStorage.getItem(BAKE_KEY); } catch {}
    q('p-state').textContent = baked ? 'This browser is showing a baked layout.' : 'Showing the defaults in POLAROID_CONFIG.';
  };
  q('p-bake').addEventListener('click', async () => {
    const out = { scale: C.scale, baseWidth: C.baseWidth, shadow: C.shadow, spring: C.spring, cards: C.cards, titles: C.titles, stack: C.stack };
    try { localStorage.setItem(BAKE_KEY, JSON.stringify(out)); } catch {}
    const txt = 'const POLAROID_CONFIG = ' + JSON.stringify(out, null, 2) + ';';
    try { await navigator.clipboard.writeText(txt); q('p-state').textContent = 'Baked and copied — paste over POLAROID_CONFIG to make it the default.'; }
    catch { console.log(txt); q('p-state').textContent = 'Baked; the config is in the console to paste over POLAROID_CONFIG.'; }
  });
  q('p-clear').addEventListener('click', () => { try { localStorage.removeItem(BAKE_KEY); } catch {} location.reload(); });
  q('tune-hide').addEventListener('click', () => { tn.classList.toggle('hidden'); select(selected); });
  select(0); state();
  addEventListener('DOMContentLoaded', () => { if (window.wb && window.wb.adopt) window.wb.adopt(); });
  window.tibba = { CONFIG: C, enter, settle };
})();
</script>
</body>
</html>
