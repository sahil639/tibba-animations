<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   Our summits — 5 · Summit Log (stacking cards, the mountain in a window)
   ─────────────────────────────────────────────────────────────────────────
   Website v3's stacking cards, with the mountain kept in one small window
   at the top of the left column — the same column as the words. The
   window never moves and never changes with the cards: it sits over the
   whole section while the cards rise beneath it, and only what it shows
   follows the reading — the camera rides to the summit of the card in
   view and draws its trail, the log line above it names that summit.

   Each card: under the window, the summit's line, the title, the numbers
   and the way in; on the right the work — the cover, and a box with the
   shared Rive file (assets/rive/) beside a plate.

   Phones: the window docks at the top of the screen, short and wide; the
   cards run one after another beneath it.
   ═════════════════════════════════════════════════════════════════════════ */
:root { --top: clamp(84px, 11vh, 120px); --win-w: min(38vw, 600px); --win-h: clamp(190px, 33vh, 340px); }
.lg-head { padding: clamp(96px, 14vh, 150px) var(--gut) clamp(30px, 5vh, 60px); }
.lg-head .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.lg-head h2 { margin-top: 14px; color: #fff; font-weight: 400; font-size: clamp(26px, 2.6vw, 44px); line-height: 1.1; letter-spacing: -.025em; max-width: 22ch; }

#lg { position: relative; }
/* the window: fixed over the whole section */
.lg-win { position: sticky; top: var(--top); z-index: 20; width: var(--win-w); height: var(--win-h); margin: 0 0 calc(-1 * var(--win-h)) var(--gut);
  background: #08090b; border: 1px solid rgba(233,236,242,.16); box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.lg-win .sl-range { position: absolute; inset: 0; }
.lg-win::before, .lg-win::after { content: ''; position: absolute; z-index: 3; width: 10px; height: 10px; border: solid var(--c, #fff); pointer-events: none; transition: border-color .4s linear; }
.lg-win::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; } .lg-win::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
.lg-bar { position: absolute; z-index: 4; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(233,236,242,.6); pointer-events: none;
  background: linear-gradient(rgba(8,9,11,.85), rgba(8,9,11,0)); }
.lg-bar b { color: var(--c); font-weight: 400; transition: color .4s linear; }
.lg-ticks { position: absolute; z-index: 4; left: 12px; right: 12px; bottom: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.lg-ticks button { appearance: none; border: 0; cursor: pointer; height: 14px; padding: 6px 0; background: rgba(233,236,242,.22); background-clip: content-box;
  background-image: linear-gradient(var(--c), var(--c)); background-repeat: no-repeat; background-size: calc(var(--f, 0) * 100%) 100%; background-origin: content-box; }

/* the cards */
.pn { --c: #fff; position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: #050506; }
.pn + .pn { box-shadow: 0 -30px 60px rgba(0,0,0,.6); }
.pn .in { position: absolute; inset: 0; display: grid; grid-template-columns: var(--win-w) minmax(0, 1fr); gap: clamp(28px, 4.5vw, 90px);
  padding: var(--top) var(--gut) clamp(36px, 6vh, 70px); transform-origin: 50% 0;
  transform: scale(calc(1 - var(--sink, 0) * .06)) translateY(calc(var(--sink, 0) * -3vh)); filter: brightness(calc(1 - var(--sink, 0) * .55)); }
.pn .txt { padding-top: calc(var(--win-h) + clamp(22px, 4vh, 44px)); display: flex; flex-direction: column; gap: clamp(14px, 2.2vh, 24px); align-items: flex-start; }
.pn .txt .sl-title { font-size: clamp(22px, 2.2vw, 38px); }
.pn .work { display: grid; grid-template-columns: 1.35fr 1fr; grid-template-rows: 1.2fr 1fr; gap: clamp(10px, 1vw, 16px); min-height: 0; }
.pn .work .cover { grid-column: 1 / -1; }

@media (max-width: 900px) {
  :root { --top: 76px; --win-w: calc(100vw - 2 * var(--gut)); --win-h: clamp(150px, 26vh, 210px); }
  .pn { position: relative; height: auto; }
  .pn + .pn { box-shadow: none; }
  .pn .in { position: relative; inset: auto; transform: none; filter: none; grid-template-columns: 1fr; padding: 34px var(--gut) 56px; gap: 22px; }
  .pn:first-child .in { padding-top: calc(var(--win-h) + 40px); }
  .pn .txt { padding-top: 0; }
  .pn .work { height: 86vw; }
}
</style>
<link rel="stylesheet" href="assets/tune.css">
</head>
<body>
<header class="lg-head"><p class="eyebrow">[ &nbsp;Our summits&nbsp; ]</p><h2>Four climbs, and what they were for</h2></header>
<section id="lg" aria-label="Our summits">
  <div class="lg-win" id="win">
    <div class="lg-bar"><span>Log · <b id="lg-name">Summit 01</b></span><span id="lg-alt">Alt 4,820 m</span></div>
    <div id="range" class="sl-range-box" style="position:absolute;inset:0"></div>
    <nav class="lg-ticks" id="ticks" aria-label="Projects"></nav>
  </div>
  <div id="stack"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.min.js"}}</script>
<script type="module">
  import { S, N, clamp, pad, mountRange, stats, cta, riveBox, armRive, box, links, scrollToY } from './assets/summits-layouts.js';
  const sec = document.getElementById('lg'), stack = document.getElementById('stack'), win = document.getElementById('win'), ticksEl = document.getElementById('ticks');
  stack.innerHTML = S.map((s, i) => `
    <article class="pn" style="--c:${s.colour}" aria-label="${s.client}">
      <div class="in">
        <div class="txt">
          <p class="sl-k"><b>Summit ${pad(i)}</b><i></i><span>${s.sector} · ${s.year}</span></p>
          <h3 class="sl-title">${s.title}</h3>
          ${stats(s)}
          ${cta(s)}
        </div>
        <div class="work">${box(s, 0, 'cover')}${riveBox(s, 1)}${box(s, 2)}</div>
      </div>
    </article>`).join('');
  ticksEl.innerHTML = S.map((s, i) => `<button type="button" style="--c:${s.colour}" aria-label="${s.client}"></button>`).join('');
  const cards = [...stack.children], ticks = [...ticksEl.children];
  links(sec); armRive(stack);

  const phone = matchMedia('(max-width: 900px)');
  function focus() {
    if (phone.matches) {
      let f = 0; cards.forEach((c, i) => { const r = c.getBoundingClientRect(); if (r.top < innerHeight * .55) f = i + clamp((innerHeight * .55 - r.top) / r.height, 0, 1) - .5; });
      return clamp(f, 0, N - 1);
    }
    return clamp((scrollY - stack.offsetTop) / innerHeight, 0, N - 1);
  }
  const jump = i => scrollToY(phone.matches ? stack.offsetTop + cards[i].offsetTop - 40 : stack.offsetTop + i * innerHeight + 2);
  const range = mountRange(document.getElementById('range'), { focus, frame: 'ride', mini: true, onPick: jump,
    onCase: (i, c) => {
      win.style.setProperty('--c', S[i].colour);
      document.getElementById('lg-name').textContent = `Summit ${pad(i)} · ${S[i].client}`;
      document.getElementById('lg-alt').textContent = `Alt ${S[i].alt} m`;
    } });
  ticks.forEach((b, i) => b.addEventListener('click', () => jump(i)));

  let raf = 0;
  function frame() {
    raf = 0;
    const f = focus();
    if (!phone.matches) cards.forEach((c, i) => c.querySelector('.in').style.setProperty('--sink', clamp(f - i, 0, 1).toFixed(3)));
    ticks.forEach((b, i) => b.style.setProperty('--f', clamp(f - i + 1, 0, 1).toFixed(3)));
  }
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(frame); }, { passive: true });
  addEventListener('resize', frame);
  frame();
  window.tibba = range;
</script>
</body>
</html>
