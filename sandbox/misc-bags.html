  add(strap([[-0.72, 4.35, -1.92], [0, 4.4, -2.0], [0.72, 4.35, -1.92]], 0.13, 0.05, [0, 1, 0], { seg: 16 }).g, solidDark(), 'sternum-strap');
  add(block(0.3, 0.16, 0.08, 0.03, [2, 2, 1]).translate(0, 4.4, -2.04), solidDark(), 'sternum-buckle');
  /* load lifters, lid to shoulder strap */
  for (const sx of [-1, 1]) add(strap([[sx * 0.75, 5.5, -0.95], [sx * 0.72, 5.2, -1.45], [sx * 0.72, 4.85, -1.72]], 0.1, 0.04, [1, 0, 0], { seg: 10 }).g, solidDark(), 'load-lifter');
  
  /* the hip belt, round the back of the base and forward to the hips */
  const hip = strap([[-1.55, 1.35, 0.55], [-1.75, 1.45, -0.35], [-1.25, 1.55, -1.3], [0, 1.6, -1.55], [1.25, 1.55, -1.3], [1.75, 1.45, -0.35], [1.55, 1.35, 0.55]], 0.72, 0.24, [0, 1, 0], { seg: 64, r: 0.08 });
  add(hip.g, surface({ k: [0.36, hip.len / 2, 0.12], c: [0, 0, 0], seed: 5.4 }), 'hip-belt');
  /* the hip pocket, on the left wing, rings of its own */
  add(block(0.32, 0.6, 1.0, 0.14, [4, 8, 10]).rotateY(-0.25).translate(-1.86, 1.42, -0.15),
    surface({ k: [0.16, 0.3, 0.5], c: [0, 0, 0.05], seed: 6.6 }), 'hip-pocket');
  add(block(0.12, 0.3, 0.22, 0.03, [1, 2, 2]).translate(-1.62, 1.38, 0.58), solidDark(), 'hip-buckle');
  
  /* the orange strap: down the front from under the lid, over the base */
  const ostrap = strap([[-0.62, 5.3, 1.2], [-0.68, 4.4, 1.12], [-0.7, 3.2, 1.11], [-0.68, 2.05, 1.16], [-0.62, 1.45, 1.42], [-0.55, 0.55, 1.5]], 0.26, 0.06, [1, 0, 0], { seg: 60 });
  add(ostrap.g, solidAccent(), 'accent-strap');
  const buckleAt = (curve, u, w = 0.36, h = 0.18, mat = solidDark()) => {
    const p = curve.getPointAt(u), t = curve.getTangentAt(u);
    const m = add(block(w, h, 0.08, 0.03, [2, 2, 1]), mat, 'buckle');
    m.position.copy(p).add(new THREE.Vector3(0, 0, 0.04)); m.rotation.set(-Math.atan2(t.z, t.y), 0, 0);
  };
  buckleAt(ostrap.curve, 0.06, 0.34, 0.2, solidAccent());
  buckleAt(ostrap.curve, 0.82, 0.32, 0.18);
  
  /* compression straps across the left side and round to the front */
  const comp1 = strap([[-1.05, 4.75, -0.92], [-1.32, 4.55, -0.35], [-1.32, 4.3, 0.45], [-1.05, 4.1, 1.06], [-0.72, 4.05, 1.12]], 0.14, 0.05, [0, 1, 0], { seg: 36 });
  add(comp1.g, solidDark(), 'compression-strap');
  add(strap([[-1.32, 4.73, -0.95], [-1.36, 4.62, -0.62]], 0.16, 0.06, [0, 1, 0], { seg: 6 }).g, solidAccent(), 'compression-keeper');
  const comp2 = strap([[-1.02, 2.95, -0.95], [-1.33, 2.85, -0.3], [-1.33, 2.75, 0.45], [-1.05, 2.7, 1.07], [-0.72, 2.68, 1.12]], 0.14, 0.05, [0, 1, 0], { seg: 36 });
  add(comp2.g, solidDark(), 'compression-strap');
  for (const [c, u] of [[comp1, 0.62], [comp2, 0.6]]) {
    const p = c.curve.getPointAt(u);
    add(block(0.1, 0.18, 0.32, 0.03, [1, 2, 2]), solidDark(), 'side-buckle').position.copy(p);
  }
  /* lid strap round the front of the lid, and the feet loops */
  add(strap([[0.6, 6.45, 1.0], [0.62, 6.0, 1.42], [0.6, 5.4, 1.38]], 0.12, 0.045, [1, 0, 0], { seg: 16 }).g, solidDark(), 'lid-strap');
  for (const sx of [-0.75, 0.75]) {
    add(strap([[sx - 0.12, 0.25, 1.15], [sx, -0.02, 1.32], [sx + 0.12, 0.25, 1.15]], 0.1, 0.05, [1, 0, 0], { seg: 12 }).g, solidDark(), 'foot-loop');
  }
  /* the haul loop */
  add(strap([[-0.2, 5.6, -0.98], [0, 5.92, -1.15], [0.2, 5.6, -0.98]], 0.09, 0.04, [0, 0, 1], { seg: 12 }).g, solidDark(), 'haul-loop');
  /* the mark, centred on the front pocket */
  mark([0.32, 3.3, 1.765], 0.62);
}, { dir: [-1.05, 0.78, 0.95], zoom: 1.05 });

/* ── 2 · the waist pack ──────────────────────────────────────────────────── */
makeBag('Waist pack', () => {
  const curve = x => 0.32 * (x / 1.6) * (x / 1.6);          // the pouch curves back toward the wearer
  /* the pouch: long, deep, its ends swept back */
  add(block(3.2, 1.9, 1.15, 0.52, [26, 16, 10], { deform: (v, x, y, z) => { v.z -= curve(v.x); if (z > 0) v.z += 0.1 * (1 - x * x) * (1 - y * y); } }).translate(0, 1.0, 0),
    surface({ k: [0.9, 1.25, 0.7], c: [0.2, 0.0, 0.5], seed: 2.2 }), 'pouch');
  /* the front pocket, its rings centred a little left, as in the drawing */
  add(block(2.6, 1.42, 0.44, 0.42, [22, 14, 6], { deform: (v, x, y, z) => { v.z -= curve(v.x); if (z > 0) v.z += 0.17 * (1 - x * x) * (1 - y * y); } }).translate(-0.05, 0.92, 0.66),
    surface({ k: [1.0, 1.35, 0.45], c: [-0.45, -0.05, 0.3], seed: 8.1 }), 'front-pocket');
  /* the zips' orange pulls */
  add(block(0.09, 0.34, 0.05, 0.02, [1, 3, 1]).rotateZ(0.2).translate(1.32, 1.42, 0.64 - curve(1.32)), solidAccent(), 'zip-pull');
  add(block(0.09, 0.34, 0.05, 0.02, [1, 3, 1]).rotateZ(-0.15).translate(-1.62, 1.55, 0.18 - curve(1.62)), solidAccent(), 'zip-pull');
  /* the belt, from one end of the pouch round behind the wearer to the other */
  const belt = strap([[-1.62, 1.05, -0.3], [-1.85, 1.15, -1.0], [-1.55, 1.35, -2.25], [-0.2, 1.6, -3.1], [1.45, 1.55, -3.0], [2.55, 1.25, -1.9], [2.35, 1.05, -0.7], [1.62, 1.0, -0.3]],
    0.58, 0.06, [0, 1, 0], { seg: 120, r: 0.02 });
  add(belt.g, surface({ k: [1, 0, 0], c: [-3, 0, 0], seed: 0 }), 'belt');      // field across the width only: the lines run along the belt
  /* the buckle, orange, in the belt behind on the right */
  along(belt.curve, 0.64, block(0.66, 0.46, 0.13, 0.05, [3, 3, 1]), solidAccent(), 'buckle', 0.03);
  along(belt.curve, 0.64, block(0.36, 0.2, 0.15, 0.03, [2, 1, 1]), solidDark(), 'buckle-window', 0.05);
  /* the belt tabs where it meets the pouch */
  for (const sx of [-1, 1]) add(block(0.22, 0.62, 0.5, 0.08, [2, 4, 3]).translate(sx * 1.62, 1.03, -0.28), surface({ k: [0.5, 0.5, 0.5], c: [0, 0, 0], seed: 4 }), 'tab');
  mark([-0.05, 0.92, 1.12], 0.5);
}, { dir: [0.62, 0.72, 1.0], zoom: 1.2, shift: [0.2, 0, 0.35] });

/* ── 3 · the daypack ─────────────────────────────────────────────────────── */
makeBag('Daypack', () => {
  /* the body: rounded, a domed top */
  add(block(2.5, 3.6, 1.35, 0.62, [20, 30, 12], { taper: 0.05, deform: (v, x, y, z) => { if (y > 0) v.y += 0.38 * y * y * (1 - x * x * 0.8); } }).translate(0, 2.1, 0),
    surface({ k: [1.0, 0.95, 0.55], c: [0.35, 0.3, -0.4], seed: 3.7 }), 'body');
  /* the front pocket: a soft square low on the front */
  add(block(2.05, 1.8, 0.5, 0.55, [18, 16, 6], { deform: (v, x, y, z) => { if (z > 0) v.z += 0.2 * (1 - x * x) * (1 - y * y); } }).translate(0, 1.22, 0.8),
    surface({ k: [1.0, 1.0, 0.4], c: [-0.3, -0.1, 0.3], seed: 6.3 }), 'front-pocket');
  /* the top handle */
  add(strap([[-0.32, 4.02, -0.32], [-0.3, 4.5, -0.36], [0, 4.68, -0.38], [0.3, 4.5, -0.36], [0.32, 4.02, -0.32]], 0.17, 0.07, [0, 0, 1], { seg: 24 }).g,
    surface({ k: [1, 0, 0], c: [-4, 0, 0], seed: 1 }), 'handle');
  /* shoulder straps: padded, curving off the back, webbing to the base */
  for (const sx of [-1, 1]) {
    const s = strap([[sx * 0.5, 3.95, -0.62], [sx * 0.62, 3.4, -1.12], [sx * 0.72, 2.3, -1.24], [sx * 0.85, 1.25, -1.05], [sx * 0.98, 0.75, -0.82]], 0.55, 0.2, [1, 0, 0], { seg: 40 });
    add(s.g, surface({ k: [0.28, s.len / 2, 0.1], c: [0, 0.3, 0], seed: 5 + sx }), 'shoulder-strap');
    add(strap([[sx * 0.98, 0.75, -0.82], [sx * 1.08, 0.45, -0.72], [sx * 1.05, 0.28, -0.62]], 0.13, 0.04, [1, 0, 0], { seg: 10 }).g, solidDark(), 'webbing');
  }
  /* zips: round the pocket and up the side; orange pulls, an orange loop */
  add(strap([[-0.98, 0.45, 1.0], [-1.0, 1.25, 1.12], [-0.85, 2.05, 1.04], [0, 2.14, 1.1], [0.85, 2.05, 1.04], [1.0, 1.25, 1.12], [0.98, 0.45, 1.0]], 0.045, 0.03, [0, 0, 1], { seg: 50 }).g, solidDark(), 'pocket-zip');
  add(block(0.1, 0.36, 0.05, 0.02, [1, 3, 1]).translate(1.05, 1.35, 1.12), solidAccent(), 'zip-pull');
  add(block(0.1, 0.36, 0.05, 0.02, [1, 3, 1]).rotateZ(0.25).translate(-1.2, 2.2, 0.5), solidAccent(), 'zip-pull');
  add(strap([[1.24, 1.25, -0.05], [1.32, 0.98, 0.08], [1.24, 1.25, 0.22]], 0.08, 0.06, [1, 0, 0], { seg: 14 }).g, solidAccent(), 'loop');
  mark([0, 1.22, 1.275], 0.52);
}, { dir: [0.6, 0.62, 1.0], zoom: 1.4, shift: [0, 0.1, 0] });

/* ── applying the config ─────────────────────────────────────────────────── */
let cur = Math.min(BAGS.length - 1, Math.max(0, C.view.bag | 0));
BAGS[cur].pivot.visible = true;
let HOME = BAGS[cur].home;
camera.position.copy(HOME.target).addScaledVector(HOME.dir, 40); camera.zoom = HOME.zoom; camera.updateProjectionMatrix();
controls.target.copy(HOME.target); controls.update();
function apply() {
  G.uDensity.value = C.lines.density; G.uWidth.value = C.lines.width; G.uWarp.value = C.lines.warp; G.uLineOp.value = C.lines.opacity;
  G.uLineCol.value.set(C.lines.colour); G.uOutlineCol.value.set(C.lines.colour);
  G.uFill.value.set(C.model.fill); G.uShade.value = C.model.shade; G.uRim.value = C.model.rim;
  accent.value.set(C.model.accent);
  marks.forEach(m => { m.visible = C.model.logo; });
  BAGS.forEach(b => { b.guides.visible = C.model.guides; });
  controls.autoRotate = C.view.autoRotate; controls.autoRotateSpeed = C.view.rotateSpeed;
}
apply();

/* ── reset to the reference angle ──────────────────────────────────────── */
let tween = null;
function resetView(dur = 900) {
  const from = { p: camera.position.clone(), t: controls.target.clone(), z: camera.zoom };
  const to = { p: HOME.target.clone().addScaledVector(HOME.dir, 40), t: HOME.target.clone(), z: HOME.zoom };
  tween = { from, to, t0: performance.now(), dur };
}

/* ── the switch: out goes the bag, shrinking and easing away; in comes the
   next, growing with a small overshoot before it settles ─────────────────── */
const easeIn = t => t * t * t;
const easeOutBack = (t, s = 1.25) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const OUT = 360, GAP = 150, IN = 820;
let swap = null, queued = -1;
function showBag(i) {
  if (swap) { queued = i; return; }            // a switch asked for mid-swap runs when this one lands
  if (i === cur) return;
  const from = BAGS[cur], to = BAGS[i];
  to.pivot.visible = true; to.pivot.scale.setScalar(0.001);
  swap = { from, to, t0: performance.now() };
  cur = i; C.view.bag = i; HOME = to.home;
  resetView(OUT + GAP + IN * 0.8);
  syncSwitch();
}

/* ── the loop: pauses with the tab ─────────────────────────────────────── */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (C.anim.play) { G.uPhase.value += dt * C.anim.speed * 2.2; G.uMorphT.value += dt * C.anim.morph; }
  if (swap) {
    const t = now - swap.t0;
    const ko = Math.min(1, t / OUT), ki = Math.min(1, Math.max(0, (t - OUT - GAP) / IN));
    swap.from.pivot.scale.setScalar(Math.max(0.001, 1 - easeIn(ko)));
    swap.from.pivot.rotation.y = 0.35 * easeIn(ko);
    swap.to.pivot.scale.setScalar(Math.max(0.001, ki > 0 ? easeOutBack(ki) : 0.001));
    swap.to.pivot.rotation.y = -0.4 * (1 - easeOut(ki));
    if (ko >= 1) swap.from.pivot.visible = false;
    if (ki >= 1) { swap.from.pivot.scale.setScalar(1); swap.from.pivot.rotation.y = 0; swap.to.pivot.scale.setScalar(1); swap.to.pivot.rotation.y = 0; swap = null; if (queued >= 0) { const q = queued; queued = -1; showBag(q); } }
  }
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(tween.from.p, tween.to.p, e); controls.target.lerpVectors(tween.from.t, tween.to.t, e);
    camera.zoom = tween.from.z + (tween.to.z - tween.from.z) * e; camera.updateProjectionMatrix();
    if (k >= 1) tween = null;
  }
  controls.update();
  /* outlines a constant width on screen, whatever the zoom */
  G.uOutline.value = C.model.outline * (VIEW_H / camera.zoom) / renderer.domElement.clientHeight;
  /* fewer rings when the pack is drawn small, so they stay lines, not haze */
  const pxPerUnit = renderer.domElement.clientHeight * camera.zoom / VIEW_H;
  G.uDensity.value = C.lines.density * Math.min(1, Math.max(0.5, pxPerUnit / 90));
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* ── the switcher, bottom left ─────────────────────────────────────────── */
const sw = document.getElementById('switch');
sw.innerHTML = BAGS.map((b, i) => `<button type="button" data-i="${i}"><b>0${i + 1}</b><span>${b.name}</span></button>`).join('');
const swBtns = [...sw.children];
function syncSwitch() { swBtns.forEach((b, i) => { b.setAttribute('aria-pressed', String(i === cur)); }); }
swBtns.forEach((b, i) => b.addEventListener('click', () => showBag(i)));
addEventListener('keydown', e => {
  if (EMBED) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (/^[1-3]$/.test(e.key)) showBag(+e.key - 1);
  if (e.key === 'ArrowRight') showBag((cur + 1) % BAGS.length);
  if (e.key === 'ArrowLeft') showBag((cur + BAGS.length - 1) % BAGS.length);
});
syncSwitch();

/* ── the panel ─────────────────────────────────────────────────────────── */
const SCHEMA = [
  ['Animation'],
  ['anim.play', 'Play', 'check'],
  ['anim.speed', 'Flow speed', 0, 2, 0.01],
  ['anim.morph', 'Morph (the rings drifting)', 0, 1.5, 0.01],
  ['Contour lines'],
  ['lines.density', 'Density (rings per unit)', 3, 18, 0.1],
  ['lines.width', 'Line width', 0.4, 3, 0.05, 'px'],
  ['lines.warp', 'Warp — how far the rings wander', 0, 1.5, 0.01],
  ['lines.opacity', 'Intensity', 0, 1, 0.01],
  ['lines.colour', 'Line colour', 'color'],
  ['Model'],
  ['model.fill', 'Fill', 'color'],
  ['model.shade', 'Shading', 0, 1, 0.01],
  ['model.rim', 'Rim light', 0, 1, 0.01],
  ['model.outline', 'Outline', 0, 4, 0.1, 'px'],
  ['model.accent', 'Accent (strap, keeper, buckle)', 'color'],
  ['model.logo', 'Tibba mark on the front', 'check'],
  ['model.guides', 'Dimension guides', 'check'],
  ['View'],
  ['view.autoRotate', 'Turn slowly', 'check'],
  ['view.rotateSpeed', 'Turn speed', 0.1, 4, 0.1],
];
const get = p => p.split('.').reduce((o, k) => o[k], C);
const set = (p, v) => { const ks = p.split('.'), l = ks.pop(); ks.reduce((o, k) => o[k], C)[l] = v; };
const el = document.createElement('div'); el.id = 'tune';
el.innerHTML = `<div id="tune-head"><b>Bags</b><button id="tune-hide" title="Hide (H)">–</button></div>` + SCHEMA.map(([p, label, a, b, step, unit = '']) => {
  if (label == null) return `<p class="tune-sub">${p}</p>`;
  const id = 'b-' + p.replace('.', '-'), v = get(p);
  if (a === 'check') return `<div class="row inline"><label for="${id}">${label}<i></i></label><input type="checkbox" id="${id}"${v ? ' checked' : ''}></div>`;
  if (a === 'color') return `<div class="row"><label>${label}<i></i></label><input type="color" id="${id}" value="${v}"></div>`;
  return `<div class="row"><label>${label}<i id="v-${id}">${v}${unit}</i></label><input type="range" id="${id}" min="${a}" max="${b}" step="${step}" value="${v}" data-unit="${unit}"></div>`;
}).join('') + `<div class="tune-acts"><button class="tune-btn" id="b-reset">Reset view</button></div>` + bakeControls.html;
document.body.appendChild(el);
SCHEMA.forEach(([p, label, a]) => {
  if (label == null) return;
  const inp = el.querySelector('#b-' + p.replace('.', '-'));
  if (a === 'check') inp.addEventListener('change', () => { set(p, inp.checked); apply(); });
  else if (a === 'color') inp.addEventListener('input', () => { set(p, inp.value); apply(); });
  else inp.addEventListener('input', () => { el.querySelector('#v-b-' + p.replace('.', '-')).textContent = inp.value + inp.dataset.unit; set(p, +inp.value); apply(); });
});
el.querySelector('#b-reset').addEventListener('click', () => resetView());
el.querySelector('#tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
bakeControls.bind(el, KEY, C, 'BAGS_CONFIG');
if (window.wb && window.wb.adopt) window.wb.adopt();
window.bags = { scene, camera, controls, BAGS, showBag, resetView, CONFIG };
if (EMBED && window.parent !== window) window.parent.postMessage({ type: 'bags-ready' }, location.origin);
</script>
</body>
</html>
