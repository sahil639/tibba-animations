/* ══════════════════════════════════════════════════════════════════════════
   Our summits — 1 · Base Camp
   ─────────────────────────────────────────────────────────────────────────
   Website v3's stacking cards over the range, one summit in focus at a
   time. The summit in focus stands forward and low in the frame, right on
   the progress bar: lit, inked in its own pen, full height, a glowing dot
   pulsing at its top. The rest of the range recedes — dimmer, thinner,
   cooler, sparser, lower — with no dot and no trail. Each card plays its
   project's Rive thumbnail (assets/rive/<client>.riv) while it is the one
   in focus or under the pointer, tinted toward the summit's colour. No
   summit/sector line, altitude caption or numbers on the cards.

   Scene, state machine, panel: assets/basecamp.js (BASECAMP_CONFIG).
   Phones: the range and the progress bar docked in the bottom third; above
   them the cards scroll — a primary card (title, subtitle, the way in),
   the Rive slideshow — one project after another.
   ═════════════════════════════════════════════════════════════════════════ */
:root { --dock: 46vh; --ac: #4DD9C0; --pulse-s: 1.8s; --pulse-k: 1; --rv-tint: 0; --bg: #000; }
html, body { background: var(--bg); }
.bc-head { padding: clamp(96px, 14vh, 150px) var(--side) clamp(30px, 5vh, 60px); }
/* "Our work", set as the stats' numbers are, so the hierarchy holds */
.bc-head h2 { color: #fff; font-weight: 300; font-size: clamp(40px, 4.4vw, 84px); line-height: .95; letter-spacing: -.04em; }

#bc { position: relative; }

/* ── the scene, docked under the cards ─────────────────────────────────── */
.bc-dock { position: sticky; top: calc(100vh - var(--dock)); height: var(--dock); margin-bottom: calc(-1 * var(--dock)); z-index: 20; pointer-events: none; }
.bc-dock::before { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to top, var(--bg) 0%, rgba(0,0,0,.55) 12%, rgba(0,0,0,0) 26%); z-index: 1; }
#range { position: absolute; inset: 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent), linear-gradient(transparent, #000 22%);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent), linear-gradient(transparent, #000 22%);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
#range .fs-layer { z-index: 3; }
.bc-bar { position: absolute; z-index: 4; left: 50%; bottom: clamp(16px, 3vh, 30px); transform: translateX(-50%); width: min(52vw, 820px); pointer-events: auto; }
.bc-bar .lbl { display: flex; justify-content: center; gap: 10px; width: max-content; margin: 0 auto 12px; padding: 5px 10px; background: rgba(0,0,0,.82); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(233,236,242,.55); }
.bc-bar .sl-tabs button { color: rgba(233,236,242,.42); font-size: clamp(10.5px, .85vw, 13px); }
.bc-bar .sl-tabs button:hover { color: rgba(233,236,242,.75); }
.bc-bar .sl-tabs button.on { color: color-mix(in srgb, var(--c) 70%, rgba(233,236,242,.6)); }
.bc-bar .sl-tabs button::before { background-color: rgba(233,236,242,.16); height: 2px; }
.bc-bar .lbl b { color: var(--ac); font-weight: 400; transition: color .4s linear; }

/* the one live mark: the focused summit's dot, glowing and pulsing */
.fs-peak.bc-mark { opacity: 1; transition: opacity .5s ease; }
.fs-peak.bc-mark:not(.on) { display: none; }
.fs-peak.bc-mark.arriving { opacity: .35; }
/* a small solid dot in the summit's colour, the rings pulsing out of it */
.fs-peak.bc-mark i { left: -3px; top: -3px; width: 6px; height: 6px; background: var(--c); box-shadow: none; }
.fs-peak.bc-mark.on i { left: -3px; top: -3px; width: 6px; height: 6px; }
.fs-peak.bc-mark::before, .fs-peak.bc-mark::after { left: -3px; top: -3px; width: 6px; height: 6px; border-width: 1px;
  animation: bcPulse var(--pulse-s) cubic-bezier(.16,.62,.36,1) infinite; }
.fs-peak.bc-mark::after { animation-delay: calc(var(--pulse-s) / 2); }

/* ── the cards ─────────────────────────────────────────────────────────── */
.pn { --c: #fff; position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: var(--bg); }
.pn .in { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); gap: clamp(28px, 5vw, 96px); align-items: center;
  padding: clamp(84px, 11vh, 120px) var(--side) calc(var(--dock) * .82); transform-origin: 50% 0;
  transform: scale(calc(1 - var(--sink, 0) * .06)) translateY(calc(var(--sink, 0) * -3vh)); filter: brightness(calc(1 - var(--sink, 0) * .55)); }
.pn .txt { display: flex; flex-direction: column; gap: clamp(12px, 2vh, 22px); align-items: flex-start; }
.pn .txt .sl-title { font-size: clamp(26px, 2.7vw, 48px); }
.pn .media { display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 16px); min-height: 0; }

/* the Rive thumbnail: plays while active or hovered; tinted toward the summit.
   No border change, glow or corner marks on hover. */
.rv { position: relative; display: block; aspect-ratio: 3 / 2; max-height: calc(100vh - var(--dock) * .82 - 130px); overflow: hidden; background: #141210;
  border: 1px solid rgba(233,236,242,.1); transition: filter .5s ease; }
.rv .wk-img { position: absolute; inset: 0; height: 100%; aspect-ratio: auto; }
.rv .rv-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; transition: opacity .5s linear; }
.rv.rv-live .rv-canvas { opacity: 1; }

.pn:not(.active):not(.hovered) .rv { filter: grayscale(.7) brightness(.62); }

/* ── phones: the cards scroll in the top two-thirds; the range and the
   progress bar are docked in the bottom third the whole way through ─── */
:root.bc-phone { --mdock: 33vh; }
@supports (height: 1svh) { :root.bc-phone { --mdock: 33svh; } }
.bc-phone .bc-dock { top: calc(100vh - var(--mdock)); top: calc(100svh - var(--mdock)); height: var(--mdock); margin-bottom: calc(-1 * var(--mdock));

.bc-phone .bc-dock::before { display: none; }
.bc-phone #range { inset: 0 0 var(--barh, 40px) 0; -webkit-mask-image: none; mask-image: none; pointer-events: auto; }
.bc-phone .bc-bar { pointer-events: auto; left: 0; right: 0; transform: none; width: auto; bottom: 0; padding: 0 var(--side) 12px; background: var(--bg); }   /* a plain strip, no fade, its progress line right under the range */
.bc-phone .sl-tabs button { font-size: 9.5px; letter-spacing: .02em; } .bc-phone .sl-tabs button::before { margin-bottom: 8px; }
.bc-phone #bc-panel { display: none; }
.bc-phone .bc-head { padding: 92px var(--side) 18px; }
.bc-phone #stack { display: flex; flex-direction: column; gap: 48px; padding: 6px var(--side) calc(var(--mdock) + 40px); }
.bc-phone .pn { position: relative; height: auto; overflow: visible; background: none; box-shadow: none; }
.bc-phone .pn + .pn { box-shadow: none; }
.bc-phone .pn .in { position: relative; inset: auto; display: flex; flex-direction: column; gap: 12px; padding: 0; transform: none; filter: none; }
/* the primary card: title, subtitle, the way in */
.bc-phone .pn .txt { gap: 12px; padding: 20px 18px 22px; background: #151413; border: 1px solid rgba(233,236,242,.1); border-top: 2px solid var(--c); }
.bc-phone .pn .txt .sl-title { font-size: clamp(22px, 6.2vw, 30px); }
.bc-phone .pn .sl-tags { display: none; }
.bc-phone .pn .sl-body { font-size: 13.5px; }
.bc-phone .pn .btn-p { padding: 12px 16px; font-size: 11px; }

.bc-phone .pn .media { gap: 12px; }
.bc-phone .rv { max-height: none; }
@media (prefers-reduced-motion: reduce) { .fs-peak.bc-mark::before, .fs-peak.bc-mark::after { animation: none; opacity: 0; } }

/* ── Nov 2026: the range as a small box, docked top-right ─────────────────
   The big mountain under the cards is gone; the same live range sits in a
   small framed box at the top right of the section while its cards pass,
   still flying summit to summit. The cards keep their places. The box is
   sized in px with its own aspect, so the range is never stretched. */
.bc-dock { top: 84px; width: clamp(220px, 22vw, 320px); height: clamp(140px, 14vw, 200px); margin: 0 var(--side) calc(-1 * clamp(140px, 14vw, 200px)) auto;
  z-index: 30; border: 1px solid rgba(233,236,242,.14); background: #000; pointer-events: none; }
.bc-dock::before { display: none; }
#range { -webkit-mask-image: none; mask-image: none; }
.bc-bar, #bc-panel { display: none !important; }
.pn .in { padding-bottom: clamp(56px, 8vh, 96px); }
.rv { max-height: calc(100vh - 230px); }
.bc-phone .bc-dock { top: 66px; width: 44vw; height: calc(44vw * .62); margin: 0 var(--side) calc(-1 * 44vw * .62) auto; }
.bc-phone #range { inset: 0; }
.bc-phone #stack { padding-bottom: 48px; }

  /* Base Camp with the ridges shaded in layers and the raised view (desktop);
     phones keep their locked settings. Its own bake. (A classic script: a
     module's imports would run before these were set.) */

    style: { contrast: 0.75, dim: 0.8, fill: '#151A27' }, layers: { on: true, lift: 0 } };
  window.BASECAMP_KEY = 'tibba.bake.basecamp-layered';
