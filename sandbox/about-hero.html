/* ══════════════════════════════════════════════════════════════════════════
   About us — hero: the ascent
   ─────────────────────────────────────────────────────────────────────────
   Two things only: the title, and one camera move up a very large
   mountain (assets/about-ascent.js). The mountain is the Firstpost summit
   from the home page's Our Summits section, inked and lit as Base Camp
   lights its summit in focus, with rocks and smaller landforms round it.
   The camera starts low at the foot among the rocks, glides forward, tilts
   up the face, climbs it past the cliffs, and comes out over the summit,
   where it holds — 1200ms by default, one continuous move.

   The title sits on a soft floor of black on the left so it reads over the
   terrain at every moment of the move, and comes up as the camera arrives.
   ═════════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; background: #000; }
body { color: var(--ink-warm); font-family: 'F37 Analog', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.hero { position: relative; overflow: hidden; height: 100vh; height: 100svh; min-height: 560px; background: #000; color: #f1eee7; isolation: isolate; }
#ascent { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
/* the floor the title stands on: black from the left and the foot, so the
   line work never runs through the letters */
.hero::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.86) 0%, rgba(0,0,0,.62) 30%, rgba(0,0,0,0) 56%),
              linear-gradient(0deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 34%); }
.statement { position: absolute; z-index: 2; left: var(--gut); top: 50%; transform: translateY(-46%); margin: 0; pointer-events: none;
  color: #fff; font-weight: 300; text-transform: uppercase; font-size: clamp(52px, 8.2vw, 168px); line-height: .9; letter-spacing: -.05em;
  text-shadow: 0 2px 30px rgba(0,0,0,.6); }
.statement .ln { display: flex; gap: .25em; overflow: hidden; }
.statement .ln > span { display: block; transform: translateY(105%); transition: transform 1s cubic-bezier(.22,1,.36,1); }
.statement .ln:nth-child(2) > span { transition-delay: .08s; }
.statement .ln:nth-child(3) > span { transition-delay: .16s; }
.statement em { font-style: normal; color: var(--accent); }
.hero.in .statement .ln > span { transform: none; }
/* the summit's dot (assets/about-ascent.js places it): a white core in a
   soft glow, two rings pulsing out — Base Camp's live mark */
.asc-dot { position: absolute; left: 0; top: 0; z-index: 1; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .3s linear; }
.asc-dot::before { content: ''; position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 4px rgba(159,176,232,.18), 0 0 22px 6px rgba(238,241,248,.4); }
.asc-dot::after { content: ''; position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(238,241,248,.8);
  animation: asc-ping 1.8s cubic-bezier(.16,.62,.36,1) infinite; }
@keyframes asc-ping { from { transform: scale(1); opacity: .9; } to { transform: scale(4.4); opacity: 0; } }
@media (max-width: 760px) {
  .hero::after { background: linear-gradient(0deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 38%, rgba(0,0,0,0) 62%); }
  .statement { top: auto; bottom: 10%; right: var(--gut); transform: none; font-size: clamp(44px, 14vw, 72px); }
  .statement .ln { display: block; } .statement .ln > span { display: inline-block; } .statement .ln > span:first-child { margin-right: .24em; }
}
@media (prefers-reduced-motion: reduce) { .statement .ln > span { transition: none; transform: none; } .asc-dot::after { animation: none; } }

<body>
<!-- ─────────────────────────────────────────────────────────────────────────
     About us — hero
     The title, and the ascent: one camera move from the foot of the
     Firstpost summit (as on the home page) to its top (assets/about-ascent.js).
     ───────────────────────────────────────────────────────────────────── -->
<header id="ca-header"></header>
<main class="hero" id="hero" aria-labelledby="about-h">
  <canvas id="ascent" aria-hidden="true"></canvas>
  <h1 class="statement" id="about-h"><span class="ln"><span>Tibba means</span></span><span class="ln"><span>a higher</span></span><span class="ln"><span>place<em>.</em></span></span></h1>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.min.js","three/addons/":"https://unpkg.com/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
  /* Website v3's navbar, the same as the home page's (assets/site-nav.js) */
  import { mountSiteNav } from './assets/site-nav.js';
  mountSiteNav(document.getElementById('ca-header'), { current: 'About' });
</script>
<script type="module">
  import { mountAscent, ASCENT } from './assets/about-ascent.js';
  const hero = document.getElementById('hero');
  const a = mountAscent(document.getElementById('ascent'), hero);
  window.tibbaAscent = a;
  /* the title comes up as the camera arrives over the summit */
  const showTitle = () => hero.classList.add('in');
  a.onEnd(showTitle);
  setTimeout(showTitle, ASCENT.duration * 1000 * 0.7);

  /* ── the panel: the mountain's shape, and the move ──────────────────── */
  const el = document.createElement('div');
  el.id = 'tune';
  const R = (id, label, min, max, step, val) => `<div class="row"><label>${label}<i id="v-${id}">${val}</i></label><input type="range" id="s-${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
  el.innerHTML = `<div id="tune-head"><b>About hero — ascent</b><button id="tune-hide" title="Hide (H)">–</button></div>
    <p class="tune-sub">Playback</p>
    <div class="row inline"><label>Move<i></i></label><span><button class="tune-btn" id="b-play">Play</button> <button class="tune-btn" id="b-pause">Pause</button> <button class="tune-btn" id="b-restart">Restart</button></span></div>
    ${R('u', 'Scrub', 0, 1, .001, 1)}
    ${R('du', 'Duration (s)', .6, 6, .05, ASCENT.duration)}
    <div class="row"><label>Timing<i></i></label><select id="s-ease">
      <option value=".55,0,.15,1" selected>Accelerate, ease out (default)</option>
      <option value=".65,0,.35,1">Ease in-out</option>
      <option value=".4,0,.2,1">Gentle</option>
      <option value="0,0,1,1">Linear</option></select></div>
    <p class="tune-sub">The mountain</p>
    ${R('h', 'Summit height', .8, 1.6, .02, ASCENT.height)}
    ${R('rs', 'Rest of the range', .2, 1, .02, ASCENT.rest)}
    ${R('fr', 'Summit across frame', -.2, .4, .01, ASCENT.frame)}
    <p class="tune-sub">Topography</p>
    ${R('rl', 'Ground relief', 0, 16, .5, ASCENT.relief)}
    ${R('fc', 'Landforms', 0, 40, 1, ASCENT.fill.count)}
    ${R('fh', 'Landform height', .2, 1.2, .02, ASCENT.fill.height)}
    ${R('fs', 'Landform seed', 1, 99, 1, ASCENT.fill.seed)}
    ${R('lv', 'Contour density', 20, 80, 1, ASCENT.levels)}
    <p class="tune-sub">Rocks</p>
    ${R('rk', 'Rocks', 0, 160, 1, ASCENT.rocks)}
    ${R('rz', 'Rock size', .4, 2.5, .05, ASCENT.rockSize)}`;
  document.body.appendChild(el);
  const q = id => el.querySelector('#' + id);
  let deb = 0;
  const later = fn => { clearTimeout(deb); deb = setTimeout(fn, 180); };
  const bind = (id, fn, slow) => q('s-' + id).addEventListener('input', e => { const v = +e.target.value; q('v-' + id).textContent = v; slow ? later(() => fn(v)) : fn(v); });
  q('b-play').addEventListener('click', () => a.play());
  q('b-pause').addEventListener('click', () => a.pause());
  q('b-restart').addEventListener('click', () => { hero.classList.remove('in'); a.restart(); setTimeout(showTitle, ASCENT.duration * 700); });
  bind('u', v => a.scrub(v));
  a.onState(u => { if (a.playing) { q('s-u').value = u; q('v-u').textContent = u.toFixed(2); } });
  bind('du', v => { ASCENT.duration = v; });
  q('s-ease').addEventListener('change', e => a.setEase(e.target.value.split(',').map(Number)));
  bind('h', v => a.reshape({ height: v }), true);
  bind('rs', v => a.reshape({ rest: v }), true);
  bind('fr', v => a.reshape({ frame: v }), true);
  bind('rl', v => a.reshape({ relief: v }), true);
  bind('fc', v => a.reshape({ fill: { count: v } }), true);
  bind('fh', v => a.reshape({ fill: { height: v } }), true);
  bind('fs', v => a.reshape({ fill: { seed: v } }), true);
  bind('lv', v => a.reshape({ levels: v }), true);
  bind('rk', v => a.reshape({ rocks: v }), true);
  bind('rz', v => a.reshape({ rockSize: v }), true);
  q('tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
  if (window.wb && window.wb.adopt) window.wb.adopt();
</script>
