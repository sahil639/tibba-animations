/* ══════════════════════════════════════════════════════════════════════════
   About us — hero: the ascent
   ─────────────────────────────────────────────────────────────────────────
   Two things only: the title, and one camera move up a very large
   mountain (assets/about-ascent.js). The mountain is the Firstpost summit
   from the home page's Our Summits section, inked and lit as Base Camp
   lights its summit in focus, with rocks and smaller landforms round it.
   The camera starts low at the foot among the rocks, glides forward, tilts
   up the face, climbs it past the cliffs, and comes out over the summit,
   where it holds — 1200ms by default, one continuous move.

   The title sits on a soft floor of black on the left so it reads over the
   terrain at every moment of the move, and comes up as the camera arrives.
   ═════════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; background: #000; }
body { color: var(--ink-warm); font-family: 'F37 Analog', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.hero { position: relative; overflow: hidden; height: 100vh; height: 100svh; min-height: 560px; background: #000; color: #f1eee7; isolation: isolate; }
.mt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; display: block;
  opacity: 0; animation: mt-in 1.2s linear .1s forwards; }
@keyframes mt-in { to { opacity: 1; } }
.asc-dot.on { opacity: 1; }
/* phones: not a full screen — the next section shows at the foot */
@media (max-width: 760px) { .hero { height: 85vh; height: 85svh; min-height: 480px; } }
/* the floor the title stands on: black from the left and the foot, so the
   line work never runs through the letters */
.hero::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.86) 0%, rgba(0,0,0,.62) 30%, rgba(0,0,0,0) 56%),
              linear-gradient(0deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 34%); }
.statement { position: absolute; z-index: 2; left: var(--gut); top: 50%; transform: translateY(-46%); margin: 0; pointer-events: none;
  color: #fff; font-weight: 300; text-transform: uppercase; font-size: clamp(52px, 8.2vw, 168px); line-height: .9; letter-spacing: -.05em;
  text-shadow: 0 2px 30px rgba(0,0,0,.6); }
.statement .ln { display: flex; gap: .25em; overflow: hidden; }
.statement .ln > span { display: block; transform: translateY(105%); transition: transform 1s cubic-bezier(.22,1,.36,1); }
.statement .ln:nth-child(2) > span { transition-delay: .08s; }
.statement .ln:nth-child(3) > span { transition-delay: .16s; }
.statement em { font-style: normal; color: var(--accent); }
.hero.in .statement .ln > span { transform: none; }
/* the summit's dot (assets/about-ascent.js places it): a white core in a
   soft glow, two rings pulsing out — Base Camp's live mark */
.asc-dot { position: absolute; left: 0; top: 0; z-index: 1; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .3s linear; }
.asc-dot::before { content: ''; position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 4px rgba(159,176,232,.18), 0 0 22px 6px rgba(238,241,248,.4); }
.asc-dot::after { content: ''; position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(238,241,248,.8);
  animation: asc-ping 1.8s cubic-bezier(.16,.62,.36,1) infinite; }
@keyframes asc-ping { from { transform: scale(1); opacity: .9; } to { transform: scale(4.4); opacity: 0; } }

<!-- ─────────────────────────────────────────────────────────────────────────
     About us — hero
     The title, and the ascent: one camera move from the foot of the
     Firstpost summit (as on the home page) to its top (assets/about-ascent.js).
     ───────────────────────────────────────────────────────────────────── -->
<header id="ca-header"></header>
<main class="hero" id="hero" aria-labelledby="about-h">
  <picture class="mt"><source media="(max-width: 760px)" srcset="assets/about/hero-mountain-phone.webp"><img id="mt" src="assets/about/hero-mountain.webp" alt="" fetchpriority="high" decoding="async"></picture>
  <canvas id="peak-canvas"></canvas>
  <i class="asc-dot on" id="dot" aria-hidden="true"></i>
  <h1 class="statement" id="about-h"><span class="ln"><span>Tibba means</span></span><span class="ln"><span>a higher</span></span><span class="ln"><span>place<em>.</em></span></span></h1>
</main>
<script type="module">
  /* Website v3's navbar, the same as the home page's (assets/site-nav.js) */
  import { mountSiteNav } from './assets/site-nav.js';
  mountSiteNav(document.getElementById('ca-header'), { current: 'About' });
</script>
<script>
  /* Nov 2026: the ascent is a still now — the same summit, rendered once
     (assets/about/hero-mountain[-phone].webp), light to load and with
     nothing running while the page scrolls. The dot pulses on the peak:
     where it stands in each render, carried through object-fit: cover. */
  const hero = document.getElementById('hero'), img = document.getElementById('mt'), dot = document.getElementById('dot');
  const PEAK = () => matchMedia('(max-width: 760px)').matches ? [0.5, 0.11] : [0.5, 0.153];
  function place() {
    if (!img.naturalWidth) return;
    const cw = hero.clientWidth, ch = hero.clientHeight, iw = img.naturalWidth, ih = img.naturalHeight, k = Math.max(cw / iw, ch / ih), [px, py] = PEAK();
    dot.style.transform = `translate(${(cw - iw * k) / 2 + px * iw * k}px, ${(ch - ih * k) / 2 + py * ih * k}px)`;
  }
  const still = () => !hero.classList.contains('live');
  img.complete ? still() && place() : img.addEventListener('load', () => still() && place());
  new ResizeObserver(() => still() && place()).observe(hero);
  requestAnimationFrame(() => hero.classList.add('in'));
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script type="module">
  /* desktop: the home hero's scene (assets/range-scene.js), another summit
     in place of the studio's massif, the dot pulsing on its top */
  if (!matchMedia('(max-width: 760px)').matches) {
    const { createRangeScene } = await import('./assets/range-scene.js');
    const { LANDFORM_LIBRARY } = await import('./assets/landform.js');
    const hero = document.getElementById('hero'), dot = document.getElementById('dot');
    /* a lone steep horn on a wide apron: one clear summit, smooth like the home peak */
    const PEAK = { x: 0, z: 0, h: 44, spread: 40, seed: 52.3, rot: 0.5, aniso: 1.08, warp: 10,
      spur: 0.18, spurF: 2.6, flute: 0.04, fluteF: 9,
      parts: [ { dx: 0, dz: 0, h: 26, spread: 15, sharp: 1.5, aniso: 1.05 },
               { dx: 3, dz: 5, h: 12, spread: 26, sharp: 2.2, aniso: 1.15 },
               { dx: -4, dz: 14, h: 12, spread: 44, mesa: 0.55, aniso: 1.3 },
               { dx: -20, dz: 8, h: 6, spread: 22, mesa: 0.5, aniso: 1.1 } ] };
    const scene = createRangeScene({ canvas: document.getElementById('peak-canvas'), mode: 'hero', ink: false, palette: 'peak', backdrop: 'behind',
      hover: false, mainPeak: PEAK });
    scene.setAccent('#C9124B'); scene.setDepth(0.22); scene.setHover(false); scene.setFill(null);
    const CAM = { elev: 24, azim: -10, dist: 160, tgtX: -38, tgtY: 22 };
    window.tibba = { scene, CAM };
    hero.classList.add('live');
    (function frame() {
      requestAnimationFrame(frame);
      scene.setHeroCam(CAM);
      const s = scene.summitScreen();
      if (!s.behind) dot.style.transform = `translate(${s.x}px, ${s.y + 6}px)`;
    })();
  }
</script>
