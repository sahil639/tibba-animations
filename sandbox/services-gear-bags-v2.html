<script type="module">

    { label: 'Early-stage startup', outcome: 'From idea to a product people want.', line: 'Pack light, move fast',

        { name: 'Product strategy',   icon: 'product-strategy',  line: 'Decide what to build first, and why.' },

    const body = document.querySelector('.gs-body'), slot = tiersEl.parentNode;
    const gap = () => root.classList.contains('wb-embed') && window.parent !== window ? 72 : 10;
    function check() {
      let dock = false, show = false;
      if (phone.matches) {
        const g = gap(), sr = slot.getBoundingClientRect(), br = body.getBoundingClientRect();
        dock = sr.top < g && br.bottom > g + tiersEl.offsetHeight + 80;
        show = br.top < innerHeight - 120 && br.bottom > innerHeight * .45;
        /* in the site the frame slides away at the page's foot: let go as it starts to */
        let fe = null; try { fe = window.frameElement; } catch {}
        if (fe && fe.getBoundingClientRect().top < -24) { dock = false; show = false; }
        root.style.setProperty('--dock-top', g + 'px');
      }
      root.classList.toggle('bag-float', show);
      if (dock === slot.classList.contains('docked')) return;
      slot.style.height = dock ? tiersEl.offsetHeight + 'px' : '';
      slot.classList.toggle('docked', dock);
    }
    addEventListener('scroll', check, { passive: true });
    addEventListener('resize', check);
    phone.addEventListener('change', check);
    try { if (window.parent !== window) window.parent.addEventListener('scroll', check, { passive: true }); } catch {}
    check();
  }

  /* ── the panel ───────────────────────────────────────────────────── */
  const el = document.createElement('div'); el.id = 'tune';
  const R = (id, label, min, max, step, val, unit = '') => `<div class="row"><label>${label}<i id="v-${id}">${val}${unit}</i></label><input type="range" id="s-${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></div>`;
  el.innerHTML = `<div id="tune-head"><b>Services — gear bags</b><button id="tune-hide" title="Hide (H)">–</button></div>
    <p class="tune-sub">Services</p><div class="row inline"><label for="s-ic">Hide icons<i></i></label><input type="checkbox" id="s-ic"${C.icons ? '' : ' checked'}></div>
    <div class="row inline"><label for="s-nx">Engagement + call to action<i></i></label><input type="checkbox" id="s-nx"${C.next ? ' checked' : ''}></div>
    ${bakeControls.html}`;
  document.body.appendChild(el);
  const q = id => el.querySelector('#' + id);
  const bind = (id, fn) => q('s-' + id).addEventListener('input', e => { const v = +e.target.value; q('v-' + id).textContent = v + e.target.dataset.unit; fn(v); });
  q('s-ic').addEventListener('change', e => { C.icons = !e.target.checked; showIcons(); });
  q('s-nx').addEventListener('change', e => { C.next = e.target.checked; showNext(); });
  bakeControls.bind(el, KEY, C, 'GEAR_CONFIG');
  q('tune-hide').addEventListener('click', () => el.classList.toggle('hidden'));
  if (window.wb && window.wb.adopt) window.wb.adopt();
</script>
</body>
</html>
